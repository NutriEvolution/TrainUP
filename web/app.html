    case "testBack": { const st = curStep(); const ex = EX[R.blocks[R.bi].items[st.ii].ex]; const reps = readNum("inReps") ?? 0; const kg = roundStep(R.test.kg8*0.9, ex.step); R.log[R.bi][st.ii].sets.push({kg, reps, label:"richiamo"}); R.test.back++; R.inReps = null; if(reps < 8 || R.test.back >= 5) endTestEx(); else { R.afterRest = "test"; startRest(60); } break; }
    case "testEnd": endTestEx(); break;
    case "mxMode": R.mx.mode = d.v; rRender(); break;
    case "mxTry": { const st = curStep(); const kg = readNum("inKg"); if(kg == null || kg <= 0) break; const T = R.mx; const reps = T.mode === "rm" ? (readNum("inReps") ?? 0) : (d.v === "1" ? 1 : 0);
      T.tries.push({kg, ok:d.v === "1" && reps >= 1, reps}); R.log[R.bi][st.ii].sets.push({kg, reps, label:T.mode === "rm" ? "serie" : "tentativo"}); R.inKg = null; R.afterRest = "max"; startRest(300); break; }
    case "mxEnd": { const st = curStep(); const T = R.mx; const v = T.mode === "1rm" ? Math.max(...T.tries.filter(z => z.ok).map(z => z.kg)) : Math.round(Math.max(...T.tries.filter(z => z.reps >= 1 && z.reps <= 5).map(z => e1rm(z.kg, z.reps)))); R.log[R.bi][st.ii].kg1 = v; endTestEx(); break; }
    case "mxSkip": endTestEx(); break;
    case "finish": finishSession(); break;
    case "setWhere": S.settings.where = d.v; pushMeta(); render(); break;
    case "clearFutureSet": if(confirm("Togliere i giorni di palestra segnati da domani in poi?")){ const t = todayStr(); for(const k of Object.keys(S.planned)) if(k > t) delete S.planned[k]; pushMeta(); render(); } break;
    case "openSettings": if(view !== "impostazioni"){ setPrev = view; view = "impostazioni"; render(); window.scrollTo(0,0); } break;
    case "exTab": exTab = d.v; exSheet(d.k, mediaSheet && mediaSheet.slot); break;
    case "goGuida": view = "guida"; render(); window.scrollTo(0,0); break;
    case "setSubOpen": setSub = d.v; render(); window.scrollTo(0,0); break;
    case "setSubClose": setSub = null; render(); window.scrollTo(0,0); break;
    case "setTheme": S.settings.theme = d.v; pushMeta(); applyTheme(); render(); break;
    case "goGuidaTab": guideTab = d.v; view = "guida"; render(); window.scrollTo(0,0); break;
    case "goAltro": case "backSettings": view = "impostazioni"; planOpen = null; planFrom = null; render(); window.scrollTo(0,0); break;
    case "goOggi": view = "oggi"; render(); window.scrollTo(0,0); break;
    case "goPiani": { const L = planSports(); if(L.length === 1){ planOpen = L[0]; planFrom = "piani"; view = "piano"; } else view = "piani"; render(); window.scrollTo(0,0); break; }
    case "closeSettings": view = setPrev || "oggi"; render(); window.scrollTo(0,0); break;
    case "setProgram": { const v = d.v === "pi" ? (S.settings.piSub === "faleev" ? "faleev" : "liparoti") : d.v; if(v !== "principi") S.settings.piSub = v; if((S.settings.program || "liparoti") !== v){ S.settings.program = v; } pushMeta(); render(); break; }
    case "genSplit": { const g = {...(S.settings.gen || {})}; g.split = {...(g.split || {}), [d.n]:Number(d.v)}; S.settings.gen = g; pushMeta(); render(); break; }
    case "genSpecPick": { const g = {...(S.settings.gen || {})}; let a = (g.specSel || []).slice(); a = a.includes(d.v) ? a.filter(x => x !== d.v) : a.concat([d.v]).slice(-2); g.specSel = a; S.settings.gen = g; render(); break; }
    case "genSpecStart": { const g = {...(S.settings.gen || {})}; g.spec = {m:(g.specSel || []).slice(0, 2), start:mondayStr(todayStr())}; g.specSel = []; S.settings.gen = g; pushMeta(); render(); break; }
    case "genSpecStop": if(confirm("Tornare alla fase bilanciata?")){ const g = {...(S.settings.gen || {})}; g.spec = null; S.settings.gen = g; pushMeta(); render(); } break;
    case "genLevel": S.settings.level = d.v; S.settings.levelChosen = true; pushMeta(); render(); break;
    case "genGoal": S.settings.gen = {...(S.settings.gen || {}), goal:d.v}; pushMeta(); render(); break;
    case "genVol": S.settings.gen = {...(S.settings.gen || {}), vol:Number(d.v)}; pushMeta(); render(); break;
    case "deloadCheck": showSheet(deloadCheckHtml()); break;
    case "dlLip": showSheet(dlLipHtml()); break;
    case "dlSel": dlSel = d.v; render(); if(PS) showSheet(preStartHtml()); break;
    case "dlPick": dlSel = d.v; if(PS) showSheet(preStartHtml()); else { closeSheet(); render(); } break;
    case "dlAns": { const b = document.querySelectorAll("#sheet [data-dl]"); const yes = [...b].filter(x => x.checked).length; $("#dlOut").innerHTML = yes >= 2 ? `<b>Sì a ${yes} domande:</b> il libro suggerisce di valutare una settimana di scarico: se la fai, attiva l'interruttore "Settimana di scarico" nelle sedute di questa settimana.` : `<b>Sì a ${yes} ${yes === 1 ? "domanda" : "domande"}:</b> vai avanti normalmente.`; break; }
    case "openPlan": planFrom = view === "piani" ? "piani" : null; planOpen = d.v; view = "piano"; render(); window.scrollTo(0,0); break;
    case "closePlan": planOpen = null; if(planFrom){ view = planSports().length > 1 ? "piani" : "impostazioni"; planFrom = null; } render(); window.scrollTo(0,0); break;
    case "goWeek": closeSheet(); view = "piano"; planOpen = null; wkOpen = true; render(); window.scrollTo(0,0); break;
    case "wkTog": { if(!weekDraft) weekDraft = JSON.parse(JSON.stringify(weekSaved())); const v = Number(d.v); let a = weekDraft[d.k]; a = a.includes(v) ? a.filter(x => x !== v) : a.concat([v]); if(d.k === "vb"){ const max = vbCfg().season ? 1 : 2; if(a.length > max) a = a.slice(-max); } weekDraft[d.k] = a; render(); break; }
    case "setPrio": S.settings.combo = {...(S.settings.combo || {}), priority:d.v}; weekDraft = null; pushMeta(); render(); break;
    case "wkPropose": { if(!weekDraft) weekDraft = JSON.parse(JSON.stringify(weekSaved())); const P = RUN_PLANS[runCfg().plan]; const g = weekDraft.priority === "corsa" ? 2 : 3; let r = weekDraft.run.length || 3; r = Math.min(Math.max(r, P.days[0]), P.days[P.days.length-1]); if(weekDraft.priority === "palestra" && P.days[0] <= 3) r = Math.min(r, 3); const x = comboPropose(g, r, weekDraft.priority); weekDraft.gym = x.gymDays; weekDraft.run = x.runDays; render(); break; }
    case "wkCancel": weekDraft = null; render(); break;
    case "wkSave": if(!weekDraft) weekDraft = JSON.parse(JSON.stringify(weekSaved())); if(weekErrors(weekDraft).length) break; weekSave(); wkOpen = false; render(); break;
    case "goSwaps": planOpen = "palestra"; view = "piano"; render(); setTimeout(() => { const el = $("#cambiati"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }, 50); break;
    case "vbSetup": { const c = vbCfg() || {}; vbDraft = {level:c.level || "principiante", season:!!c.season, days:(c.days || [1,4]).slice(), ball:c.ball}; showSheet(vbSetupSheet()); break; }
    case "vbLv": vbDraft.level = d.v; vbDraft.ball = $("#vbBall").checked; showSheet(vbSetupSheet()); break;
    case "vbSeason": vbDraft.season = d.v === "1"; vbDraft.ball = $("#vbBall").checked; showSheet(vbSetupSheet()); break;
    case "vbConfirm": { const t = todayStr(); const nm = (() => { const x = parseYmd(mondayStr(t)); x.setDate(x.getDate()+7); return ymd(x); })(); const c = vbCfg() || {};
      const same = c.on && c.level === vbDraft.level && !!c.season === vbDraft.season;
      const want = vbDraft.season ? 1 : 2, od = (c.days || []).slice(); const vdays = od.length === want && !od.some(x => od.includes((x+1)%7)) ? od : pickDays(want, busyDays("vb"), true);
      S.settings.volley = {on:true, level:vbDraft.level, season:vbDraft.season, days:vdays.sort((a,b) => a-b), ball:$("#vbBall").checked, start: same && c.start ? c.start : (dowOf(t) <= 1 ? mondayStr(t) : nm)};
      if(!(S.settings.activities||[]).includes("pallavolo")) S.settings.activities = (S.settings.activities||[]).concat(["pallavolo"]);
      pushMeta(); vbDraft = null; closeSheet(); weekDraft = null; view = "piano"; planOpen = "pallavolo"; render(); window.scrollTo(0,0); break; }
    case "vbStop": if(confirm("Togliere il programma di salto e rapidità? Le sedute registrate restano.")){ S.settings.volley = {...(vbCfg()||{}), on:false}; pushMeta(); render(); } break;
    case "vbInfo": { const ss = vbSession(Number(d.w), d.k); showSheet(`<div class="grab"></div><div class="stack"><div class="row between"><div><span class="eyebrow">Settimana ${ss.w+1} · seduta ${ss.k}</span><h2>${esc(ss.title)}</h2></div><button class="btn icon ghost" data-act="closeSheet" aria-label="Chiudi">${svgI.close}</button></div><p class="small muted">~${vbMin(ss)} minuti · ${esc(ss.ph)}</p>${vbDetailHtml(ss)}</div>`); break; }
    case "vbEx": vbExSheet(d.k, d.t); break;
    case "vbLog": rlRpe = null; showSheet(vbLogForm(d.d)); break;
    case "vbSave": vbSave(d.d); closeSheet(); render(); break;
    case "bkSetup": { const c = bkCfg() || {}; bkDraft = {power:!!c.power, ftp:c.ftp, fthr:c.fthr, days:(c.days || [1,3,5]).slice()}; showSheet(bkSetupSheet()); break; }
    case "bkPower": { const f = $("#bkFtp"), h2 = $("#bkFthr"); if(f) bkDraft.ftp = numOf(f.value); if(h2) bkDraft.fthr = numOf(h2.value); bkDraft.power = d.v === "1"; showSheet(bkSetupSheet()); break; }
    case "bkConfirm": { const f = $("#bkFtp"), h2 = $("#bkFthr"); const ftp = f ? numOf(f.value) : null, fthr = h2 ? numOf(h2.value) : null; const t = todayStr(); const nm = (() => { const x = parseYmd(mondayStr(t)); x.setDate(x.getDate()+7); return ymd(x); })(); const c = bkCfg() || {};
      S.settings.bike = {...c, on:true, power:bkDraft.power, ftp: ftp && ftp > 50 && ftp < 600 ? Math.round(ftp) : (bkDraft.power ? c.ftp : c.ftp), fthr: fthr && fthr > 100 && fthr < 220 ? Math.round(fthr) : c.fthr, days:((c.days || []).length >= 3 && c.days.length <= 5 ? c.days.slice() : pickDays(3, busyDays("bk"), false)).sort((a,b) => a-b), start: c.on && c.start ? c.start : (dowOf(t) <= 1 ? mondayStr(t) : nm)};
      if(!(S.settings.activities||[]).includes("ciclismo")) S.settings.activities = (S.settings.activities||[]).concat(["ciclismo"]);
      pushMeta(); bkDraft = null; closeSheet(); weekDraft = null; view = "piano"; planOpen = "ciclismo"; render(); window.scrollTo(0,0); break; }
    case "bkStop": if(confirm("Togliere il piano di ciclismo? Le uscite registrate restano.")){ S.settings.bike = {...(bkCfg()||{}), on:false}; pushMeta(); render(); } break;
    case "bkInfo": { const ss = bkWeekPlan(Number(d.w))[Number(d.dw)]; showSheet(`<div class="grab"></div><div class="stack"><div class="row between"><div><span class="eyebrow">Settimana ${Number(d.w)+1} · ${DOW_N[Number(d.dw)]}</span><h2>${esc(ss.title)}</h2></div><button class="btn icon ghost" data-act="closeSheet" aria-label="Chiudi">${svgI.close}</button></div><p class="small muted">${bkH(bkMin(ss))} · ${esc(BK_WEEKS[Number(d.w)].ph)}</p>${bkDetailHtml(ss)}</div>`); break; }
    case "bkLog": rlRpe = null; showSheet(bkLogForm(d.d)); break;
    case "bkSave": { const r = bkSave(d.d); closeSheet(); render(); if(r.p20 || r.h20) setTimeout(() => showSheet(`<div class="grab"></div><div class="stack"><h2>Soglia aggiornata</h2><p>${r.p20 ? `FTP: <b>${Math.round(r.p20*0.95)} W</b> (${r.p20} W meno il 5%). ` : ""}${r.h20 ? `FC di soglia stimata: <b>${r.h20}</b>.` : ""} Le prossime sedute usano i nuovi valori.</p><button class="btn primary big" data-act="closeSheet">Ok</button></div>`), 50); break; }
    case "runPlans": showSheet(runPlansSheet()); break;
    case "runPick": { const P = RUN_PLANS[d.v]; const c = runCfg() || {}; const t = todayStr(); const nm = (() => { const x = parseYmd(mondayStr(t)); x.setDate(x.getDate()+7); return ymd(x); })();
      const days = c.days && c.days.length >= P.days[0] && c.days.length <= P.days[P.days.length-1] ? c.days.slice() : pickDays(P.days[0], busyDays("run"), false);
      runSetup = {plan:d.v, days, start: dowOf(t) <= 1 ? mondayStr(t) : nm, raceDate:null}; showSheet(runSetupSheet()); break; }
    case "runStartWk": runSetup.start = d.v; showSheet(runSetupSheet()); break;
    case "runConfirm": { const r = $("#rsRace"); const P = RUN_PLANS[runSetup.plan]; if(r) runSetup.raceDate = r.value || null;
      let start = runSetup.start; if(P.race && runSetup.raceDate){ const x = parseYmd(mondayStr(runSetup.raceDate)); x.setDate(x.getDate() - 7*(P.weeks.length-1)); start = ymd(x); }
      const c = runCfg() || {}; S.settings.run = {...c, plan:runSetup.plan, days:runSetup.days.slice().sort((a,b) => a-b), start, raceDate: P.race ? runSetup.raceDate : null};
      if(!(S.settings.activities||[]).includes("corsa")) S.settings.activities = (S.settings.activities||[]).concat(["corsa"]);
      pushMeta(); runSetup = null; closeSheet(); weekDraft = null; view = "piano"; planOpen = "corsa"; render(); window.scrollTo(0,0); break; }
    case "runStop": if(confirm("Togliere il piano di corsa? Le corse registrate restano.")){ S.settings.run = {...(runCfg()||{}), plan:null}; pushMeta(); render(); } break;
    case "runInfo": runInfoSheet(Number(d.w), Number(d.dw)); break;
    case "vdotOpen": vdotSheet.d = 5000; showSheet(vdotSheet()); break;
    case "vdDist": { const tv = $("#vdTime").value, hv = $("#vdHr").value; vdotSheet.d = Number(d.v); showSheet(vdotSheet()); $("#vdTime").value = tv; $("#vdHr").value = hv; break; }
    case "vdSave": { const tt = parseDur($("#vdTime").value), hr = numOf($("#vdHr").value); const c = runCfg() || {}; const nc = {...c};
      if(hr != null){ if(hr < 120 || hr > 230){ $("#vdOut").innerHTML = `<span style="color:var(--warn)">La FC massima di solito è tra 150 e 210.</span>`; break; } nc.hrmax = Math.round(hr); } else delete nc.hrmax;
      if(tt){ const v = Math.round(vdotFrom(vdotSheet.d, tt)*10)/10; if(!(v > 20 && v < 90)){ $("#vdOut").innerHTML = `<span style="color:var(--warn)">Tempo non plausibile per questa distanza.</span>`; break; } nc.vdot = v; nc.hist = (c.hist||[]).concat([{date:todayStr(), vdot:v, src:vdotSheet.d}]); }
      S.settings.run = nc; pushMeta(); closeSheet(); render(); break; }
    case "runStart": closeSheet(); if(loadRunDraft()){ RR = loadRunDraft(); runOpen(); } else runStart(d.d); break;
    case "runResume": RR = loadRunDraft(); if(RR){ initAudio(); runOpen(); } break;
    case "runExit": saveRunDraft(); runClose(); break;
    case "runDiscard": if(confirm("Eliminare la corsa in corso senza salvarla?")){ clearRunDraft(); RR = null; const el = $("#runr"); if(el && !el.hidden) runClose(); else render(); } break;
    case "rrPause": { const now = Date.now(); if(RR.pausedAt){ const dt = now - RR.pausedAt; RR.t0 += dt; RR.pauseTotal += dt; RR.pausedAt = null; } else RR.pausedAt = now; rrRender(); break; }
    case "rrNext": rrNext(); break;
    case "rrEnd": if(confirm("Terminare la corsa qui?")){ RR.endedAt = rrNow(); RR.screen = "end"; rrRender(); } break;
    case "rlRpe": rlRpe = Number(d.v); document.querySelectorAll(".rl-rpe button").forEach(b => b.classList.toggle("on", Number(b.dataset.v) === rlRpe)); break;
    case "runLog": rlRpe = null; RR = null; showSheet(`<div class="grab"></div>` + runLogForm(d.d)); break;
    case "runSave": { const r = runSave(d.d); if(!r) break; const wasRunner = !!(RR && $("#runr") && !$("#runr").hidden); clearRunDraft(); RR = null; if(wasRunner) runClose(); else { closeSheet(); render(); }
      if(r.vdot) setTimeout(() => showSheet(`<div class="grab"></div><div class="stack"><h2>Ritmi aggiornati</h2><p>Dal test: VDOT <b>${r.vdot.toFixed(1)}</b>. Le prossime corse useranno i nuovi ritmi.</p><button class="btn primary big" data-act="closeSheet">Ok</button></div>`), 50);
      break; }
    case "runDel": { const r = S.sessions[d.id]; if(r && confirm("Eliminare questa seduta?")){ r.deleted = true; r.updatedAt = Date.now(); pushSession(r); closeSheet(); render(); } break; }
  }
}

applyTheme();
render();
if(!S.settings.levelChosen && !doneSessions().length) startOnboarding();
initSync();
</script>
