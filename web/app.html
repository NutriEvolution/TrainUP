    err:["Piedi molto avanti e busto verticale (la variante \"salva schiena\"): sposta lo stress sul ginocchio e non protegge la schiena.", "Caricare molto più che nello squat libero solo perché la macchina guida."]},
  pecDeck:{n:"Croci alla macchina (pec deck)", step:2.5, inc:2.5, unit:"macchina", yt:"pec deck tecnica", src:"PE1 pp. 216-217, 229-230",
    how:["Regola il sedile in modo che i gomiti restino un po' più bassi delle spalle.", "Scapole strette e abbassate prima di partire, gomiti leggermente piegati e fermi.", "Chiudi le braccia davanti al petto, poi torna lentamente senza aprire oltre la linea delle spalle."],
    err:["Gomiti alti all'altezza delle spalle (la versione classica, sconsigliata se la spalla dà fastidio).", "Spalle che salgono verso le orecchie."]},
  alzateLateraliCavo:{n:"Alzate laterali al cavo", step:1.25, inc:1.25, unit:"cavo (un braccio)", side:"per braccio", yt:"alzate laterali cavo tecnica", src:GEN,
    how:["Cavo in basso, impugnatura nella mano opposta al cavo, che passa davanti al corpo.","Solleva il braccio di lato fino all'altezza della spalla, gomito appena piegato.","Scendi lentamente fino a sotto il fianco."],
    err:["Slanci con il busto.","Polso più alto del gomito."]},
  curlCavo:{n:"Curl al cavo basso", step:2.5, inc:2.5, unit:"cavi", yt:"curl al cavo tecnica", src:"PE1 pp. 326-328",
    how:["Barra dritta o corda al cavo basso, in piedi a mezzo passo dalla macchina.", "Tronco fermo e spalla leggermente flessa (gomiti un filo avanti): piega fino in alto, poi torna lentamente a braccia distese."],
    err:["Spalla che si estende portando i gomiti indietro per aiutarsi.", "Slanci con la schiena."]},
  curlScott:{n:"Curl su panca inclinata a 30° (gomiti liberi)", step:2.5, inc:2.5, unit:"bilanciere EZ o macchina", yt:"preacher curl panca 30 gradi", src:"PE1 pp. 304, 310-311",
    how:["Panca inclinata a circa 30°: appoggia il petto sullo schienale e lascia le braccia libere davanti, gomiti NON bloccati su un cuscino.", "Spalla flessa a circa 90°: piega i gomiti fino in alto, poi scendi lentamente quasi a braccia distese."],
    err:["Usare la panca Scott classica con i gomiti bloccati sul cuscino: il manuale la sconsiglia per lo stress sul gomito.", "Rimbalzo in basso a braccia completamente distese."]},
  latPresaStretta:{n:"Lat machine, presa stretta neutra", step:2.5, inc:2.5, unit:"macchina", yt:"lat machine presa stretta triangolo tecnica", src:"PE1 pp. 249-250",
    how:["Maniglia a triangolo (presa neutra), cosce bloccate sotto i rulli.", "Petto in fuori, porta la maniglia verso la parte alta del petto spingendo i gomiti verso il basso.", "Risali lentamente fino a braccia distese. Attiva il gran dorsale come la presa prona ed è la versione più adatta a chi inizia."],
    err:["Dondolare con il busto.", "Fermarsi a metà nella risalita."]},
  cardioLeggero:{n:"Cardio leggero", step:0, inc:0, unit:"cyclette, vogatore o camminata", yt:"riscaldamento cyclette palestra", src:GEN, bw:true,
    how:["3-5 minuti a ritmo tranquillo: devi riuscire a parlare.","Serve soprattutto se arrivi da fermo o hai freddo; se sei già caldo puoi accorciarlo."],
    err:["Farlo intenso: deve scaldare, non stancare."]},
  legSwing:{n:"Slanci delle gambe", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"leg swings riscaldamento", src:GEN, bw:true,
    how:["In piedi, una mano appoggiata al muro.","Slancia una gamba avanti e indietro in modo controllato, aumentando piano l'ampiezza.","Poi di lato, davanti all'altra gamba e verso l'esterno."],
    err:["Inarcare la schiena per salire di più.","Slanci bruschi fin dalla prima ripetizione."]},
  worldsGreatest:{n:"Affondo con rotazione", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"world's greatest stretch tecnica", src:GEN, bw:true,
    how:["Fai un affondo lungo in avanti e appoggia le mani a terra all'interno del piede avanti.","Porta il gomito verso la caviglia, poi ruota il busto aprendo il braccio verso il soffitto.","Torna e cambia lato. 2-3 secondi per posizione, senza rimbalzare."],
    err:["Ginocchio avanti che cade verso l'interno.","Ruotare solo il braccio senza il busto."]},
  squatCorpo:{n:"Squat a corpo libero lento", step:0, inc:0, unit:"corpo libero", yt:"squat corpo libero tecnica", src:GEN, bw:true,
    how:["Piedi come nello squat, braccia avanti per bilanciarti.","Scendi in 3 secondi fino in fondo, resta 1-2 secondi spingendo le ginocchia in fuori, risali."],
    err:["Talloni che si alzano.","Fermarsi a metà discesa."]},
  hingeBastone:{n:"Piegamento delle anche con bastone", step:0, inc:0, unit:"bastone o corpo libero", yt:"hip hinge bastone tecnica", src:GEN, bw:true,
    how:["Bastone lungo la schiena: tocca testa, dorso e osso sacro.","Ginocchia appena piegate, spingi il bacino indietro e inclina il busto finché senti tirare dietro le cosce, senza perdere i tre contatti.","Risali spingendo il bacino in avanti."],
    err:["Il bastone si stacca dalla zona lombare (schiena che si arrotonda).","Piegare troppo le ginocchia trasformandolo in uno squat."]},
  rotBraccia:{n:"Circonduzioni delle braccia", step:0, inc:0, unit:"corpo libero", yt:"circonduzioni braccia riscaldamento", src:GEN, bw:true,
    how:["Braccia tese, cerchi ampi e lenti in avanti e poi all'indietro.","Aggiungi qualche apertura e chiusura delle braccia davanti al petto."],
    err:["Movimenti veloci e piccoli."]},
  dislocazioni:{n:"Passaggi con bastone o elastico", step:0, inc:0, unit:"bastone o elastico", yt:"shoulder dislocates bastone", src:GEN, bw:true,
    how:["Presa larga, braccia tese davanti alle cosce.","Porta il bastone sopra la testa e dietro la schiena, poi torna, senza piegare i gomiti.","Se non passa senza fastidio, allarga la presa."],
    err:["Piegare i gomiti o inarcare la schiena per passare.","Forzare con dolore alla spalla."]},
  pushupScapolari:{n:"Piegamenti scapolari", step:0, inc:0, unit:"corpo libero", yt:"scapular push up tecnica", src:GEN, bw:true,
    how:["In posizione di piegamento (anche sulle ginocchia), braccia tese.","Senza piegare i gomiti, avvicina le scapole lasciando scendere il petto di pochi centimetri, poi spingi il pavimento allontanandole."],
    err:["Piegare i gomiti.","Bacino che crolla."]},
  crunchInverso:{n:"Crunch inverso", step:0, inc:0, unit:"corpo libero", yt:"crunch inverso tecnica", src:"PE2 pp. 99-100, 125", bw:true,
    how:["Sdraiato su panca o a terra, gambe piegate sollevate, mani ai lati o alla panca.", "Fletti solo la zona lombare: stacca l'osso sacro e spingi le gambe verso l'alto, poi torna lentamente."],
    err:["Muovere solo le anche portando le gambe avanti e indietro.", "Slanciare le gambe."]},
  // ---- schiena: Stuart McGill, Back Mechanic (2015, 2ª stampa 2017) ----
  mgCurlUp:{n:"Curl-up di McGill", step:0, inc:0, unit:"corpo libero", yt:"mcgill curl up", src:"McGill, Back Mechanic, cap. 9, pp. 103-105", bw:true,
    how:["Supino, mani a palmi in giù sotto la zona lombare per non schiacciarla a terra; una gamba tesa, l'altra piegata con il piede accanto al ginocchio della gamba tesa.","Irrigidisci appena l'addome, stacca i gomiti da terra.","Solleva di poco testa e spalle, collo e zona lombare fermi, come per azzerare il peso su una bilancia. Tieni 10 secondi respirando.","A ogni serie cambia la gamba piegata; con dolore a gluteo o gamba piega quella del lato che fa male."],
    err:["Piegare il collo portando il mento al petto.","Mani dietro la testa.","Fare un crunch o un sit-up: il movimento è minimo."]},
  sideBridgeWall:{n:"Plank laterale al muro", step:0, inc:0, unit:"muro", side:"per lato", yt:"mcgill side plank wall", src:"McGill, Back Mechanic, cap. 9, p. 107", bw:true,
    how:["Appoggiati di lato al muro sull'avambraccio, piede esterno davanti.","Muovi un po' schiena e anche finché trovi la posizione senza dolore e tienila 10 secondi."],
    err:["Bacino che cede o ruota."]},
  sideBridgeKnees:{n:"Plank laterale sulle ginocchia", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"mcgill side bridge knees", src:"McGill, Back Mechanic, cap. 9, p. 105", bw:true,
    how:["Su un fianco, appoggiato su gomito e ginocchia, ginocchia piegate a circa 90°.","Invece di alzare il bacino di lato, spingi le anche in avanti come nell'hip hinge: corpo allineato dalle ginocchia in su. Tieni 10 secondi.","Se la spalla dà fastidio: mano libera sulla spalla opposta e gomito tirato verso il basso sul petto."],
    err:["Riposarsi con la schiena piegata tra una tenuta e l'altra."]},
  sideBridge:{n:"Plank laterale", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"mcgill side bridge", src:"McGill, Back Mechanic, cap. 9, pp. 105-106", bw:true,
    how:["Appoggio su gomito e piedi, il piede di sopra davanti a quello di sotto.","Mano libera sulla spalla opposta, gomito tirato in basso sul petto. Corpo dritto, tieni 10 secondi."],
    err:["Bacino che cede.","Torsione della schiena."]},
  sideBridgeHip:{n:"Plank laterale con la mano sul fianco", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"mcgill side bridge", src:"McGill, Back Mechanic, cap. 9, p. 106", bw:true,
    how:["Come il plank laterale, ma con la mano libera sul fianco: più peso da sostenere.","Corpo dritto, tieni 10 secondi."],
    err:["Bacino che cede.","Torsione della schiena."]},
  sideBridgeRoll:{n:"Plank laterale con rotolamento", step:0, inc:0, unit:"corpo libero", yt:"mcgill rolling side plank", src:"McGill, Back Mechanic, cap. 9, pp. 105-106", bw:true,
    how:["10 secondi su un fianco, rotola nel plank sui gomiti e tieni 3 secondi, poi rotola sull'altro fianco per 10 secondi: è una ripetizione.","Busto e bacino girano insieme come un blocco, il movimento è solo di spalle e anche."],
    err:["Far partire il giro dal bacino: la schiena si torce."]},
  birdDogArm:{n:"Bird dog: solo le braccia", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"bird dog progression arm", src:"McGill, Back Mechanic, cap. 9, p. 108", bw:true,
    how:["A quattro zampe: mani sotto le spalle, ginocchia sotto le anche, schiena nella posizione senza dolore.","Irrigidisci appena l'addome e solleva una mano piegando il gomito; quando va bene, stendi il braccio in avanti. Tieni 10 secondi."],
    err:["Schiena che si muove o si torce."]},
  birdDogLeg:{n:"Bird dog: solo le gambe", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"bird dog progression leg", src:"McGill, Back Mechanic, cap. 9, pp. 107-108", bw:true,
    how:["A quattro zampe, schiena nella posizione senza dolore, addome appena contratto.","Stendi una gamba indietro spingendo via il tallone, non più in alto dell'anca. Tieni 10 secondi."],
    err:["Alzare troppo la gamba: il bacino ruota e la schiena si torce."]},
  birdDog:{n:"Bird dog", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"mcgill bird dog sweep the floor", src:"McGill, Back Mechanic, cap. 9, pp. 107-109", bw:true,
    how:["A quattro zampe, schiena nella posizione senza dolore, addome appena contratto.","Stendi il braccio e la gamba opposti fino a parallelo al pavimento: braccio non sopra la spalla, gamba non sopra l'anca. Pugno chiuso, tallone spinto via. Tieni 10 secondi.","Tra una tenuta e l'altra \"spazza il pavimento\": porta mano e ginocchio a sfiorare terra senza appoggiarli, poi torna su."],
    err:["Schiena o collo che si muovono.","Gamba troppo alta: il bacino ruota."]},
  birdDogSquares:{n:"Bird dog con i quadrati", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"bird dog drawing squares mcgill", src:"McGill, Back Mechanic, cap. 9, pp. 108-109", bw:true,
    how:["Come il bird dog: durante la tenuta disegna con la mano e il piede un quadrato di al massimo 30 cm (fuori, giù, verso il centro, su).","Pugno chiuso; muovi solo spalle e anche."],
    err:["Schiena che si torce."]},
  birdDogStanding:{n:"Bird dog in piedi", step:0, inc:0, unit:"tavolo o piano di lavoro", side:"per lato", yt:"standing bird dog", src:"McGill, Back Mechanic, cap. 9, p. 109; cap. 14, p. 138", bw:true,
    how:["In piedi con una mano appoggiata a un tavolo: la versione per chi ha ginocchia doloranti o fatica a scendere a terra.","Prima solleva un braccio, poi una gamba indietro, poi braccio e gamba opposti. Tieni 10 secondi, muovi solo spalle e anche."],
    err:["Schiena che si inarca o si torce."]},
  catCamel:{n:"Gatto-cammello", step:0, inc:0, unit:"corpo libero", yt:"mcgill cat camel", src:"McGill, Back Mechanic, cap. 9, p. 110; cap. 11, p. 118", bw:true,
    how:["A quattro zampe, alterna lentamente schiena incurvata verso il basso con lo sguardo in alto e schiena arrotondata con lo sguardo in basso.","Ogni ciclo 3-4 secondi, restando dentro il movimento senza dolore. Bastano 7-8 cicli."],
    err:["Spingere fino alla fine del movimento: non è un allungamento.","Fare molti cicli in più."]},
  proneRelax:{n:"Sdraiato a pancia in giù", step:0, inc:0, unit:"pavimento", yt:"mckenzie prone lying", src:"McGill, Back Mechanic, cap. 6, pp. 63-64; cap. 7, p. 77", bw:true,
    how:["Pancia in giù, mani sotto il mento. Rilassati e a ogni espirazione lascia scendere la zona lombare verso il pavimento.","Se va bene, un pugno sotto il mento; se va ancora bene, due pugni uno sopra l'altro. Resta fino a 3 minuti.","Rialzati senza piegare la schiena: a quattro zampe, poi in affondo spingendo con le anche."],
    err:["Restare se il dolore aumenta: dopo 30 secondi senza miglioramento, smetti.","Rialzarsi arrotondando la schiena."]},
  mcgillStretch:{n:"Allungamento in piedi dopo essere stato seduto", step:0, inc:0, unit:"corpo libero", yt:"mcgill standing stretch", src:"McGill, Back Mechanic, cap. 8, pp. 92-93", bw:true,
    how:["Alzati dalla sedia e porta le braccia in alto: conta fino a 10.","Allunga ancora più in alto e un po' indietro per altri 10, con un'inspirazione profonda, poi abbassa le braccia e rilassati.","Ogni 20 minuti di seduta, poi regola l'intervallo su quello che va meglio per te."],
    err:["Inarcare con forza la zona lombare."]},
  shortstopSquat:{n:"Squat dello shortstop", step:0, inc:0, unit:"corpo libero", yt:"mcgill shortstop squat hip hinge", src:"McGill, Back Mechanic, cap. 7, pp. 81-84", bw:true,
    how:["In piedi, mani sulle cosce. Schiena dritta, porta il bacino indietro piegando le anche e fai scendere le mani fino alle ginocchia, come lo shortstop del baseball. Ginocchia a metà tra talloni e punte.","Addome appena contratto, spalle spinte in basso lontano dalle orecchie: il peso del busto scende lungo le braccia.","Torna su tirando le anche in avanti, senza sollevare con la schiena. È lo schema da usare per raccogliere oggetti e alzarsi dalla sedia."],
    err:["Ginocchia che vanno avanti oltre le punte.","Schiena che si arrotonda."]},
  parkBench:{n:"Scarico della schiena su una panchina", step:0, inc:0, unit:"panchina o ringhiera", yt:"mcgill park bench decompression", src:"McGill, Back Mechanic, cap. 14, p. 133", bw:true,
    how:["Durante la camminata, appena compare il fastidio: mani sullo schienale di una panchina o su una ringhiera, braccia strette al busto.","Spingi con il palmo e porta il peso sulle braccia, poi avvicina le anche alla panchina per estendere la schiena.","Resta finché è comodo, al massimo un minuto, poi riprendi a camminare."],
    err:["Restare se il dolore aumenta."]},
  wallWalk:{n:"Camminata delle mani sul muro", step:0, inc:0, unit:"muro", yt:"wall walking hands mcgill", src:"McGill, Back Mechanic, cap. 14, p. 133", bw:true,
    how:["Di fronte al muro, fai salire le mani una sopra l'altra come se camminassero.","Porta le anche verso il muro per raddrizzarti."],
    err:["Inarcare con forza la zona lombare."]},
  nerveFloss:{n:"Scorrimento del nervo sciatico", step:0, inc:0, unit:"tavolo o mobile alto", side:"per gamba", yt:"mcgill nerve flossing sciatica", src:"McGill, Back Mechanic, cap. 14, pp. 133-135", bw:true,
    how:["Seduto su un tavolo con le gambe libere, schiena neutra.","Insieme: guarda in alto, stendi il ginocchio e porta la punta del piede verso di te. Poi insieme: abbassa il mento, piega il ginocchio e punta il piede. Ogni ciclo 3-4 secondi.","10 per gamba. Se il giorno dopo il dolore che scende nella gamba è peggiorato, smetti e riprova dopo una settimana; se peggiora di nuovo, non fa per te."],
    err:["Muovere solo la testa invece di flettere ed estendere il collo.","Tirare come in un allungamento."]},
  lewit:{n:"Respirazione di Lewit", step:0, inc:0, unit:"pavimento", yt:"mcgill lewit breathing", src:"McGill, Back Mechanic, cap. 14, pp. 136-137", bw:true,
    how:["Supino con anche e ginocchia piegate a 90° e piedi sollevati; dondola appena il bacino per trovare la posizione lombare senza dolore.","Alla fine di un'espirazione normale, soffia attraverso le labbra strette come in una cannuccia fino a svuotare del tutto i polmoni: l'addome lavora e il torace scende.","3-4 cicli."],
    err:["Gonfiare il torace in avanti tra un ciclo e l'altro."]},
  clamshell:{n:"Conchiglia", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"mcgill clamshell glute", src:"McGill, Back Mechanic, cap. 12, p. 121", bw:true,
    how:["Su un fianco con le ginocchia piegate. Pollice sulla sporgenza ossea davanti al bacino, dita sul gluteo laterale.","Apri il ginocchio di sopra come una conchiglia, piedi uniti: senti il gluteo che si contrae sotto le dita."],
    err:["Ruotare il bacino o torcere la schiena."]},
  gluteBridge:{n:"Ponte per i glutei", step:0, inc:0, unit:"corpo libero", yt:"mcgill glute bridge", src:"McGill, Back Mechanic, cap. 12, p. 122", bw:true,
    how:["Supino con le ginocchia piegate. Prima stringi soltanto i glutei, senza alcun movimento.","Poi aumenta la contrazione dei glutei finché il bacino si solleva, senza usare i muscoli dietro la coscia."],
    err:["Inarcare la schiena per salire.","Spingere con i femorali (crampo dietro la coscia)."]},
  lungeHip:{n:"Affondo camminato con il braccio in alto", step:0, inc:0, unit:"corpo libero", yt:"walking lunge psoas stretch overhead", src:"McGill, Back Mechanic, cap. 12, p. 121", bw:true,
    how:["Affondo: mentre scendi spingi verso l'alto la mano del lato della gamba dietro.","Inclina un poco il busto dalla parte opposta e porta la spalla indietro: senti allungare la parte davanti dell'anca.","Fai un passo e cambia gamba e braccio: 6 passi in tutto."],
    err:["Inarcare la zona lombare."]},
  // ---- collo, spalla, ginocchio (routine per il dolore) ----
  romCollo:{n:"Movimenti del collo senza dolore", step:0, inc:0, unit:"corpo libero", yt:"neck range of motion exercises", src:"Blanpied 2017 (JOSPT), esercizi di mobilità del collo", bw:true,
    how:["Seduto, lentamente: gira la testa a destra e a sinistra, inclinala verso una spalla e verso l'altra, abbassa e alza il mento.","Fermati prima del punto in cui il dolore aumenta. Le ripetizioni indicate valgono per ogni direzione."],
    err:["Forzare a fine movimento.","Muovere di scatto."]},
  neckFlexLift:{n:"Flessori del collo a testa sollevata", step:0, inc:0, unit:"corpo libero", yt:"deep neck flexor endurance head lift", src:"Grieve's, cap. 41; Blanpied 2017 (resistenza dei flessori)", bw:true,
    how:["Supino con le ginocchia piegate. Fai il cenno del «sì» come nell'esercizio dei flessori profondi.","Tenendo il mento abbassato, solleva la testa di un paio di centimetri e tieni 5 secondi; poi appoggia e rilassa.","Quando è facile, tieni 10 secondi."],
    err:["Il mento si alza e la testa va avanti.","Trattenere il respiro."]},
  scapRetr:{n:"Scapole indietro e in basso", step:0, inc:0, unit:"corpo libero", yt:"scapular retraction exercise seated", src:"Blanpied 2017 (rinforzo scapolotoracico); Kibler 2013", bw:true,
    how:["Seduto o in piedi, braccia lungo i fianchi.","Porta le scapole indietro e un po' in basso, come per metterle nelle tasche dietro; tieni 5 secondi e rilascia.","Il collo resta rilassato."],
    err:["Alzare le spalle verso le orecchie.","Inarcare la schiena."]},
  extraRotFianco:{n:"Rotazione esterna su un fianco", step:0, inc:0, unit:"manubrio leggero o niente", side:"per lato", yt:"side lying external rotation", src:"Kibler 2013; Grieve's, cap. 50.2", bw:true,
    how:["Su un fianco, gomito del braccio di sopra piegato a 90° e appoggiato al fianco (un asciugamano arrotolato tra gomito e busto aiuta).","Ruota l'avambraccio verso l'alto senza staccare il gomito, poi torna giù lentamente.","Inizia senza peso; poi un manubrio da 0,5-2 kg."],
    err:["Staccare il gomito dal fianco.","Ruotare il busto all'indietro."]},
  isoRotSpalla:{n:"Rotazioni della spalla contro il muro (isometria)", step:0, inc:0, unit:"muro o stipite", side:"per lato", yt:"isometric shoulder external rotation wall", src:"Grieve's, cap. 50.2 (esercizi graduati, all'inizio senza dolore)", bw:true,
    how:["In piedi accanto a uno stipite, gomito piegato a 90° e vicino al fianco, un asciugamano piegato tra polso e stipite.","Rotazione esterna: spingi il dorso del polso contro lo stipite senza muovere il braccio. Rotazione interna: girati e spingi con il palmo.","Spinta leggera che non provoca dolore; tieni 5-10 secondi. Le ripetizioni valgono per ogni direzione."],
    err:["Spingere fino a sentire dolore.","Alzare la spalla."]},
  elevScap:{n:"Elevazione del braccio nel piano scapolare", step:0, inc:0, unit:"manubrio leggero o niente", side:"per lato", yt:"scaption exercise", src:"Grieve's, cap. 50.2", bw:true,
    how:["In piedi, pollice in alto, braccio un po' in avanti rispetto al fianco (circa 30°).","Alza il braccio teso fino a dove non fa male, al massimo all'altezza della spalla; scendi lentamente.","Prima senza peso, poi con un manubrio leggero; alza più in alto quando non fa male."],
    err:["Alzare la spalla verso l'orecchio.","Andare oltre il punto in cui il dolore aumenta."]},
  extraRotElastico:{n:"Rotazione esterna con elastico", step:0, inc:0, unit:"elastico", side:"per lato", yt:"band external rotation shoulder", src:"Grieve's, cap. 50.2", bw:true,
    how:["Elastico fissato all'altezza del gomito, dal lato opposto al braccio che lavora. Gomito a 90° vicino al fianco (asciugamano arrotolato).","Ruota l'avambraccio verso l'esterno senza staccare il gomito; torna lentamente.","Elastico con cui arrivi alle ripetizioni con un paio di margine."],
    err:["Staccare il gomito dal fianco.","Ruotare il busto."]},
  intraRotElastico:{n:"Rotazione interna con elastico", step:0, inc:0, unit:"elastico", side:"per lato", yt:"band internal rotation shoulder", src:"Grieve's, cap. 50.2", bw:true,
    how:["Elastico fissato all'altezza del gomito dallo stesso lato del braccio che lavora. Gomito a 90° vicino al fianco.","Porta l'avambraccio verso la pancia senza staccare il gomito; torna lentamente."],
    err:["Staccare il gomito dal fianco."]},
  abdFianco:{n:"Abduzione dell'anca su un fianco", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"side lying hip abduction", src:"Crossley 2016 (esercizi per l'anca); Grieve's, cap. 48.2", bw:true,
    how:["Su un fianco, gamba di sotto piegata, gamba di sopra tesa in linea con il busto.","Alza la gamba di sopra con il tallone che guida e la punta in avanti, poi scendi lentamente.","Il bacino resta fermo, non ruota all'indietro."],
    err:["Portare la gamba in avanti mentre sale.","Ruotare il bacino."]},
  squatParziale:{n:"Squat parziale verso la sedia", step:0, inc:0, unit:"sedia", yt:"partial squat to chair knee pain", src:"Crossley 2016; Grieve's, cap. 48.2", bw:true,
    how:["In piedi davanti a una sedia, piedi alla larghezza delle anche; se serve tieniti a un appoggio.","Scendi portando il bacino indietro fino a sfiorare la sedia (o meno, se fa male), poi risali.","Ginocchio sopra il centro del piede, bacino orizzontale."],
    err:["Ginocchia che cadono verso l'interno.","Scendere oltre il punto in cui il dolore supera il limite."]},
  stepUp:{n:"Salita sul gradino", step:0, inc:0, unit:"gradino", side:"per gamba", yt:"step up exercise knee", src:"Crossley 2016; Grieve's, cap. 48.2", bw:true,
    how:["Un piede su un gradino basso, tieniti al corrimano se serve.","Sali spingendo con la gamba sul gradino, poi scendi lentamente con l'altra.","Bacino orizzontale, ginocchio sopra il centro del piede. Quando è facile, gradino più alto."],
    err:["Spingere con la gamba a terra.","Ginocchio che cade verso l'interno."]},
  stepDown:{n:"Discesa dal gradino su una gamba", step:0, inc:0, unit:"gradino", side:"per gamba", yt:"lateral step down exercise", src:"Grieve's, cap. 48.2", bw:true,
    how:["In piedi su un gradino su una gamba, l'altra fuori dal bordo.","Piega lentamente il ginocchio d'appoggio finché il tallone dell'altra gamba sfiora il pavimento, poi risali.","Tieniti al corrimano all'inizio."],
    err:["Bacino che si inclina.","Ginocchio che cade verso l'interno."]},
  ankFlex:{n:"Piegamento su una gamba", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"single leg squat balance ankle", src:"Hupperets 2009 (BMJ); scheda RACGP HANDI 2014 (programma di E. Verhagen)", bw:true,
    how:["In piedi su una gamba, l'altra piegata con il piede sollevato e le cosce parallele.","Piega il ginocchio d'appoggio come in un piccolo squat su una gamba, alzando il braccio opposto, poi torna su.","Ginocchio d'appoggio sopra l'avampiede.","Livelli: terreno piano, poi a occhi chiusi, poi sulla tavoletta propriocettiva."],
    err:["Ginocchio che cade verso l'interno."]},
  toeRaise:{n:"Sollevamento sulle punte dal gradino", step:0, inc:0, unit:"gradino", yt:"calf raise step", src:"Hupperets 2009 (BMJ); scheda RACGP HANDI 2014 (programma di E. Verhagen)", bw:true,
    how:["Avampiedi su un gradino, talloni fuori dal bordo, ginocchia tese ma non bloccate, busto dritto.","Scendi con i talloni più in basso che puoi, poi sali sulle punte muovendo solo le caviglie e torna giù lentamente.","Livelli: tenendoti a un appoggio, poi senza."],
    err:["Piegare le ginocchia o muovere il busto."]},
  ankStance:{n:"Equilibrio su una gamba", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"single leg stance ankle sprain", src:"Hupperets 2009 (BMJ); scheda RACGP HANDI 2014 (programma di E. Verhagen)", bw:true, iso:true,

// tipi: range | fixed (RM) | rpe | pyr | emom | time | test
const P = {

  hold:(top,sec,rest) => ({t:"hold",reps:[top, top-2, top-4].filter(x => x > 0),sec,rest}),

function prescText(p, ex){ const t = prescText0(p, ex); return p.note ? `${t} ${p.note.charAt(0).toUpperCase() + p.note.slice(1)}.` : t; }
function prescText0(p, ex){
  const side = ex && ex.side ? " " + ex.side : "";
  switch(p.t){
    case "range": return `${p.sets} serie da ${p.rmin === p.rmax ? p.rmin : p.rmin + "-" + p.rmax} ripetizioni${side}` + (p.buf ? (ex && ex.bw ? `. Fermati quando te ne restano ancora circa ${p.buf}` : `. Scegli un peso con cui a fine serie te ne restano ancora circa ${p.buf}`) : "") + ".";
    case "fixed": return `${p.sets} serie da ${p.reps} ripetizioni${side} con il peso che riusciresti a sollevare al massimo ${p.rm} volte. Stesso peso in tutte le serie.` + (p.dlRir ? ` Scarico: tieni ${p.dlRir} ripetizioni in più di margine.` : "");
    case "rpe": return `${p.sets} serie da ${p.reps} ripetizioni${side}. Regola il peso serie per serie: a fine serie te ne deve restare circa ${p.rir || 1}.`;
    case "pyr": return `Piramide: ${p.reps.length} serie da ${p.reps.join(", ")} ripetizioni. Quando le ripetizioni scendono, aumenta il peso; fermati sempre ${p.rir ? p.rir + " ripetizioni" : "1 ripetizione"} prima di non farcela più.`;
    case "emom": return `${p.min} minuti: all'inizio di ogni minuto fai ${p.reps} ripetizioni, poi riposi fino allo scoccare del minuto successivo. Peso che sollevi al massimo 12 volte.`;
    case "time": return `${p.sets} serie da ${p.sec} secondi${side}.`;
    case "hold": return `Piramide discendente: ${p.reps.length} serie da ${p.reps.join(", ")} tenute di ${p.sec} secondi${side}. Pochi secondi tra una tenuta e l'altra, ${p.rest} secondi tra le serie.`;
    case "test": return "Test: cerca il peso massimo con cui fai 8 ripetizioni pulite, poi 2-5 serie da 8 con il 10% in meno.";
    case "max": return "Test del massimale: riscaldamento progressivo, poi tentativi singoli fino al peso più alto sollevato con buona tecnica.";
  }
  return "";
}
function restText(p){ if(!p.rest) return ""; return "Recupero " + (p.rest < 60 ? p.rest + " s" : fmtSec(p.rest) + " min"); }

let sync = {state:"local", db:null, col:null, timer:null};
const writeChains = {};
function writeDoc(id, data){

}
let metaTimer = null;
function pushMeta(){ S.metaAt = Date.now(); saveLocal(); clearTimeout(metaTimer); metaTimer = setTimeout(() => writeDoc("meta", {kind:"meta", settings:S.settings, planned:S.planned, profile:S.profile, body:S.body, metaAt:S.metaAt}), 800); }

async function initSync(){
  if(!window.claude || !window.claude.use){ setSync("local"); return; }
  setSync("wait");
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user){ setSync("local"); return; }
    const id = await user.id();
    if(!id){ setSync("local"); return; }
    sync.db = db; sync.col = db.collection("data/users/" + id);
    let first = true;
    sync.timer = setTimeout(() => setSync("warn"), 10000);
    sync.col.onSnapshot(snap => {
      let changed = false;
      const remoteIds = new Set();
      for(const d of snap.docs){
        const v = d.data(); if(!v) continue; remoteIds.add(d.id);
        if(v.kind === "meta"){ if((v.metaAt||0) > (S.metaAt||0)){ S.settings = {...DEFAULT.settings, ...v.settings}; S.planned = v.planned || {}; S.profile = v.profile || S.profile || {}; S.body = v.body || S.body || []; S.metaAt = v.metaAt; changed = true; } }
        else if(v.kind === "session"){ const loc = S.sessions[v.id]; if(!loc || (v.updatedAt||0) > (loc.updatedAt||0)){ const c = {...v}; delete c.kind; S.sessions[v.id] = c; changed = true; } }

        }
      }
      if(changed){ saveLocal(); render(); }
    }, () => { clearTimeout(sync.timer); setSync("warn"); });
  }catch(e){ setSync("local"); }
}

function liftSeries(k){ // massimale stimato per seduta: miglior serie (o test 8RM) di quella seduta
  const out = [];

    let best = 0;
    if(e.kg8) best = Math.max(best, e1rm(e.kg8, 8));
    for(const z of (e.sets||[])) if(z.kg != null && z.kg > 0 && z.reps > 0 && z.reps <= 15) best = Math.max(best, e1rm(z.kg, z.reps));
    if(best > 0){ const last = out[out.length-1]; if(last && last.date === s.date) last.v = Math.max(last.v, best); else out.push({date:s.date, v:best}); }
  }

}

function bfFromFolds(eq, sex, age, heightCm, f, c, withCirc){

  const needC = (eq === "withers" || withCirc) ? E.circ[sx].filter(k => !(c[k] > 0)) : [];
  if(need.length || needC.length || !(age > 0)) return {missing:[...need.map(k => FOLD_N[k]), ...needC.map(k => CIRC_N[k]), ...(age > 0 ? [] : ["età"])]};

                : (withCirc ? 1.0990750 - 0.0008209*sum + 0.0000026*sum*sum - 0.0002017*age - 0.005675*vm + 0.018586*am : 1.1093800 - 0.0008267*sum + 0.0000016*sum*sum - 0.0002574*age);

                : (withCirc ? 1.1470292 - 0.0009376*sum + 0.0000030*sum*sum - 0.0001156*age - 0.0005839*h : 1.0994921 - 0.0009929*sum + 0.0000023*sum*sum - 0.0001392*age);
    }
  } else if(eq === "dw"){
    const r = DW_T.find(t => age >= t[0] && age <= t[1]) || DW_T[DW_T.length-1];
    D = M ? r[2] - r[3]*Math.log10(sum) : r[4] - r[5]*Math.log10(sum);
  } else {
    if(M) D = 1.078865 - 0.000419*sum + 0.000948*c.collo - 0.000266*age - 0.000564*c.caviglia;
    else { if(!(heightCm > 0)) return {missing:["altezza"]}; D = 1.14075 - 0.04959*Math.log10(sum) + 0.00044*age - 0.000612*c.vita + 0.000284*heightCm - 0.000505*c.fianchi + 0.000331*c.petto; }

function pctBand(kind, v){
  const a = ageNow(), sx = (S.profile||{}).sex === "F" ? "F" : "M"; if(!(a >= 18) || v == null) return "";
  const row = SCHUTZ[kind][sx].find(r => a <= r[0])[1];
  if(v < row[0]) return "sotto il 5° percentile";
  if(v >= row[6]) return "oltre il 95° percentile";
  for(let i=0;i<6;i++) if(v >= row[i] && v < row[i+1]) return `tra il ${PCT_COLS[i]}° e il ${PCT_COLS[i+1]}° percentile`;
  return "";
}
function ageNow(){ const p = S.profile || {}; return p.birthYear ? new Date().getFullYear() - p.birthYear : null; }
function heightM(){ const h = (S.profile || {}).height; return h > 0 ? h/100 : null; }
function bodySorted(){ return (S.body || []).slice().sort((a,b) => a.date === b.date ? (a.t||0) - (b.t||0) : a.date.localeCompare(b.date)); }
function latestWeight(beforeDate){ const L = bodySorted().filter(e => e.w > 0 && (!beforeDate || e.date <= beforeDate)); return L.length ? L[L.length-1].w : null; }
function weightAvgSeries(){ // media mobile degli ultimi 7 giorni, un punto per ogni giorno con una pesata
  const L = bodySorted().filter(e => e.w > 0); const byDay = {};
  L.forEach(e => byDay[e.date] = e.w);
  const days = Object.keys(byDay).sort();
  return days.map(d => { const from = ymd(new Date(parseYmd(d).getTime() - 6*864e5)); const win = days.filter(x => x >= from && x <= d).map(x => byDay[x]); return {date:d, v:win.reduce((a,b)=>a+b,0)/win.length, raw:byDay[d]}; });
}

function readBodyForm(){ document.querySelectorAll("#sheet [data-bf]").forEach(el => { bodyDraft[el.dataset.bf] = el.value; }); document.querySelectorAll("#sheet [data-bfsel]").forEach(el => { bodyDraft[el.dataset.bfsel] = el.type === "checkbox" ? el.checked : el.value; }); }
const numOf = v => { const x = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(x) ? null : x; };
function bodyComputed(){
  const d = bodyDraft; const w = numOf(d.w) || latestWeight(d.date); const sex = (S.profile || {}).sex || "M";
  if(d.method === "pliche"){
    const f = {}, c = {}; Object.keys(FOLD_N).forEach(k => f[k] = numOf(d["f_"+k])); Object.keys(CIRC_N).forEach(k => c[k] = numOf(d["c_"+k]));
    const r = bfFromFolds(d.eq || "jp3", sex, ageNow(), (S.profile||{}).height, f, c, !!d.withCirc);
    if(r.missing) return {msg:"Mancano: " + r.missing.join(", ").toLowerCase() + "."};
    const fm = w ? w*r.pct/100 : null;
    return {pct:r.pct, fm, ffm: w ? w - fm : null, warn:r.warn, needW:!w};
  }
  if(d.method === "bia"){
    let pct = numOf(d.bia_pct), fm = numOf(d.bia_fm), ffm = numOf(d.bia_ffm);
    if(fm != null && ffm != null){ pct = pct ?? 100*fm/(fm+ffm); }
    else if(w){ if(pct != null){ fm = fm ?? w*pct/100; ffm = ffm ?? w - fm; } else if(fm != null){ pct = 100*fm/w; ffm = w - fm; } else if(ffm != null){ fm = w - ffm; pct = 100*fm/w; } }
    if(pct == null) return {msg:"Scrivi almeno due valori, oppure uno insieme al peso."};
    return {pct, fm, ffm};
  }

}

  h += `<div class="o-sec"><div class="o-label">Alzate</div><div class="o-list">${[leg, "panca", "stacco"].map(l => { const st = fsState(l, c);
    return `<div class="o-row" style="cursor:default"><span class="n">${esc(EX[l].n)}<small>${l === "stacco" ? "5×5" : phN(st)}${st.rm ? " · massimale " + fmtKg(st.rm.kg) + " kg (" + esc(st.rm.why) + ")" : " · massimale non noto"}</small></span><span class="p num">${st.kg != null ? fmtKg(st.kg) + " kg" : "—"}</span></div>`; }).join("")}</div>
    <p class="tiny muted" style="margin-top:6px">A destra il peso del prossimo "schema".</p></div>`;
  h += `<div class="o-sec"><div class="o-label">I tuoi massimali</div><p class="small muted" style="margin-top:6px">Servono per il peso di partenza (60% per squat e panca, 70% per lo stacco). Se non li conosci lascia vuoto: l'app li stima dalle tue sedute, oppure scegli tu il peso la prima volta. Dal secondo ciclo valgono quelli del test.</p>
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">${[leg, "panca", "stacco"].map(l => `<div class="field" style="flex:1;min-width:90px"><label for="fsrm-${l}">${esc(EX[l].n.split(" ")[0])} (kg)</label><input id="fsrm-${l}" type="number" inputmode="decimal" min="0" step="2.5" data-fsrm="${l}" value="${(s.fsRm || {})[l] || ""}"></div>`).join("")}</div></div>`;
  const due = fsTestDue(c);
  h += `<div class="o-sec"><div class="o-label">Test dei massimali</div><p class="small muted" style="margin-top:6px">${pos.test ? "Sei nella settimana del test." : due ? "Il test inizia alla fine di questa settimana: due sedute di scarico (anche facoltative) e poi il test di squat, panca e stacco." : "Arriva da solo quando anche il 6×3 di squat e panca non si chiude più. Puoi anticiparlo: si fa alla fine della settimana in corso."}</p>
    ${pos.test ? "" : s.fsTestNow === c ? `<button class="btn sm" data-act="fsTest" data-v="0">Annulla il test anticipato</button>` : due ? "" : `<button class="btn sm" data-act="fsTest" data-v="1">Fai il test a fine settimana</button>`}</div>`;
  h += `<div class="o-sec"><div class="o-label">Le 4 sedute della settimana</div>${pos.test ? "" : [0,1,2,3].map(sl => { const sess = buildFsSession({fs:true, c, week:pos.week, slot:sl}, s); return `<details class="wk" ${pos.slot === sl ? "open" : ""}><summary><span>${esc(sess.code)} · ${esc(sess.title)}${pos.slot === sl ? ' <span class="pill acc">prossima</span>' : ""}</span><span class="small muted">~${estMinutes(sess.blocks, true)}′</span></summary><div style="margin-top:8px">${exRowsHtml(sess, "fs")}</div></details>`; }).join("")}
    <div class="o-list" style="margin-top:8px"><label class="switch"><input type="checkbox" data-set="fsAcc" ${s.fsAcc !== false ? "checked" : ""}><span><b>Complementari</b><br><span class="small muted">Trazioni, rematori, face pull e curl nei giorni di squat e panca; panca inclinata con manubri negli altri. Facoltativi per il libro.</span></span></label></div></div>`;
  h += `<div class="o-sec"><div class="o-label">Come funziona</div><ul class="how small" style="margin-top:8px">
    <li><b>Schema</b>: 5 serie da 8 con lo stesso peso, mai a cedimento. Si parte intorno al 60% del massimale; il peso sale dopo almeno 2 sedute chiuse (in pratica ogni settimana per squat e panca, ogni 2 per lo stacco).</li>
    <li><b>Tecnica</b>: 6 serie da 4 all'80% del peso dello schema (stacco 5 da 4); finché lo schema è sotto il 75-80% del massimale si usa lo stesso peso.</li>
    <li><b>Stacco</b>: 5 serie da 5 con peso fisso, +5 kg quando le chiudi (proposta di Tsatsouline, che il libro consiglia per lo stacco).</li>
    <li>Quando il 5×8 non si chiude più si passa al 5×5 con lo stesso peso, poi al 6×3 togliendo lo squat dei giorni di tecnica. Esaurito anche il 6×3: scarico e test dei massimali, poi un nuovo ciclo.</li>
    <li>Ogni 4 settimane una di scarico: stesso peso del 5×8 ma solo 5×5, niente squat di martedì e venerdì, niente complementari.</li></ul>
    <p class="tiny muted" style="margin-top:6px">Il libro lo indica per principianti e intermedi e non come programma da seguire sempre. Scelte dell'app, dove il libro non dà numeri: "non si chiude più" = 2 sedute di fila non chiuse con lo stesso peso; aumenti di 5 kg (2,5 kg in panca); stacco di partenza al 70%; scarico nel 5×5 e nel 6×3 con 3 serie; serie e ripetizioni dei complementari; recuperi di 3 minuti (l'ACSM nel 2009 indicava almeno 2-3 minuti negli esercizi principali pesanti). Fonte: Ferlito A., <i>Project Strength</i>, Project Invictus 2016, cap. VI ("Il Faleev 2.0", figg. 76-79) e appendice B (riscaldamento per il massimale, fig. 57).</p></div>`;
  h += `<div class="o-sec"><div class="o-label">Opzioni</div>${coreSwitchHtml()}
    <div class="field" style="margin-top:10px"><label for="setLeg">Esercizio principale per le gambe</label>
      <select id="setLeg" data-set="legMain"><option value="squat" ${s.legMain==="squat"?"selected":""}>Squat con bilanciere</option><option value="pressa" ${s.legMain==="pressa"?"selected":""}>Pressa (scelta dell'app, il libro usa lo squat)</option></select></div></div>`;
  h += swapsCardHtml();
  h += `<div class="o-sec"><button class="btn ghost sm" data-act="clearFutureSet" style="color:var(--danger);padding-left:0">Togli i giorni di palestra da domani in poi</button></div>`;
  return h;
}
function renderPalestraProgramma(){

    <div class="o-list"><button class="o-row" data-act="openLevel"><span class="n">Livello<small>${esc(LEVELS[s.level || "ripresa"].n) + (s.level === "allenato" ? (s.startFrom === "f3" ? " · parti dalla Fase 3" : " · parti dalla Fase 2") : "")}</small></span><span class="p">›</span></button></div>
    <div class="field" style="margin-top:10px"><label for="setLeg">Esercizio principale per le gambe</label>

  for(const [k, weeks] of groups){

    return `<p class="small" style="margin-top:8px">${esc(c.map(k => POSTURE[k].n).join(", "))}. ${s.postureGym !== false ? "Nelle sedute ci sono fino a 3 esercizi posturali prima dei pesi e 3 alla fine; la routine completa è in Oggi." : "Solo la routine a casa, in Oggi."}</p>`; })()}
    <div class="o-list"><button class="o-row" data-act="openSettings"><span class="n">Scegli le condizioni<small>Nelle Impostazioni</small></span><span class="p">›</span></button></div></div>`;

  return h;
}
function whyGenHtml(){
  const R = (c, n, t, src) => `<div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:${c};margin-top:7px"></span><span class="n">${n}<small>${t} <span class="cite">${src}</span></small></span></div>`;
  return `<div class="o-sec"><div class="o-label">Programma personalizzato: le regole</div><p class="small muted" style="margin-top:6px">Il programma "Personalizzato" applica le regole del libro di Helms, Morgan e Valdez; dove una scelta è dell'app è scritto.</p>
    <div class="o-list">
      ${R("var(--accent)", "Giorni e schema", "Per ogni numero di giorni il libro elenca più schemi (da 3 opzioni con 2 giorni a 8 con 6 giorni), che si possono scegliere in Piano → Palestra. Per la massa conta il totale delle serie più di come le dividi: si sceglie in base a quante serie fai (più serie, più conviene allenare ogni muscolo spesso), alla durata delle sedute e ai giorni in cui ti alleni.", "Pyramid tab. 7.2 e 7.6, pp. 226-233")}
      ${R("var(--accent)", "Fase di specializzazione", "Per chi è avanzato: 8-12 settimane con circa il 50% di serie in più su 1 o 2 muscoli, allenati all'inizio di ogni seduta, e 1/3-1/2 in meno sugli altri (l'app usa il 40%), alternate a fasi bilanciate. Per quadricipiti e femorali si sale al nuovo volume in 2-4 settimane (l'app usa 3).", "Pyramid tab. 3.9, pp. 129-132")}
      ${R("var(--accent)", "Serie a settimana", "Da 4 serie per muscolo si vedono già risultati in 2-3 mesi; la fascia pratica è 10-20; oltre ~30 non si guadagna più. Più serie fanno crescere di più ma ogni serie in più rende meno: il libro dice di fare abbastanza per progredire, non il più possibile.", "Pyramid tab. 2.2 e 7.4, Pelland 2026")}
      ${R("var(--accent)", "Serie per seduta", "Oltre circa 11 serie per lo stesso muscolo nella stessa seduta il beneficio delle serie in più diventa incerto: in quel caso si allena il muscolo più volte a settimana.", "Pyramid p. 71 (Remmert 2025)")}
      ${R("var(--g-legs)", "Ripetizioni e margine", "Dipendono dal tipo di esercizio: squat e stacchi 4-8 ripetizioni con 2-4 in canna (sono pesanti e tecnici), pressa e panche 4-12, macchine e trazioni 6-15, isolamento 8-20 fino quasi al cedimento. Le serie devono avere almeno 4 ripetizioni.", "Pyramid tab. 7.7, p. 235")}
      ${R("var(--g-legs)", "Variare le ripetizioni", "Variare le ripetizioni probabilmente aiuta la crescita; nessuno schema è risultato migliore degli altri. L'app alterna le sedute A (ripetizioni più basse) e B (più alte).", "Pyramid tab. 7.8, pp. 125-126")}
      ${R("var(--g-back)", "Scelta degli esercizi", "Uno o più esercizi per ciascuno dei sei schemi (squat, stacco, panca, spinta sopra la testa, rematore, trazioni), una panca inclinata, due rematori (gomiti larghi e gomiti stretti), due trazioni verticali e un esercizio di isolamento per quadricipiti, femorali, bicipiti, tricipiti, deltoidi laterali e polpacci. Quali esercizi precisi usare è una scelta dell'app tra quelli che rispettano queste regole.", "Pyramid pp. 177-178, tab. 7.16")}
      ${R("var(--g-back)", "Ordine", "Prima i multiarticolari con i pesi liberi, da freschi: la forza cresce di più negli esercizi fatti all'inizio, la massa no.", "Pyramid p. 178, Nunes 2021")}
      ${R("var(--muted)", "Recupero", "Almeno 90 secondi in media per la massa, di più per i multiarticolari delle gambe; per la forza almeno 2 minuti. L'app usa da 90 secondi a 3 minuti secondo il tipo di esercizio.", "Pyramid p. 201, Singer 2024")}
      ${R("var(--post)", "Settimana introduttiva", "All'inizio, o dopo una pausa, circa il 75% delle serie e un po' più lontano dal cedimento, per non arrivare con dolori forti alle sedute vere.", "Pyramid pp. 107-108")}
      ${R("var(--post)", "Scarico quando serve", "Non a calendario: dopo una settimana con almeno 2 sì su 5 domande (voglia, sonno, pesi in calo, stress, dolori), 30-50% di serie in meno con gli stessi pesi.", "Pyramid tab. 3.2, pp. 104-106, Coleman 2024")}
      ${R("var(--g-arms)", "Obiettivo: forza o entrambi", "Per la forza conta soprattutto il carico sull'esercizio che vuoi migliorare: poche serie pesanti bastano nel breve periodo, ma serve anche lavoro per la massa perché la forza cresca nel lungo periodo. Il libro alterna fasi di volume (singole leggere, molto lavoro complementare), di carico (singole più pesanti e richiami da 5 a 3 ripetizioni) e di picco. Chi vuole sia massa sia forza senza gareggiare usa le stesse regole con più complementari e meno singole.", "Pyramid tab. 2.5, 7.11-7.13, pp. 238-240, 249")}
      ${R("var(--g-arms)", "Progressione", "Doppia progressione: stesso peso finché arrivi in cima all'intervallo di ripetizioni in tutte le serie, poi aumenti. Chi comincia aumenta più spesso, chi è avanti più di rado.", "Pyramid pp. 127-129")}
      ${R("var(--g-arms)", "Chi comincia", "Niente carichi massimali finché la tecnica non è sicura; movimenti completi; gli esercizi per tutto il corpo (squat, stacchi) sono importanti fin dall'inizio.", "Zatsiorsky, Kraemer, Fry, cap. 4 e 6")}
    </div></div>`;
}
function whyGymHtml(){
  return `<div class="o-sec first"><div class="o-label">Palestra</div><p class="small muted" style="margin-top:6px">Perché il programma è fatto così, in breve.</p>
    <div class="o-list">
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--accent);margin-top:7px"></span><span class="n">Volume<small>Più serie fanno crescere di più, ma ogni serie in più rende meno. La crescita è buona già da circa 10 serie a settimana per muscolo; il programma sale da 9-10 a 12-18. <span class="cite">Pelland 2026, ACSM 2026</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--accent);margin-top:7px"></span><span class="n">Frequenza<small>Per la massa conta il totale delle serie, non in quante sedute le dividi. Per la forza aiuta ripetere gli esercizi più volte a settimana: per questo i fondamentali tornano in più sedute. Tra due sedute a corpo intero conviene almeno un giorno di riposo, ma non più di tre. <span class="cite">Schoenfeld 2019, Pelland 2026, NSCA</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--accent);margin-top:7px"></span><span class="n">Cedimento<small>Non serve arrivarci. Fondamentali con 1-3 ripetizioni in canna, complementari più vicini al limite. <span class="cite">Refalo 2023, ACSM 2026</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--accent);margin-top:7px"></span><span class="n">Carichi<small>Pesi leggeri e pesanti fanno crescere in modo simile, ma la forza massima cresce di più con pesi alti: da qui le serie da 3-5 e da 8 nelle fasi avanzate. <span class="cite">Schoenfeld 2017, ACSM 2026</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-back);margin-top:7px"></span><span class="n">Macchine o pesi liberi<small>Stessa crescita e forza simile; la forza migliora soprattutto nell'esercizio che alleni: per diventare forte su squat e panca, tieni il bilanciere su quelli; per il resto scegli liberamente. <span class="cite">Haugen 2023, Hernández-Belmonte 2022</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-back);margin-top:7px"></span><span class="n">Allenarsi a casa<small>Alcuni confronti diretti: piegamenti con l'elastico e panca piana con la stessa fatica hanno dato la stessa forza in 5 settimane (persone già allenate); piegamenti e panca leggera con lo stesso carico, stessa forza e crescita dei pettorali in 8 settimane; lo split squat (piede dietro rialzato) ha fatto crescere la forza come lo squat in 5 settimane. In generale con gli elastici la forza cresce come con i pesi. Gli studi coprono solo alcune coppie di esercizi: le altre sostituzioni a casa sono scelte dell'app per somiglianza di movimento. <span class="cite">Calatayud 2015, Kikuchi 2017, Speirs 2016, Lopes 2019</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-legs);margin-top:7px"></span><span class="n">Aumentare il peso<small>Con un intervallo di ripetizioni il peso sale quando arrivi al massimo in tutte le serie, o se ti restavano molte ripetizioni; con ripetizioni fisse, quando le chiudi tutte: +5%, l'aumento tipico indicato dalla NSCA (2,5-10%). NSCA e ACSM descrivono anche una regola più prudente: aumentare dopo due sedute di fila chiuse con ripetizioni oltre l'obiettivo (1-2 per l'ACSM, almeno 2 nell'ultima serie per la NSCA). <span class="cite">NSCA cap. 18, ACSM 2009</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-legs);margin-top:7px"></span><span class="n">Stallo<small>Quando un esercizio resta fermo per alcune sedute, l'app propone di ripartire dal 10% in meno e risalire, oppure di cambiarlo. Il manuale NSCA indica che, man mano che ci si allena, per continuare a progredire serve variare in modo pianificato volume, intensità ed esercizi, proprio per evitare gli stalli. Il 10% in meno è invece una regola pratica degli allenatori: non ci sono studi che la mettano alla prova. <span class="cite">NSCA cap. 21</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-back);margin-top:7px"></span><span class="n">Cambiare esercizi<small>In uno studio su 70 ragazze, cambiare gli esercizi in modo pianificato ha dato gli stessi risultati di tenerli fissi; una revisione precedente indica che un po' di variazione pianificata può aiutare, mentre cambiare troppo e a caso può frenare i progressi. Nei cicli pari (2, 4, …) l'app cambia da sola alcuni complementari per variare, mai gli esercizi dei test. L'unico limite: se cambi un esercizio dei test, il confronto con i test precedenti salta. <span class="cite">Kassiano 2022, Kassiano 2024</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-legs);margin-top:7px"></span><span class="n">Muscolo allungato<small>Gli esercizi che lavorano il muscolo in allungamento (leg curl da seduto, estensioni dei tricipiti sopra la testa) sembrano dare un po' più crescita, ma le prove sono poche e non tutte concordano. Il programma li preferisce perché non costano nulla; se manca la macchina, l'alternativa va bene. <span class="cite">Maeo 2021-22, Wolf 2025, Varovic 2024</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-legs);margin-top:7px"></span><span class="n">Ampiezza del movimento<small>Meglio il movimento completo, soprattutto per la forza. Le differenze con le ripetizioni parziali sono piccole. <span class="cite">Wolf 2023, ACSM 2026</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--muted);margin-top:7px"></span><span class="n">Riscaldamento<small>Sul riscaldamento specifico le prove sono contrastanti; qualche serie di avvicinamento con carichi via via più vicini a quelli di lavoro può aiutare la forza massima. Lo stretching statico breve (meno di 60 secondi per muscolo) cambia poco; tenute più lunghe riducono un po' la forza. <span class="cite">Behm 2016, Ribeiro 2021</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-legs);margin-top:7px"></span><span class="n">Ripresa dopo lo stop<small>In uno studio una gamba era stata allenata 10 settimane, poi c'erano state 20 settimane di stop: alla ripresa le due gambe sono migliorate allo stesso modo. La "memoria muscolare" non è dimostrata: per questo dopo uno stop si riparte dalla Fase 1. <span class="cite">Psilander 2019</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--post);margin-top:7px"></span><span class="n">Scarico<small>Gli esperti consigliano di prevederlo nella programmazione (anche uno per ogni blocco) e di regolarne la frequenza su come rispondi all'allenamento: è un consenso di esperti, non un risultato sperimentale. In uno studio su 39 persone allenate, una settimana di stop completo a metà di un programma di 9 settimane non ha cambiato la crescita muscolare e ha fatto crescere un po' meno la forza delle gambe. Per gli esperti si possono togliere serie lasciando i pesi uguali, e allontanarsi dal cedimento. Per questo nell'app lo scarico non è uno stop: nel programma su misura toglie circa il 40% delle serie con gli stessi pesi; nelle schede di Liparoti scegli tra scarico parziale, medio e marcato, come nel libro; nel Faleev è già nel programma. <span class="cite">Bell 2023, Coleman 2024, Helms (Pyramid), Liparoti cap. 13</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-arms);margin-top:7px"></span><span class="n">Proteine<small>In media, oltre circa 1,6 g di proteine per kg al giorno la massa magra non aumenta di più. <span class="cite">Morton 2018</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--post);margin-top:7px"></span><span class="n">Postura<small>Non è dimostrato che la postura causi mal di schiena. Gli esercizi per il collo migliorano la posizione della testa. <span class="cite">Swain 2020, Sheikhhoseini 2018</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--post);margin-top:7px"></span><span class="n">Scoliosi<small>Per un adulto con una curva lieve le linee guida indicano come opzione minima nessun trattamento specifico; gli esercizi specifici per la scoliosi vanno decisi con un professionista. <span class="cite">SOSORT 2016</span></small></span></div>
    </div></div>`;
}
document.addEventListener("change", e => {
  const el = e.target.closest("[data-set]");
  if(el){
    const k = el.dataset.set;
    if(k === "f3freq") S.settings.f3freq = Number(el.value);
    else if(el.type === "checkbox") S.settings[k] = el.checked;
    else S.settings[k] = el.value;
    pushMeta(); render(); return;
  }
  const fr = e.target.closest("[data-fsrm]");
  if(fr){ const v = parseFloat(String(fr.value).replace(",", ".")); S.settings.fsRm = {...(S.settings.fsRm || {}), [fr.dataset.fsrm]: v > 0 ? v : 0}; pushMeta(); render(); return; }
  const eq = e.target.closest("[data-equip]");
  if(eq){ const k = eq.dataset.equip; let a = (S.settings.equip || []).slice(); a = eq.checked ? [...new Set(a.concat([k]))] : a.filter(x => x !== k); S.settings.equip = a; pushMeta(); render(); return; }
  const pc = e.target.closest("[data-pcond]");
  if(pc){ const k = pc.dataset.pcond; let a = (S.settings.postureConds || []).slice(); a = pc.checked ? [...new Set(a.concat([k]))] : a.filter(x => x !== k); S.settings.postureConds = a; if(a.length) S.settings.posture = true; pushMeta(); render(); return; }
  const av = e.target.closest("[data-actv]");
  if(av){ const k = av.dataset.actv; let a = (S.settings.activities || ["palestra"]).slice(); a = av.checked ? [...new Set(a.concat([k]))] : a.filter(x => x !== k); if(!a.length){ av.checked = true; return; } S.settings.activities = a; pushMeta(); render(); return; }
  if(e.target.closest("#sheet [data-bfsel]")){ readBodyForm(); showSheet(bodySheetHtml()); updateBfResult(); return; }
  const w = e.target.closest("[data-warm]"); if(w && R){ if(!R.warm || Array.isArray(R.warm)) R.warm = {}; R.warm[w.dataset.warm] = w.checked; saveDraft(); }
});

function backAct(a, d, e){
  switch(a){
    case "backOpen": BA = null; view = "schiena"; render(); window.scrollTo(0,0); return true;
    case "backStart": backStart(); return true;
    case "backClose": BA = null; view = "postura"; render(); window.scrollTo(0,0); return true;
    case "baNext": BA.step++; render(); window.scrollTo(0,0); return true;
    case "baPrev": BA.step = Math.max(0, BA.step - 1); render(); window.scrollTo(0,0); return true;
    case "baStop": { const old = backState() || {}; S.settings.back = {...old, at:todayStr(), red:BA.red.slice(), stop:true}; BA = null; pushMeta(); render(); window.scrollTo(0,0); return true; }
    case "baSet": { const parts = d.k.split("."); if(parts[0] === "q") BA.q[parts[1]] = BA.q[parts[1]] === d.v ? undefined : d.v; else { const t = BA.t[parts[1]] = BA.t[parts[1]] || {}; t[parts[2]] = t[parts[2]] === d.v ? undefined : d.v; } render(); return true; }
    case "baChip": { const L = BA[d.l]; const i = L.indexOf(d.v); if(i >= 0) L.splice(i, 1); else L.push(d.v); render(); return true; }
    case "baSave": S.settings.back = backFromDraft(); BA = null; pushMeta(); view = "postura"; render(); window.scrollTo(0,0); return true;
    case "backOff": if(confirm("Togliere la routine per la schiena? La valutazione resta salvata.")){ const b = backState(); if(b) b.top = 0; pushMeta(); render(); } return true;
    case "backCheck": backCheck(d.v); return true;

  }

}

  if(TM.mode === "cd") return [TM.cd.sec * 1000];

const vo2At = v => -4.60 + 0.182258*v + 0.000104*v*v;            // v in m/min

const fmtKm = v => (Math.round(v*100)/100).toLocaleString("it");

function runPlansInfoHtml(){

    <p class="small" style="margin-top:8px">Bianco, rosso, blu e oro sono i quattro piani del capitolo 8 di Daniels (tabelle 8.1-8.4): quattro fasi di 4 settimane, con le sedute e le durate del libro; le distanze in miglia sono convertite (1 miglio ≈ 1,6 km). Ogni piano ha dei giorni minimi e dei giorni facoltativi, che ripetono una seduta facile della settimana: l'app aggiunge quelli facoltativi se scegli più giorni. L'app sceglie solo in che giorni mettere le sedute, con il lungo nell'ultimo giorno e le sedute dure lontane tra loro. Alla fine del bianco Daniels suggerisce, se vuoi, una gara non competitiva di massimo 40 minuti, partendo piano.</p>
    <p class="small" style="margin-top:8px">Dal libro vengono anche il piano per la maratona dei principianti (tabella 16.2: sedute A-E con 3, 4 o 5 giorni, poi due sedute di qualità a settimana) e il piano per i 5-10 km di chi corre 64-80 km a settimana (tabella 13.1, fasi II-IV). In quest'ultimo i giorni facili servono, come scrive Daniels, ad arrivare ai km della settimana: l'app li calcola per arrivare a 64 km; il lungo è il minore tra il 25% della settimana e 120 minuti.</p>
    <p class="small" style="margin-top:8px">Gli altri due piani per le gare (5-10 km in 12 settimane e mezza maratona) sono invece costruiti dall'app con le regole di Daniels, perché il libro non ha tabelle per quei livelli: quasi tutto a ritmo facile; in una singola seduta soglia al massimo il 10% dei km della settimana, intervalli l'8% (e non più di 10 km), ripetute il 5%; lungo entro il 30% della settimana sotto i 64 km, entro il 25% e le 2 ore e mezza da 64 km in su. Con meno giorni le sedute vengono accorciate per stare in questi limiti. Il blocco VO₂max riprende lo studio di Helgerud (2007): 4 × 4 minuti al 90-95% della FC massima, 3 volte a settimana per 8 settimane. È più intenso dei limiti di Daniels: serve una base di corsa.</p>

function renderCorsaProgressi(){
  const L = runSessions(); const c = runCfg() || {};
  if(!L.length) return `<p class="o-empty">Qui compariranno le corse registrate: minuti a settimana, chilometri e l'andamento dei ritmi.</p>`;
  const t = todayStr(); const mon = parseYmd(mondayStr(t));
  const weeks = []; for(let i=7;i>=0;i--){ const a = new Date(mon); a.setDate(mon.getDate() - 7*i); const as = ymd(a); const b = new Date(a); b.setDate(a.getDate()+7); const bs = ymd(b); const xs = L.filter(r => r.date >= as && r.date < bs); weeks.push({l: a.getDate() + "/" + (a.getMonth()+1), min: xs.reduce((s, r) => s + (r.time||0)/60, 0), km: xs.reduce((s, r) => s + (r.dist||0), 0)}); }
  const last4 = weeks.slice(-4); const mx = Math.max(30, ...weeks.map(x => x.min));
  const W = 330, H = 120, bw = (W-24)/8;
  const bars = weeks.map((x, i) => { const hh = (H-30) * x.min / mx; return `<rect x="${24 + i*bw + bw*.2}" y="${H-18-hh}" width="${bw*.6}" height="${Math.max(0, hh)}" rx="4" fill="${i === 7 ? "var(--accent)" : "var(--c2)"}" opacity="${i === 7 ? 1 : .7}"/><text x="${24 + i*bw + bw/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)">${x.l}</text>${x.min ? `<text x="${24 + i*bw + bw/2}" y="${H-22-hh}" text-anchor="middle" font-size="10" fill="var(--muted)">${Math.round(x.min)}</text>` : ""}`; }).join("");
  const hist = (c.hist || []);
  let h = `<div class="o-stats" style="margin-top:4px"><div><b>${L.filter(r => daysBetween(r.date, t) < 28).length}</b><span>corse in 4 settimane</span></div><div><b>${fmtKm(Math.round(last4.reduce((a,x) => a + x.km, 0)*10)/10)}</b><span>km in 4 settimane</span></div><div><b>${c.vdot ? c.vdot.toFixed(0) : "—"}</b><span>VDOT</span></div></div>`;
  h += `<div class="o-sec"><div class="o-head"><span class="o-label">Minuti a settimana</span><span class="r">ultime 8</span></div><div class="o-chart"><svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minuti di corsa a settimana">${bars}</svg></div></div>`;
  if(hist.length >= 2){ h += `<div class="o-sec"><div class="o-head"><span class="o-label">VDOT</span><span class="r">dai test e dalle gare</span></div><div class="o-chart">${lineChartSvg([{pts:hist.map(x => ({date:x.date, v:x.vdot})), c:"var(--c1)"}], {label:"VDOT nel tempo"})}</div></div>`; }
  h += `<div class="o-sec"><div class="o-label">Ultime corse</div><div class="o-list">${L.slice(-12).reverse().map(r => `<button class="o-row" data-act="openDay" data-d="${r.date}"><span class="dot" style="background:${RUN_C[r.t] || "var(--c2)"}"></span><span class="n">${esc(r.title)}<small>${esc(fmtDate(r.date))}</small></span><span class="p">${esc(runSummary(r)).replace(/ · /g, "<br>").split("<br>").slice(0,2).join("<br>")}</span></button>`).join("")}</div></div>`;
  return h;
}

const VB_SCALE = {principiante:1, intermedio:1.2, avanzato:1.4};

function vbCfg(){ return S.settings.volley || null; }

function vbNoHigh(){ const c = vbCfg() || {}; const w = latestWeight(); return c.level === "principiante" || (w && w > 100); }
function vbSession(w, k){ // costruisce la seduta: serie calcolate per arrivare al volume obiettivo

function vbInfoHtml(){
  return `<div class="o-sec first"><div class="o-label">Salto e rapidità: come è fatto</div>
    <p class="small" style="margin-top:8px">Si parte da salti a bassa intensità e atterraggi, poi salti medi, poi intensi; quando l'intensità sale il numero di appoggi scende. Ogni seduta ha 80-100 appoggi per chi comincia, 100-120 con un po' di esperienza, 120-140 per gli esperti. Tra due sedute di salti 48-72 ore. L'agilità segue la progressione del manuale: frenate e spostamenti laterali, poi cambi di direzione, poi reazione a un segnale. Settimane e sedute sono costruite dall'app su queste regole.</p>
    <p class="small" style="margin-top:8px">Cosa aspettarsi: in media il salto con contromovimento migliora di circa il 9% (Markovic 2007); il manuale NSCA riporta miglioramenti già dopo 4 settimane. Nei pallavolisti una meta-analisi di 14 studi ha trovato un miglioramento moderato del salto verticale, simile con programmi più brevi o più lunghi di 8 settimane, con fino a 2 o più di 2 sedute a settimana, con meno o più di 2000 salti totali: non servono volumi alti. Gli autori consigliano di adattare il lavoro al ruolo (Ramirez-Campillo 2020).</p>
    <p class="small" style="margin-top:8px">Atterraggi: nei saltatori con tendinopatia rotulea si è vista una minore flessione della caviglia negli atterraggi; la revisione (Tayfur 2022), con prove limitate, suggerisce atterraggi morbidi e una buona mobilità della caviglia.</p>
    <p class="small" style="margin-top:8px">Con la palestra: il manuale NSCA di solito sconsiglia pesi pesanti e salti nello stesso giorno, con un'eccezione, il "complex training" (pesi pesanti seguiti da salti simili), per chi ha già esperienza e con recupero adeguato. Con la corsa: prima i salti, poi la corsa.</p>
    <p class="small" style="margin-top:8px">Pesi e salti insieme: in una meta-analisi su atleti sani l'allenamento con i pesi ha migliorato il salto verticale almeno quanto la pliometria, e la combinazione dei due nella stessa seduta (complex training) è risultata la migliore nel salto con contromovimento (Ma 2025). Una network meta-analisi di 34 studi arriva alla stessa classifica, ma con studi piccoli e in parte a rischio di distorsione (Zhao 2026). La conseguenza che ne trae l'app: per saltare di più la palestra conta quanto i salti, e conviene fare entrambi.</p>
    <p class="tiny muted" style="margin-top:8px">NSCA, <i>Essentials of Strength Training and Conditioning</i>, 4ª ed., cap. 18 e 19 · Markovic 2007 · Ramirez-Campillo et al. 2020 (riferimenti completi in Guida → Fonti). Salto d'attacco: Fuchs 2019; salto a muro: Ficklin 2014; atterraggi: Tayfur 2022; pesi e salti: Ma 2025, Zhao 2026.</p></div>`;
}

/* ============ ciclismo ============ */
// Fonte: H. Allen, A. Coggan, Training and Racing with a Power Meter, 2ª ed.
// Livelli: Tabella 3.1 (p. 48). Test FTP: protocollo e regola del -5% (p. 46-47). Scala della fatica: Borg CR10, Tabella 3.3 (p. 50).
// Allenamenti: cap. 5 (p. 77-89): sweet spot 88-94% FTP e 95-98% FCsoglia, progressione 3×12 → 4×12 → 3×15 → 4×15 → 2×20 e
// 6-8 sedute prima della soglia (p. 80-82); soglia 2 × 20' al 96-105% con 10-15' di recupero (p. 82); VO2max 6 × 3' al 117% con 3'

// Struttura: tre settimane di carico e una di scarico, test a riposo dopo la settimana di scarico, almeno ogni 8 settimane (cap. 9).
