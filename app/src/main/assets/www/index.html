/* ============ Progressi ============ */
const TESTED = ["squat","pressa","panca","rematoreBil","military","curlEZ","frenchPress"];
// Relazione %1RM-ripetizioni (NSCA, Essentials 4ª ed., tab. 17.7); oltre 15 ripetizioni si usa la formula di Epley.
const NSCA_PCT = {1:100, 2:95, 3:93, 4:90, 5:87, 6:85, 7:83, 8:80, 9:77, 10:75, 11:70, 12:67, 13:66, 14:66, 15:65};
const pctRM = r => NSCA_PCT[Math.round(r)] || 100 / (1 + r/30);
const e1rm = (kg, r) => kg * 100 / pctRM(r);
function sparkSvg(vals){
  if(vals.length < 2) return "";
  const w = 96, hgt = 30, pad = 3, mn = Math.min(...vals), mx = Math.max(...vals), rng = mx - mn || 1;
  const pts = vals.map((v,i) => [pad + i*(w-2*pad)/(vals.length-1), hgt - pad - (v-mn)*(hgt-2*pad)/rng]);
  const d = pts.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--accent)"/></svg>`;
}
let progPeriod = "3m", progLift = null, progTab = "allenamento";
function renderProgressi(){
  const tabs = `<div class="o-seg" style="margin-bottom:10px">${[["allenamento","Palestra"],["corsa","Corsa"],["salto","Salto"],["bici","Bici"],["corpo","Corpo"]].filter(([k]) => k !== "bici" || bkActive() || bkSessions().length).filter(([k]) => k !== "corsa" || runActive() || runSessions().length || (S.settings.activities||[]).includes("corsa")).filter(([k]) => k !== "salto" || vbActive() || vbSessions().length).filter(([k]) => k !== "allenamento" || gymOn() || doneSessions().length).map(([k,l]) => `<button class="${progTab===k?"on":""}" data-act="progTab" data-v="${k}">${l}</button>`).join("")}</div>`;
  if(progTab === "allenamento" && !gymOn() && !doneSessions().length) progTab = "corsa";
  return tabs + (progTab === "corpo" ? renderCorpo() : progTab === "corsa" ? renderCorsaProgressi() : progTab === "salto" ? renderVolleyProgressi() : progTab === "bici" ? renderBikeProgressi() : renderAllenamento());
}
function renderAllenamento(){
  const list = doneSessions();
  if(!list.length) return `<div class="o-sec first"><p class="o-empty">Dopo il primo allenamento qui trovi il massimale stimato, la costanza, le serie per muscolo e i record.</p></div>`;
  const t = todayStr(); const now = parseYmd(t);
  const days = progPeriod === "4w" ? 28 : progPeriod === "3m" ? 91 : 100000;
  const from = new Date(now); from.setDate(now.getDate() - days + 1); const fromS = progPeriod === "all" ? "0000" : ymd(from);
  const inP = list.filter(x => x.date >= fromS);
  const plannedPast = Object.keys(S.planned).filter(d => S.planned[d] && d >= fromS && d <= t);
  const pct = plannedPast.length ? Math.round(100 * plannedPast.filter(d => sessionOn(d)).length / plannedPast.length) : null;
  const lifts = TESTED.concat(mainLifts()).filter((k,i,a) => a.indexOf(k) === i).map(k => ({k, pts:liftSeries(k).filter(q => q.date >= fromS)})).filter(x => x.pts.length);
  const gains = lifts.filter(x => x.pts.length >= 2).map(x => x.pts[x.pts.length-1].v / x.pts[0].v - 1);
  const gain = gains.length ? gains.reduce((a,b)=>a+b,0)/gains.length : null;
  let h = `<div class="o-seg">${[["4w","4 settimane"],["3m","3 mesi"],["all","Tutto"]].map(([k,l]) => `<button class="${progPeriod===k?"on":""}" data-act="progPeriod" data-v="${k}">${l}</button>`).join("")}</div>`;
  h += `<div class="o-sec first" style="padding-top:12px"><div class="o-stats" style="margin-top:0"><div><b>${inP.length}</b><span>allenamenti</span></div><div><b>${pct == null ? "—" : pct + "%"}</b><span>giorni segnati fatti</span></div><div><b>${gain == null ? "—" : (gain >= 0 ? "+" : "") + Math.round(gain*100) + "%"}</b><span>forza stimata</span></div></div></div>`;
  // massimale stimato
  if(!progLift || !lifts.some(x => x.k === progLift)) progLift = (lifts.find(x => x.pts.length >= 2) || lifts[0] || {}).k || null;
  h += `<div class="o-sec"><div class="o-head"><span class="o-label">Massimale stimato</span><span class="r">dai test e dalle serie</span></div>`;
  if(lifts.length){
    const L = lifts.find(x => x.k === progLift);
    h += `<div class="o-chips">${lifts.map(x => `<button class="${x.k===progLift?"on":""}" data-act="progLift" data-k="${x.k}">${esc(EX[x.k].n.replace(" con bilanciere","").replace(" (in piedi)","").replace("Curl con bilanciere sagomato (EZ)","Curl EZ"))}</button>`).join("")}</div>`;
    h += `<div class="o-chart">${lineChartSvg([{pts:L.pts, c:"var(--c1)"}], {h:170, label:"Massimale stimato di " + EX[L.k].n})}</div>`;
    const t8 = history(L.k).filter(x => x.e.kg8); const lastT = t8[t8.length-1];
    h += `<div class="o-lift"><span class="small muted">${lastT ? `Ultimo test: 8 × ${fmtKg(lastT.e.kg8)} kg` : "Nessun test ancora: stima dalle serie"}</span><b>${fmtKg(Math.round(L.pts[L.pts.length-1].v))} kg</b></div>`;
  } else h += `<p class="o-empty">Nessun peso registrato sugli esercizi principali in questo periodo.</p>`;
  h += `</div>`;
  // allenamenti a settimana (ultime 12 settimane): barre semplici al posto del calendario a quadratini
  const mon = monday(now); const wk = [];
  const firstMon = ymd(monday(parseYmd(list[0].date)));
  for(let i=11;i>=0;i--){ const a0 = new Date(mon); a0.setDate(mon.getDate()-7*i); if(ymd(a0) < firstMon) continue; const a1 = new Date(a0); a1.setDate(a0.getDate()+7); const as = ymd(a0), bs = ymd(a1);
    wk.push({d:a0, n:list.filter(x => x.date >= as && x.date < bs).length, cur:i===0}); }
  const target = S.settings.f3freq === 4 ? 4 : 3; const mxW = Math.max(target, ...wk.map(w => w.n)) + 0.5;
  const past = wk.filter(w => !w.cur); const avg = past.length ? past.reduce((a,w)=>a+w.n,0)/past.length : 0;
  const BW = 360, BH = 130, bl = 22, bb = 20, bt = 8, slot = (BW-bl)/12;
  const yv = v => bt + (BH-bt-bb)*(1 - v/mxW);
  let bars = `<line x1="${bl}" x2="${BW}" y1="${yv(target).toFixed(1)}" y2="${yv(target).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 4" opacity=".6"/><text x="${bl-6}" y="${(yv(target)+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--muted)">${target}</text><text x="${bl-6}" y="${(yv(0)+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--muted)">0</text>`;
  const off = 12 - wk.length;
  wk.forEach((w,i0) => { const i = i0 + off; const x = bl + i*slot + slot*.2, bw2 = slot*.6, y = yv(w.n);
    bars += `<rect x="${x.toFixed(1)}" y="${(w.n ? y : yv(0)-2).toFixed(1)}" width="${bw2.toFixed(1)}" height="${(w.n ? yv(0)-y : 2).toFixed(1)}" rx="4" fill="${w.cur ? "var(--accent)" : w.n >= target ? "var(--c1)" : "var(--accent-mint)"}" opacity="${w.cur || w.n >= target ? 1 : .8}"/>`;
    if(i0 % 3 === 0 || w.cur) bars += `<text x="${(x+bw2/2).toFixed(1)}" y="${BH-5}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${w.cur ? "ora" : w.d.getDate() + " " + MESI[w.d.getMonth()].slice(0,3)}</text>`; });
  h += `<div class="o-sec"><div class="o-head"><span class="o-label">Allenamenti a settimana</span><span class="r">media ${fmtKg(Math.round(avg*10)/10)} · obiettivo ${target}</span></div><div class="o-chart"><svg viewBox="0 0 ${BW} ${BH}" role="img" aria-label="Allenamenti a settimana">${bars}</svg></div></div>`;
  // serie per muscolo (settimana corrente)
  const monS = ymd(mon); const cnt = {legs:0, chest:0, back:0, shoulders:0, arms:0, core:0};
  for(const s2 of list.filter(x => x.date >= monS)) for(const e of (s2.ex||[])){ const g = EXG[e.key]; if(g in cnt) cnt[g] += (e.sets||[]).filter(z => (z.reps||0) > 0 || z.kg != null || z.emom).length; }
  const mx = Math.max(20, ...Object.values(cnt));
  h += `<div class="o-sec"><div class="o-head"><span class="o-label">Serie per muscolo</span><span class="r">questa settimana</span></div><div style="margin-top:10px">${Object.entries(cnt).map(([g,v]) => `<div class="o-mus"><span>${GROUPS[g].n}</span><div class="o-track"><i class="${v < 10 ? "lo" : ""}" style="width:${Math.min(100, v/mx*100)}%"></i><em style="left:${10/mx*100}%"></em></div><b style="text-align:right;font-variant-numeric:tabular-nums">${v}</b></div>`).join("")}</div><p class="tiny muted" style="margin-top:6px">La linea tratteggiata indica 10 serie, la soglia consigliata per la crescita. Ogni esercizio conta per il muscolo principale.</p></div>`;
  // record recenti
  const recs = [];
  const keys = [...new Set(list.flatMap(x => (x.ex||[]).map(e => e.key)))].filter(k => EX[k] && !EX[k].bw && EXG[k] !== "post" && EXG[k] !== "warm");
  for(const k of keys){ let best = 0; for(const s2 of list) for(const e of (s2.ex||[])) if(e.key === k){ for(const z of (e.sets||[])) if(z.kg && z.reps){ const v = e1rm(z.kg, Math.min(z.reps, 15)); if(v > best * 1.001){ if(best > 0) recs.push({k, date:s2.date, kg:z.kg, reps:z.reps}); best = v; } } } }
  recs.sort((a,b) => b.date.localeCompare(a.date));
  h += `<div class="o-sec"><div class="o-head"><span class="o-label">Record recenti</span></div><div class="o-list">${recs.length ? recs.slice(0,5).map((r,i) => `<button class="o-row" data-act="exInfo" data-k="${r.k}"><span class="n">${esc(EX[r.k].n)}${i === 0 && daysBetween(r.date, t) <= 7 ? '<span class="o-badge">nuovo</span>' : ""}<small>${esc(fmtDate(r.date))}</small></span><span class="p" style="font-family:var(--serif);font-size:17px;color:var(--ink);font-weight:600">${fmtKg(r.kg)} kg × ${r.reps}</span></button>`).join("") : `<p class="o-empty">I record compaiono quando superi un tuo risultato precedente.</p>`}</div></div>`;
  // tutti gli esercizi
  const per = {}; for(const s2 of list) for(const e of (s2.ex||[])) if(EXG[e.key] !== "post" && EXG[e.key] !== "warm" && (e.sets||[]).some(z => z.kg != null && z.kg > 0)) (per[e.key] = per[e.key] || []).push(Math.max(...e.sets.filter(z => z.kg != null).map(z => z.kg)));
  const rows = Object.entries(per).sort((a,b) => (EXG[a[0]]||"").localeCompare(EXG[b[0]]||""));
  if(rows.length) h += `<div class="o-sec"><div class="o-head"><span class="o-label">Tutti gli esercizi</span><span class="r">peso più alto per seduta</span></div><div class="o-list">${rows.map(([k, arr]) => `<button class="o-row" data-act="exInfo" data-k="${k}"><span class="dot" style="background:${grp(k).c}"></span><span class="n">${esc(EX[k]?.n || k)}<small>ultimo ${fmtKg(arr[arr.length-1])} kg · record ${fmtKg(Math.max(...arr))} kg</small></span>${arr.length > 1 ? sparkSvg(arr) : ""}</button>`).join("")}</div></div>`;
  return h;
}

/* ============ dati per grafici (home e progressi) ============ */
function liftSeries(k){ // massimale stimato per seduta: miglior serie (o test 8RM) di quella seduta
  const out = [];
  for(const s of doneSessions()) for(const e of (s.ex||[])) if(e.key === k){
    let best = 0;
    if(e.kg8) best = Math.max(best, e1rm(e.kg8, 8));
    for(const z of (e.sets||[])) if(z.kg != null && z.kg > 0 && z.reps > 0 && z.reps <= 15) best = Math.max(best, e1rm(z.kg, z.reps));
    if(best > 0){ const last = out[out.length-1]; if(last && last.date === s.date) last.v = Math.max(last.v, best); else out.push({date:s.date, v:best}); }
  }
  return out;
}
function mainLifts(){ return [S.settings.legMain === "pressa" ? "pressa" : "squat", "panca", "rematoreBil", "military"]; }
function lineChartSvg(series, opt={}){
  const W = opt.w || 360, H = opt.h || 160, pl = 40, pr = 10, pt = 10, pb = 22;
  const pts = series.flatMap(s => s.pts); if(!pts.length) return "";
  const ts = pts.map(q => parseYmd(q.date).getTime()); let t0 = Math.min(...ts), t1 = Math.max(...ts); if(t1 === t0){ t0 -= 864e5*3; t1 += 864e5*3; }
  const vs = pts.map(q => q.v); let mn = Math.min(...vs), mx = Math.max(...vs); const r = Math.max(mx - mn, 10);
  mn = Math.floor((mn - r*.2)/5)*5; mx = Math.ceil((mx + r*.15)/5)*5;
  const X = t => pl + (W-pl-pr) * (t - t0)/(t1 - t0), Y = v => pt + (H-pt-pb) * (1 - (v - mn)/(mx - mn));

  for(let k=0;k<=3;k++){ const v = mn + (mx-mn)*k/3, y = Y(v); g += `<line x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" ${k ? 'stroke-dasharray="2 4"' : ""}/><text x="${pl-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--muted)">${Math.round(v)}</text>`; }

  else if(bodyChart === "pct" || bodyChart === "ffm"){ const k = bodyChart; series = [{pts:comps.filter(e => e.comp[k] != null).map(e => ({date:e.date, v:e.comp[k]})), c:"var(--c1)"}]; unit = k === "pct" ? "%" : "kg"; }
  else { const k = bodyChart.slice(2); series = [{pts:L.filter(e => e.circ && e.circ[k]).map(e => ({date:e.date, v:e.circ[k]})), c:"var(--c1)"}]; unit = "cm"; }
  series = series.filter(x => x.pts.length);
  s += `<div class="o-sec"><div class="o-head"><span class="o-label">Andamento</span><span class="r">${bodyChart === "peso" ? "linea scura: media 7 giorni" : unit}</span></div>
    <div class="o-chips">${chips.map(([k,l]) => `<button class="${bodyChart===k?"on":""}" data-act="bodyChart" data-v="${k}">${l}</button>`).join("")}</div>
    ${series.length && series[0].pts.length > 1 ? `<div class="o-chart">${lineChartSvg(series, {label:"Andamento"})}</div>` : `<p class="o-empty">${series.length ? "Serve almeno una seconda misura per il grafico." : "Nessun valore registrato per questa voce."}</p>`}</div>`;
  s += `<div class="o-sec"><div class="o-head"><span class="o-label">Misure registrate</span></div><div class="o-list">${L.slice().reverse().slice(0, 30).map(e => {
      const parts = []; if(e.w) parts.push(fmtKg(e.w) + " kg");
      if(e.comp) parts.push("grasso " + fmtKg(e.comp.pct) + "%" + (e.comp.ffm ? " · FFM " + fmtKg(e.comp.ffm) + " kg" : "") + " (" + (e.comp.method === "bia" ? "BIA" : BF_EQ[e.comp.eq] ? BF_EQ[e.comp.eq].n : "pliche") + ")");
      if(e.circ) parts.push(Object.entries(e.circ).map(([k,v]) => CIRC_N[k].replace(" (contratto)","").toLowerCase() + " " + fmtKg(v)).join(", ") + " cm");
      return `<div class="o-row" style="cursor:default"><span class="n">${esc(fmtDate(e.date).replace(/^./, c => c.toUpperCase()))}<small>${esc(parts.join(" · "))}</small></span><button class="btn icon ghost" data-act="bodyDel" data-id="${e.id}" aria-label="Elimina">${svgI.close}</button></div>`; }).join("")}</div></div>`;
  if(lc && h && lc.comp.fm != null){ const fmi = lc.comp.fm/(h*h);
    s += `<div class="o-sec"><div class="o-head"><span class="o-label">Confronto con la popolazione</span><span class="r">tuo sesso ed età</span></div>
      <div class="o-lift"><span>FFMI <b style="font-size:17px">${fmtKg(Math.round(ffmi*10)/10)}</b></span><span class="small muted">${pctBand("ffmi", ffmi) || "—"}</span></div>
      <div class="o-lift"><span>FMI <b style="font-size:17px">${fmtKg(Math.round(fmi*10)/10)}</b></span><span class="small muted">${pctBand("fmi", fmi) || "—"}</span></div>
      <p class="tiny muted" style="margin-top:6px">Percentili di adulti sani non selezionati per lo sport (Schutz et al. 2002, adulti svizzeri, composizione misurata con BIA): chi si allena con i pesi supera spesso il 95° percentile di FFMI. FMI = massa grassa / altezza².</p></div>`; }
  s += `<div class="o-sec"><p class="tiny muted">FFMI = massa magra / altezza². Le equazioni plicometriche non sono validate sulla popolazione italiana: usale soprattutto per confrontare le tue misure nel tempo, con lo stesso metodo e la stessa equazione.</p></div>`;
  return s;
}

function whyGymHtml(){
  return `<div class="o-sec first"><div class="o-label">Palestra</div><p class="small muted" style="margin-top:6px">Perché il programma è fatto così, in breve.</p>
    <div class="o-list">
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--accent);margin-top:7px"></span><span class="n">Volume<small>Più serie fanno crescere di più, ma ogni serie in più rende meno. La crescita è buona già da circa 10 serie a settimana per muscolo; il programma sale da 9-10 a 12-18. <span class="cite">Pelland 2026, ACSM 2026</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--accent);margin-top:7px"></span><span class="n">Frequenza<small>Per la massa conta il totale delle serie, non in quante sedute le dividi. Per la forza aiuta ripetere gli esercizi più volte a settimana: per questo i fondamentali tornano in più sedute. Tra due sedute a corpo intero conviene almeno un giorno di riposo, ma non più di tre. <span class="cite">Schoenfeld 2019, Pelland 2026, NSCA</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--accent);margin-top:7px"></span><span class="n">Cedimento<small>Non serve arrivarci. Fondamentali con 1-3 ripetizioni in canna, complementari più vicini al limite. <span class="cite">Refalo 2023, ACSM 2026</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--accent);margin-top:7px"></span><span class="n">Carichi<small>Pesi leggeri e pesanti fanno crescere in modo simile, ma la forza massima cresce di più con pesi alti: da qui le serie da 3-5 e da 8 nelle fasi avanzate. <span class="cite">Schoenfeld 2017, ACSM 2026</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-back);margin-top:7px"></span><span class="n">Macchine o pesi liberi<small>Stessa crescita e forza simile; la forza migliora soprattutto nell'esercizio che alleni: per diventare forte su squat e panca, tieni il bilanciere su quelli; per il resto scegli liberamente. <span class="cite">Haugen 2023, Hernández-Belmonte 2022</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-back);margin-top:7px"></span><span class="n">Allenarsi a casa<small>Alcuni confronti diretti: piegamenti con l'elastico e panca piana con la stessa fatica hanno dato la stessa forza in 5 settimane (persone già allenate); piegamenti e panca leggera con lo stesso carico, stessa forza e crescita dei pettorali in 8 settimane; lo split squat (piede dietro rialzato) ha fatto crescere la forza come lo squat in 5 settimane. In generale con gli elastici la forza cresce come con i pesi. Gli studi coprono solo alcune coppie di esercizi: le altre sostituzioni a casa sono scelte dell'app per somiglianza di movimento. <span class="cite">Calatayud 2015, Kikuchi 2017, Speirs 2016, Lopes 2019</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-legs);margin-top:7px"></span><span class="n">Stallo<small>Quando un esercizio resta fermo per alcune sedute, l'app propone di ripartire dal 10% in meno e risalire, oppure di cambiarlo. Il manuale NSCA indica che, man mano che ci si allena, per continuare a progredire serve variare in modo pianificato volume, intensità ed esercizi, proprio per evitare gli stalli. Il 10% in meno è invece una regola pratica degli allenatori: non ho trovato studi che la mettano alla prova. <span class="cite">NSCA cap. 21</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-back);margin-top:7px"></span><span class="n">Cambiare esercizi<small>In uno studio su 70 ragazze, cambiare gli esercizi in modo pianificato ha dato gli stessi risultati di tenerli fissi; una revisione precedente indica che un po' di variazione pianificata può aiutare, mentre cambiare troppo e a caso può frenare i progressi. Nei cicli pari (2, 4, …) l'app cambia da sola alcuni complementari per variare, mai gli esercizi dei test. L'unico limite: se cambi un esercizio dei test, il confronto con i test precedenti salta. <span class="cite">Kassiano 2022, Kassiano 2024</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-legs);margin-top:7px"></span><span class="n">Muscolo allungato<small>Gli esercizi che lavorano il muscolo in allungamento (leg curl da seduto, estensioni dei tricipiti sopra la testa) sembrano dare un po' più crescita, ma le prove sono poche e non tutte concordano. Il programma li preferisce perché non costano nulla; se manca la macchina, l'alternativa va bene. <span class="cite">Maeo 2021-22, Wolf 2025, Varovic 2024</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-legs);margin-top:7px"></span><span class="n">Ampiezza del movimento<small>Meglio il movimento completo, soprattutto per la forza. Le differenze con le ripetizioni parziali sono piccole. <span class="cite">Wolf 2023, ACSM 2026</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--muted);margin-top:7px"></span><span class="n">Riscaldamento<small>Sul riscaldamento specifico le prove sono contrastanti; qualche serie di avvicinamento con carichi via via più vicini a quelli di lavoro può aiutare la forza massima. Lo stretching statico breve (meno di 60 secondi per muscolo) cambia poco; tenute più lunghe riducono un po' la forza. <span class="cite">Behm 2016, Ribeiro 2021</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-legs);margin-top:7px"></span><span class="n">Ripresa dopo lo stop<small>In uno studio una gamba era stata allenata 10 settimane, poi c'erano state 20 settimane di stop: alla ripresa le due gambe sono migliorate allo stesso modo. La "memoria muscolare" non è dimostrata: per questo dopo uno stop si riparte dalla Fase 1. <span class="cite">Psilander 2019</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--post);margin-top:7px"></span><span class="n">Scarico<small>Gli esperti consigliano di prevederlo nella programmazione (anche uno per ogni blocco) e di regolarne la frequenza su come rispondi all'allenamento: è un consenso di esperti, non un risultato sperimentale. In uno studio su 39 persone allenate, una settimana di stop completo a metà di un programma di 9 settimane non ha cambiato la crescita muscolare e ha fatto crescere un po' meno la forza delle gambe. Per questo nell'app lo scarico non è uno stop: è l'interruttore che dimezza le serie e toglie il 15% ai pesi, da usare quando sei stanco, oltre alle settimane di test. <span class="cite">Bell 2023, Coleman 2024</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--g-arms);margin-top:7px"></span><span class="n">Proteine<small>In media, oltre circa 1,6 g di proteine per kg al giorno la massa magra non aumenta di più. <span class="cite">Morton 2018</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--post);margin-top:7px"></span><span class="n">Postura<small>Non è dimostrato che la postura causi mal di schiena. Gli esercizi per il collo migliorano la posizione della testa. <span class="cite">Swain 2020, Sheikhhoseini 2018</span></small></span></div>
      <div class="o-row" style="cursor:default;align-items:flex-start"><span class="dot" style="background:var(--post);margin-top:7px"></span><span class="n">Scoliosi<small>Per un adulto con una curva lieve le linee guida indicano come opzione minima nessun trattamento specifico; gli esercizi specifici per la scoliosi vanno decisi con un professionista. <span class="cite">SOSORT 2016</span></small></span></div>
    </div></div>`;
}
document.addEventListener("change", e => {
  const el = e.target.closest("[data-set]");
  if(el){
    const k = el.dataset.set;
    if(k === "f3freq") S.settings.f3freq = Number(el.value);
    else if(el.type === "checkbox") S.settings[k] = el.checked;
    else S.settings[k] = el.value;
    pushMeta(); render(); return;
  }
  const fr = e.target.closest("[data-fsrm]");
  if(fr){ const v = parseFloat(String(fr.value).replace(",", ".")); S.settings.fsRm = {...(S.settings.fsRm || {}), [fr.dataset.fsrm]: v > 0 ? v : 0}; pushMeta(); render(); return; }
  const eq = e.target.closest("[data-equip]");
  if(eq){ const k = eq.dataset.equip; let a = (S.settings.equip || []).slice(); a = eq.checked ? [...new Set(a.concat([k]))] : a.filter(x => x !== k); S.settings.equip = a; pushMeta(); render(); return; }
  const pc = e.target.closest("[data-pcond]");
  if(pc){ const k = pc.dataset.pcond; let a = (S.settings.postureConds || []).slice(); a = pc.checked ? [...new Set(a.concat([k]))] : a.filter(x => x !== k); S.settings.postureConds = a; if(a.length) S.settings.posture = true; pushMeta(); render(); return; }
  const av = e.target.closest("[data-actv]");
  if(av){ const k = av.dataset.actv; let a = (S.settings.activities || ["palestra"]).slice(); a = av.checked ? [...new Set(a.concat([k]))] : a.filter(x => x !== k); if(!a.length){ av.checked = true; return; } S.settings.activities = a; pushMeta(); render(); return; }
  if(e.target.closest("#sheet [data-bfsel]")){ readBodyForm(); showSheet(bodySheetHtml()); updateBfResult(); return; }
  const w = e.target.closest("[data-warm]"); if(w && R){ if(!R.warm || Array.isArray(R.warm)) R.warm = {}; R.warm[w.dataset.warm] = w.checked; saveDraft(); }
});

function deloadP(p){

  if(q.t === "pyr") q.reps = q.reps.slice(0, Math.ceil(q.reps.length/2));

function wuSets(it, bi){

function initAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === "suspended") audioCtx.resume(); }catch(e){} }
function tone(t0, dur, freq, vol){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  o.type = "square"; o.frequency.value = freq;
  f.type = "lowpass"; f.frequency.value = 5200;
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.004); g.gain.setValueAtTime(vol, t0 + dur - 0.01); g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
  o.connect(f).connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
/* suono da timer digitale: kind "alarm" = 3 gruppi da 4 bip, "pip" = un bip corto (ultimi secondi), "double" = due bip (minuto EMOM) */
function ding(){ // un solo rintocco morbido: due sinusoidi che si spengono lentamente
  const now = audioCtx.currentTime + 0.02;
  [[880, 0.22], [1760, 0.06]].forEach(([f, v]) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(v, now + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, now + 1.6); o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now + 1.7); });
}
function beep(kind="alarm"){
  if(!S.settings.sound) return;
  if(kind === "pip") return; // niente bip prima della fine
  try{ navigator.vibrate && navigator.vibrate(250); }catch(e){}
  if(!audioCtx) return;
  try{ if(audioCtx.state === "suspended") audioCtx.resume(); }catch(e){}
  try{ ding(); }catch(e){}
  return;
  if(kind === "alarm"){ try{ navigator.vibrate && navigator.vibrate([120,60,120,60,120,60,120]); }catch(e){} }
  if(!audioCtx) return;
  try{ if(audioCtx.state === "suspended") audioCtx.resume(); }catch(e){}

/* ============ corsa: VDOT, ritmi e piani ============ */
// Equazioni di Daniels e Gilbert (1979): costo di ossigeno della corsa e frazione di VO2max sostenibile per una durata.
// Zone secondo J. Daniels, Daniels' Running Formula: E 59-74% del VDOT (65-79% FCmax), M 75-84% (80-89%), T circa 88% (88-92%),
// I circa 97,5% (97-100%), R = I meno 6 secondi ogni 400 m. Limiti per seduta: T <= 10% del volume settimanale, I <= 8% (max 10 km),
// R <= 5% (max 8 km), lungo <= 25-30% della settimana e <= 150 minuti, M <= 20% e <= 110 minuti.
const vo2At = v => -4.60 + 0.182258*v + 0.000104*v*v;            // v in m/min
const fracAt = t => 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t); // t in minuti
const speedAtVo2 = vo2 => (-0.182258 + Math.sqrt(0.182258*0.182258 + 4*0.000104*(4.60 + vo2))) / (2*0.000104);
function vdotFrom(meters, seconds){ const t = seconds/60, v = meters/t; return vo2At(v) / fracAt(t); }
function raceTime(vdot, meters){ let lo = meters/400, hi = meters/50; for(let i=0;i<60;i++){ const mid = (lo+hi)/2; if(vo2At(meters/mid)/fracAt(mid) > vdot) lo = mid; else hi = mid; } return (lo+hi)/2*60; }
function paceAt(vdot, f){ return 1000 / speedAtVo2(f*vdot) * 60; } // secondi al km
function runPaces(vdot){
  const I = paceAt(vdot, 0.975);
  return {E:[paceAt(vdot, 0.74), paceAt(vdot, 0.59)], M: raceTime(vdot, 42195)/42.195, T: paceAt(vdot, 0.88), I, R: I - 15};
}

const RUN_N = {W:"Camminata", E:"Corsa facile", L:"Corsa lunga facile", M:"Ritmo maratona", T:"Soglia", I:"Intervalli", R:"Ripetute", J:"Recupero di corsa leggera", ST:"Allunghi", TT:"Test"};

const PRIO = {palestra:{n:"Palestra", d:"Massa e forza prima di tutto: corse facili brevi, sedute dure della corsa lontane dai pesi."}, equilibrio:{n:"Equilibrio", d:"Pesi e corsa con lo stesso peso. Le sedute dure possono stare nei giorni dei pesi, separate da qualche ora."}, corsa:{n:"Corsa", d:"La corsa viene prima: i pesi diventano un complemento, anche con 2 sedute a settimana."}};

function comboPropose(g, r, prio){ // prova tutte le combinazioni di giorni per la corsa e tiene quella che costa meno

  const ws = {palestra:3, equilibrio:1, corsa:0.5}[prio], wb = {palestra:1, equilibrio:0.5, corsa:0.2}[prio];
  let best = null, bc = 1e9;

    if(!d.some(x => x >= 5)) c += 2; if(c < bc){ bc = c; best = d; } }

}

function runKm(s, p){ // distanza stimata dai ritmi: tempo di ogni blocco diviso il suo ritmo

  const hist = (c.hist || []);

  h += `<div class="o-sec"><div class="o-head"><span class="o-label">Minuti a settimana</span><span class="r">ultime 8</span></div><div class="o-chart"><svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minuti di corsa a settimana">${bars}</svg></div></div>`;
  if(hist.length >= 2){ h += `<div class="o-sec"><div class="o-head"><span class="o-label">VDOT</span><span class="r">dai test e dalle gare</span></div><div class="o-chart">${lineChartSvg([{pts:hist.map(x => ({date:x.date, v:x.vdot})), c:"var(--c1)"}], {label:"VDOT nel tempo"})}</div></div>`; }
  h += `<div class="o-sec"><div class="o-label">Ultime corse</div><div class="o-list">${L.slice(-12).reverse().map(r => `<button class="o-row" data-act="openDay" data-d="${r.date}"><span class="dot" style="background:${RUN_C[r.t] || "var(--c2)"}"></span><span class="n">${esc(r.title)}<small>${esc(fmtDate(r.date))}</small></span><span class="p">${esc(runSummary(r)).replace(/ · /g, "<br>").split("<br>").slice(0,2).join("<br>")}</span></button>`).join("")}</div></div>`;

function vbInfoHtml(){
  return `<div class="o-sec first"><div class="o-label">Salto e rapidità: come è fatto</div>
    <p class="small" style="margin-top:8px">Si parte da salti a bassa intensità e atterraggi, poi salti medi, poi intensi; quando l'intensità sale il numero di appoggi scende. Ogni seduta ha 80-100 appoggi per chi comincia, 100-120 con un po' di esperienza, 120-140 per gli esperti. Tra due sedute di salti 48-72 ore. L'agilità segue la progressione del manuale: frenate e spostamenti laterali, poi cambi di direzione, poi reazione a un segnale. Settimane e sedute sono costruite dall'app su queste regole.</p>
    <p class="small" style="margin-top:8px">Cosa aspettarsi: in media il salto con contromovimento migliora di circa il 9% (Markovic 2007); il manuale NSCA riporta miglioramenti già dopo 4 settimane. Nei pallavolisti una meta-analisi di 14 studi ha trovato un miglioramento moderato del salto verticale, simile con programmi più brevi o più lunghi di 8 settimane, con fino a 2 o più di 2 sedute a settimana, con meno o più di 2000 salti totali: non servono volumi alti. Gli autori consigliano di adattare il lavoro al ruolo (Ramirez-Campillo 2020).</p>
    <p class="small" style="margin-top:8px">Atterraggi: nei saltatori con tendinopatia rotulea si è vista una minore flessione della caviglia negli atterraggi; la revisione (Tayfur 2022), con prove limitate, suggerisce atterraggi morbidi e una buona mobilità della caviglia.</p>
    <p class="small" style="margin-top:8px">Con la palestra: il manuale NSCA di solito sconsiglia pesi pesanti e salti nello stesso giorno, con un'eccezione, il "complex training" (pesi pesanti seguiti da salti simili), per chi ha già esperienza e con recupero adeguato. Con la corsa: prima i salti, poi la corsa.</p>
    <p class="small" style="margin-top:8px">Pesi e salti insieme: in una meta-analisi su atleti sani l'allenamento con i pesi ha migliorato il salto verticale almeno quanto la pliometria, e la combinazione dei due nella stessa seduta (complex training) è risultata la migliore nel salto con contromovimento (Ma 2025). Una network meta-analisi di 34 studi arriva alla stessa classifica, ma con studi piccoli e in parte a rischio di distorsione (Zhao 2026). La conseguenza che ne trae l'app: per saltare di più la palestra conta quanto i salti, e conviene fare entrambi.</p>
    <p class="tiny muted" style="margin-top:8px">NSCA, <i>Essentials of Strength Training and Conditioning</i>, 4ª ed., cap. 18 e 19 · Markovic 2007 · Ramirez-Campillo et al. 2020 (riferimenti completi in Guida → Fonti). Salto d'attacco: Fuchs 2019; salto a muro: Ficklin 2014; atterraggi: Tayfur 2022; pesi e salti: Ma 2025, Zhao 2026.</p></div>`;
}

    case "emomSave": { const st = curStep(); const kg = readNum("inKg"); const r = readNum("inReps") ?? st.min; R.log[R.bi][st.ii].sets.push({emom:true, kg, rounds:r, min:st.min, reps:st.reps, ok:r >= st.min}); if(R.bi + 1 >= R.blocks.length){ R.screen = "end"; rRender(); } else startRest(90); break; }
    case "testTry": { const kg = readNum("inKg"), reps = readNum("inReps"); if(kg == null || reps == null) break; R.test.tries.push({kg, reps}); R.log[R.bi][curStep().ii].sets.push({kg, reps, label:"prova"}); R.inKg = kg; R.inReps = null; R.afterRest = "test"; startRest(150); break; }
    case "testFound": { const ok = R.test.tries.filter(z => z.reps >= 8); R.test.kg8 = Math.max(...ok.map(z => z.kg)); R.log[R.bi][curStep().ii].kg8 = R.test.kg8; R.test.phase = "back"; R.inReps = null; R.afterRest = "test"; startRest(120); break; }
    case "testBack": { const st = curStep(); const ex = EX[R.blocks[R.bi].items[st.ii].ex]; const reps = readNum("inReps") ?? 0; const kg = roundStep(R.test.kg8*0.9, ex.step); R.log[R.bi][st.ii].sets.push({kg, reps, label:"richiamo"}); R.test.back++; R.inReps = null; if(reps < 8 || R.test.back >= 5) endTestEx(); else { R.afterRest = "test"; startRest(60); } break; }
    case "testEnd": endTestEx(); break;
    case "mxMode": R.mx.mode = d.v; rRender(); break;
    case "mxTry": { const st = curStep(); const kg = readNum("inKg"); if(kg == null || kg <= 0) break; const T = R.mx; const reps = T.mode === "rm" ? (readNum("inReps") ?? 0) : (d.v === "1" ? 1 : 0);
      T.tries.push({kg, ok:d.v === "1" && reps >= 1, reps}); R.log[R.bi][st.ii].sets.push({kg, reps, label:T.mode === "rm" ? "serie" : "tentativo"}); R.inKg = null; R.afterRest = "max"; startRest(300); break; }
    case "mxEnd": { const st = curStep(); const T = R.mx; const v = T.mode === "1rm" ? Math.max(...T.tries.filter(z => z.ok).map(z => z.kg)) : Math.round(Math.max(...T.tries.filter(z => z.reps >= 1 && z.reps <= 5).map(z => e1rm(z.kg, z.reps)))); R.log[R.bi][st.ii].kg1 = v; endTestEx(); break; }
    case "mxSkip": endTestEx(); break;
    case "finish": finishSession(); break;
    case "setWhere": S.settings.where = d.v; pushMeta(); render(); break;
    case "clearFutureSet": if(confirm("Togliere i giorni di palestra segnati da domani in poi?")){ const t = todayStr(); for(const k of Object.keys(S.planned)) if(k > t) delete S.planned[k]; pushMeta(); render(); } break;
    case "openSettings": if(view !== "impostazioni"){ setPrev = view; view = "impostazioni"; render(); window.scrollTo(0,0); } break;
    case "closeSettings": view = setPrev || "oggi"; render(); window.scrollTo(0,0); break;
    case "setProgram": { const v = d.v === "pi" ? (S.settings.piSub === "faleev" ? "faleev" : "liparoti") : d.v; if(v !== "principi") S.settings.piSub = v; if((S.settings.program || "liparoti") !== v){ S.settings.program = v; } pushMeta(); render(); break; }
    case "genSplit": { const g = {...(S.settings.gen || {})}; g.split = {...(g.split || {}), [d.n]:Number(d.v)}; S.settings.gen = g; pushMeta(); render(); break; }
    case "genSpecPick": { const g = {...(S.settings.gen || {})}; let a = (g.specSel || []).slice(); a = a.includes(d.v) ? a.filter(x => x !== d.v) : a.concat([d.v]).slice(-2); g.specSel = a; S.settings.gen = g; render(); break; }
    case "genSpecStart": { const g = {...(S.settings.gen || {})}; g.spec = {m:(g.specSel || []).slice(0, 2), start:mondayStr(todayStr())}; g.specSel = []; S.settings.gen = g; pushMeta(); render(); break; }
    case "genSpecStop": if(confirm("Tornare alla fase bilanciata?")){ const g = {...(S.settings.gen || {})}; g.spec = null; S.settings.gen = g; pushMeta(); render(); } break;
    case "genLevel": S.settings.level = d.v; S.settings.levelChosen = true; pushMeta(); render(); break;
    case "genGoal": S.settings.gen = {...(S.settings.gen || {}), goal:d.v}; pushMeta(); render(); break;
    case "genVol": S.settings.gen = {...(S.settings.gen || {}), vol:Number(d.v)}; pushMeta(); render(); break;
    case "deloadCheck": showSheet(deloadCheckHtml()); break;
    case "dlAns": { const b = document.querySelectorAll("#sheet [data-dl]"); const yes = [...b].filter(x => x.checked).length; $("#dlOut").innerHTML = yes >= 2 ? `<b>Sì a ${yes} domande:</b> il libro suggerisce di valutare una settimana di scarico: se la fai, attiva l'interruttore "Settimana di scarico" nelle sedute di questa settimana.` : `<b>Sì a ${yes} ${yes === 1 ? "domanda" : "domande"}:</b> vai avanti normalmente.`; break; }
    case "openPlan": planOpen = d.v; view = "piano"; render(); window.scrollTo(0,0); break;
    case "closePlan": planOpen = null; render(); window.scrollTo(0,0); break;
    case "goWeek": closeSheet(); view = "piano"; planOpen = null; render(); window.scrollTo(0,0); break;
    case "wkTog": { if(!weekDraft) weekDraft = JSON.parse(JSON.stringify(weekSaved())); const v = Number(d.v); let a = weekDraft[d.k]; a = a.includes(v) ? a.filter(x => x !== v) : a.concat([v]); if(d.k === "vb"){ const max = vbCfg().season ? 1 : 2; if(a.length > max) a = a.slice(-max); } weekDraft[d.k] = a; render(); break; }
    case "setPrio": S.settings.combo = {...(S.settings.combo || {}), priority:d.v}; weekDraft = null; pushMeta(); render(); break;
    case "wkPropose": { if(!weekDraft) weekDraft = JSON.parse(JSON.stringify(weekSaved())); const P = RUN_PLANS[runCfg().plan]; const g = weekDraft.priority === "corsa" ? 2 : 3; let r = weekDraft.run.length || 3; r = Math.min(Math.max(r, P.days[0]), P.days[P.days.length-1]); if(weekDraft.priority === "palestra" && P.days[0] <= 3) r = Math.min(r, 3); const x = comboPropose(g, r, weekDraft.priority); weekDraft.gym = x.gymDays; weekDraft.run = x.runDays; render(); break; }
    case "wkCancel": weekDraft = null; render(); break;
    case "wkSave": if(!weekDraft) weekDraft = JSON.parse(JSON.stringify(weekSaved())); if(weekErrors(weekDraft).length) break; weekSave(); render(); break;
    case "goSwaps": planOpen = "palestra"; view = "piano"; render(); setTimeout(() => { const el = $("#cambiati"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }, 50); break;
    case "vbSetup": { const c = vbCfg() || {}; vbDraft = {level:c.level || "principiante", season:!!c.season, days:(c.days || [1,4]).slice(), ball:c.ball}; showSheet(vbSetupSheet()); break; }
    case "vbLv": vbDraft.level = d.v; vbDraft.ball = $("#vbBall").checked; showSheet(vbSetupSheet()); break;
    case "vbSeason": vbDraft.season = d.v === "1"; vbDraft.ball = $("#vbBall").checked; showSheet(vbSetupSheet()); break;
    case "vbConfirm": { const t = todayStr(); const nm = (() => { const x = parseYmd(mondayStr(t)); x.setDate(x.getDate()+7); return ymd(x); })(); const c = vbCfg() || {};
      const same = c.on && c.level === vbDraft.level && !!c.season === vbDraft.season;
      const want = vbDraft.season ? 1 : 2, od = (c.days || []).slice(); const vdays = od.length === want && !od.some(x => od.includes((x+1)%7)) ? od : pickDays(want, busyDays("vb"), true);
      S.settings.volley = {on:true, level:vbDraft.level, season:vbDraft.season, days:vdays.sort((a,b) => a-b), ball:$("#vbBall").checked, start: same && c.start ? c.start : (dowOf(t) <= 1 ? mondayStr(t) : nm)};
      if(!(S.settings.activities||[]).includes("pallavolo")) S.settings.activities = (S.settings.activities||[]).concat(["pallavolo"]);
      pushMeta(); vbDraft = null; closeSheet(); weekDraft = null; view = "piano"; planOpen = "pallavolo"; render(); window.scrollTo(0,0); break; }
    case "vbStop": if(confirm("Togliere il programma di salto e rapidità? Le sedute registrate restano.")){ S.settings.volley = {...(vbCfg()||{}), on:false}; pushMeta(); render(); } break;
    case "vbInfo": { const ss = vbSession(Number(d.w), d.k); showSheet(`<div class="grab"></div><div class="stack"><div class="row between"><div><span class="eyebrow">Settimana ${ss.w+1} · seduta ${ss.k}</span><h2>${esc(ss.title)}</h2></div><button class="btn icon ghost" data-act="closeSheet" aria-label="Chiudi">${svgI.close}</button></div><p class="small muted">~${vbMin(ss)} minuti · ${esc(ss.ph)}</p>${vbDetailHtml(ss)}</div>`); break; }
    case "vbEx": vbExSheet(d.k, d.t); break;
    case "vbLog": rlRpe = null; showSheet(vbLogForm(d.d)); break;
    case "vbSave": vbSave(d.d); closeSheet(); render(); break;
    case "bkSetup": { const c = bkCfg() || {}; bkDraft = {power:!!c.power, ftp:c.ftp, fthr:c.fthr, days:(c.days || [1,3,5]).slice()}; showSheet(bkSetupSheet()); break; }
    case "bkPower": { const f = $("#bkFtp"), h2 = $("#bkFthr"); if(f) bkDraft.ftp = numOf(f.value); if(h2) bkDraft.fthr = numOf(h2.value); bkDraft.power = d.v === "1"; showSheet(bkSetupSheet()); break; }
    case "bkConfirm": { const f = $("#bkFtp"), h2 = $("#bkFthr"); const ftp = f ? numOf(f.value) : null, fthr = h2 ? numOf(h2.value) : null; const t = todayStr(); const nm = (() => { const x = parseYmd(mondayStr(t)); x.setDate(x.getDate()+7); return ymd(x); })(); const c = bkCfg() || {};
      S.settings.bike = {...c, on:true, power:bkDraft.power, ftp: ftp && ftp > 50 && ftp < 600 ? Math.round(ftp) : (bkDraft.power ? c.ftp : c.ftp), fthr: fthr && fthr > 100 && fthr < 220 ? Math.round(fthr) : c.fthr, days:((c.days || []).length >= 3 && c.days.length <= 5 ? c.days.slice() : pickDays(3, busyDays("bk"), false)).sort((a,b) => a-b), start: c.on && c.start ? c.start : (dowOf(t) <= 1 ? mondayStr(t) : nm)};
      if(!(S.settings.activities||[]).includes("ciclismo")) S.settings.activities = (S.settings.activities||[]).concat(["ciclismo"]);
      pushMeta(); bkDraft = null; closeSheet(); weekDraft = null; view = "piano"; planOpen = "ciclismo"; render(); window.scrollTo(0,0); break; }
    case "bkStop": if(confirm("Togliere il piano di ciclismo? Le uscite registrate restano.")){ S.settings.bike = {...(bkCfg()||{}), on:false}; pushMeta(); render(); } break;
    case "bkInfo": { const ss = bkWeekPlan(Number(d.w))[Number(d.dw)]; showSheet(`<div class="grab"></div><div class="stack"><div class="row between"><div><span class="eyebrow">Settimana ${Number(d.w)+1} · ${DOW_N[Number(d.dw)]}</span><h2>${esc(ss.title)}</h2></div><button class="btn icon ghost" data-act="closeSheet" aria-label="Chiudi">${svgI.close}</button></div><p class="small muted">${bkH(bkMin(ss))} · ${esc(BK_WEEKS[Number(d.w)].ph)}</p>${bkDetailHtml(ss)}</div>`); break; }
    case "bkLog": rlRpe = null; showSheet(bkLogForm(d.d)); break;
    case "bkSave": { const r = bkSave(d.d); closeSheet(); render(); if(r.p20 || r.h20) setTimeout(() => showSheet(`<div class="grab"></div><div class="stack"><h2>Soglia aggiornata</h2><p>${r.p20 ? `FTP: <b>${Math.round(r.p20*0.95)} W</b> (${r.p20} W meno il 5%). ` : ""}${r.h20 ? `FC di soglia stimata: <b>${r.h20}</b>.` : ""} Le prossime sedute usano i nuovi valori.</p><button class="btn primary big" data-act="closeSheet">Ok</button></div>`), 50); break; }
    case "runPlans": showSheet(runPlansSheet()); break;
    case "runPick": { const P = RUN_PLANS[d.v]; const c = runCfg() || {}; const t = todayStr(); const nm = (() => { const x = parseYmd(mondayStr(t)); x.setDate(x.getDate()+7); return ymd(x); })();
      const days = c.days && c.days.length >= P.days[0] && c.days.length <= P.days[P.days.length-1] ? c.days.slice() : pickDays(P.days[0], busyDays("run"), false);
      runSetup = {plan:d.v, days, start: dowOf(t) <= 1 ? mondayStr(t) : nm, raceDate:null}; showSheet(runSetupSheet()); break; }
    case "runStartWk": runSetup.start = d.v; showSheet(runSetupSheet()); break;
    case "runConfirm": { const r = $("#rsRace"); const P = RUN_PLANS[runSetup.plan]; if(r) runSetup.raceDate = r.value || null;
      let start = runSetup.start; if(P.race && runSetup.raceDate){ const x = parseYmd(mondayStr(runSetup.raceDate)); x.setDate(x.getDate() - 7*(P.weeks.length-1)); start = ymd(x); }
      const c = runCfg() || {}; S.settings.run = {...c, plan:runSetup.plan, days:runSetup.days.slice().sort((a,b) => a-b), start, raceDate: P.race ? runSetup.raceDate : null};
      if(!(S.settings.activities||[]).includes("corsa")) S.settings.activities = (S.settings.activities||[]).concat(["corsa"]);
      pushMeta(); runSetup = null; closeSheet(); weekDraft = null; view = "piano"; planOpen = "corsa"; render(); window.scrollTo(0,0); break; }
    case "runStop": if(confirm("Togliere il piano di corsa? Le corse registrate restano.")){ S.settings.run = {...(runCfg()||{}), plan:null}; pushMeta(); render(); } break;
    case "runInfo": runInfoSheet(Number(d.w), Number(d.dw)); break;
    case "vdotOpen": vdotSheet.d = 5000; showSheet(vdotSheet()); break;
    case "vdDist": { const tv = $("#vdTime").value, hv = $("#vdHr").value; vdotSheet.d = Number(d.v); showSheet(vdotSheet()); $("#vdTime").value = tv; $("#vdHr").value = hv; break; }
    case "vdSave": { const tt = parseDur($("#vdTime").value), hr = numOf($("#vdHr").value); const c = runCfg() || {}; const nc = {...c};
      if(hr != null){ if(hr < 120 || hr > 230){ $("#vdOut").innerHTML = `<span style="color:var(--warn)">La FC massima di solito è tra 150 e 210.</span>`; break; } nc.hrmax = Math.round(hr); } else delete nc.hrmax;
      if(tt){ const v = Math.round(vdotFrom(vdotSheet.d, tt)*10)/10; if(!(v > 20 && v < 90)){ $("#vdOut").innerHTML = `<span style="color:var(--warn)">Tempo non plausibile per questa distanza.</span>`; break; } nc.vdot = v; nc.hist = (c.hist||[]).concat([{date:todayStr(), vdot:v, src:vdotSheet.d}]); }
      S.settings.run = nc; pushMeta(); closeSheet(); render(); break; }
    case "runStart": closeSheet(); if(loadRunDraft()){ RR = loadRunDraft(); runOpen(); } else runStart(d.d); break;
    case "runResume": RR = loadRunDraft(); if(RR){ initAudio(); runOpen(); } break;
    case "runExit": saveRunDraft(); runClose(); break;
    case "runDiscard": if(confirm("Eliminare la corsa in corso senza salvarla?")){ clearRunDraft(); RR = null; const el = $("#runr"); if(el && !el.hidden) runClose(); else render(); } break;
    case "rrPause": { const now = Date.now(); if(RR.pausedAt){ const dt = now - RR.pausedAt; RR.t0 += dt; RR.pauseTotal += dt; RR.pausedAt = null; } else RR.pausedAt = now; rrRender(); break; }
    case "rrNext": rrNext(); break;
    case "rrEnd": if(confirm("Terminare la corsa qui?")){ RR.endedAt = rrNow(); RR.screen = "end"; rrRender(); } break;
    case "rlRpe": rlRpe = Number(d.v); document.querySelectorAll(".rl-rpe button").forEach(b => b.classList.toggle("on", Number(b.dataset.v) === rlRpe)); break;
    case "runLog": rlRpe = null; RR = null; showSheet(`<div class="grab"></div>` + runLogForm(d.d)); break;
    case "runSave": { const r = runSave(d.d); if(!r) break; const wasRunner = !!(RR && $("#runr") && !$("#runr").hidden); clearRunDraft(); RR = null; if(wasRunner) runClose(); else { closeSheet(); render(); }
      if(r.vdot) setTimeout(() => showSheet(`<div class="grab"></div><div class="stack"><h2>Ritmi aggiornati</h2><p>Dal test: VDOT <b>${r.vdot.toFixed(1)}</b>. Le prossime corse useranno i nuovi ritmi.</p><button class="btn primary big" data-act="closeSheet">Ok</button></div>`), 50);
      break; }
    case "runDel": { const r = S.sessions[d.id]; if(r && confirm("Eliminare questa seduta?")){ r.deleted = true; r.updatedAt = Date.now(); pushSession(r); closeSheet(); render(); } break; }
  }
}

render();
if(!S.settings.levelChosen && !doneSessions().length) startOnboarding();
initSync();

<script>
/* ===== Integrazione Android (aggiunta solo nella versione APK) ===== */
(function(){
  // schermata con il logo: 2 secondi dall'apertura, poi dissolvenza
  const sp = document.getElementById("splash");
  if(sp) setTimeout(() => { sp.classList.add("out"); setTimeout(() => sp.remove(), 350); }, Math.max(0, 2000 - performance.now()));
  const A = window.Android;
  if(!A) return;
  const U = window.__upd = {info:null, progress:null, checking:false, msg:""};

  // --- notifica di fine recupero quando l'app è in background ---
  let lastAlarm = 0;
  const _rRender = rRender;
  rRender = function(){
    _rRender.apply(this, arguments);
    try{
      const want = (R && R.screen === "rest" && R.restEnd && R.restEnd > Date.now()) ? R.restEnd : 0;
      if(want !== lastAlarm){
        if(want) A.scheduleAlarm(String(want), "Recupero finito", "Torna all'app per la prossima serie");
        else A.cancelAlarm();
        lastAlarm = want;
      }
    }catch(e){}
  };
  const _open = openRunner, _close = closeRunner;
  openRunner = function(){ try{ A.keepScreenOn(true); }catch(e){} return _open.apply(this, arguments); };
  closeRunner = function(){ try{ A.keepScreenOn(false); A.cancelAlarm(); }catch(e){} lastAlarm = 0; return _close.apply(this, arguments); };
  window.onAndroidResume = function(){ try{ if(R && !$("#runner").hidden) rRender(); }catch(e){} };

  // --- tasto Indietro ---
  window.androidBack = function(){
    const sh = $("#sheet");
    if(sh && !sh.hidden){ closeSheet(); return true; }
    const rr = document.getElementById("runr");
    if(rr && !rr.hidden){ act("runExit", {}, null); return true; }
    const rn = $("#runner");
    if(rn && !rn.hidden){ act("exitRunner", {}, null); return true; }
    if(view === "impostazioni"){ view = setPrev || "oggi"; render(); window.scrollTo(0,0); return true; }
    if(view === "piano" && planOpen){ planOpen = null; render(); window.scrollTo(0,0); return true; }
    if(view !== "oggi"){ view = "oggi"; planOpen = null; weekDraft = null; render(); window.scrollTo(0,0); return true; }
    return false;
  };

  // --- aggiornamenti da GitHub ---
  window.onUpdateInfo = function(info){
    U.checking = false; U.info = info;
    U.msg = info.error ? "Controllo non riuscito: sei connesso a internet?" : (info.available ? "" : "Hai già l'ultima versione.");
    render();
  };
  window.onUpdateProgress = function(p){
    if(p === -2) U.msg = "Consenti a TrainUP di installare app, poi torna qui e tocca di nuovo Aggiorna.";
    else if(p === -1) U.msg = "Download non riuscito. Riprova.";
    U.progress = p >= 0 && p < 100 ? p : null;
    if(p === 100) U.msg = "Download completato: conferma l'installazione.";
    render();
  };
  window.onUpdateRejected = function(why){ U.progress = null; U.msg = "Aggiornamento bloccato: " + why + ". Non è stato installato nulla."; render(); };
  window.updateBannerHtml = function(){
    const i = U.info;
    if(!i || !i.available) return "";
    const pr = U.progress;
    return `<div class="card stack upd"><div class="row between"><b>Nuova versione ${esc(i.version)}</b><span class="pill acc">aggiornamento</span></div>
      ${i.notes ? `<p class="small muted" style="white-space:pre-line;margin:0">${esc(i.notes.slice(0, 400))}</p>` : ""}
      ${pr != null ? `<div class="updbar"><i style="width:${pr}%"></i></div><span class="small muted">Download ${pr}%</span>`
        : `<button class="btn primary" data-aact="install">Aggiorna ora</button>`}
      ${U.msg ? `<span class="small muted">${esc(U.msg)}</span>` : ""}</div>`;
  };
  function checkNow(){ U.checking = true; U.msg = ""; render(); A.checkUpdate(); }

  // --- backup dei dati ---
  const LASTB = "ripresa.lastbackup";
  window.onFileSaved = function(ok){ U.bmsg = ok ? "Backup salvato." : "Backup non salvato."; if(ok){ try{ localStorage.setItem(LASTB, String(Date.now())); }catch(e){} } render(); };
  window.onFileOpened = function(text){
    try{
      const o = JSON.parse(text);
      if(!o || o.app !== "ripresa-forza" || !o.data) throw 0;
      localStorage.setItem(LS, JSON.stringify(o.data));
      if(o.draft) localStorage.setItem(DRAFT, JSON.stringify(o.draft)); else localStorage.removeItem(DRAFT);
      if(o.runDraft) localStorage.setItem(RUN_DRAFT, JSON.stringify(o.runDraft)); else localStorage.removeItem(RUN_DRAFT);
      S = load(); S.settings.levelChosen = true; saveLocal(); U.bmsg = "Dati ripristinati dal backup del " + (o.savedAt ? new Date(o.savedAt).toLocaleDateString("it-IT") : "file scelto") + ".";
      const ob = document.getElementById("onb"); if(ob){ ob.remove(); onb = null; }
    }catch(e){ U.bmsg = "Questo file non è un backup di TrainUP."; if(document.getElementById("onb")) alert("Questo file non è un backup di TrainUP."); }
    render();
  };
  function backupObj(){ return {app:"ripresa-forza", v:2, savedAt:new Date().toISOString(), data:S, draft:loadDraft(), runDraft:loadRunDraft()}; }
  function exportBackup(){ A.saveFile(`trainup-backup-${todayStr()}.json`, JSON.stringify(backupObj())); }

  // --- backup automatico in una cartella del telefono: un file al giorno, gli ultimi 5; foto, video e figure in «TrainUP media» ---
  const AUTO_LAST = "ripresa.autob.last", AUTO_DIRTY = "ripresa.autob.dirty", AUTO_KEEP = 5;
  let autoDir = ""; try{ autoDir = A.backupDirName ? A.backupDirName() : ""; }catch(e){}
  let autoTimer = null;
  const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } }, lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
  function autoBackupNow(){ clearTimeout(autoTimer); if(!autoDir || !A.autoBackup) return; U.amsg = ""; A.autoBackup(todayStr(), JSON.stringify(backupObj()), AUTO_KEEP); }
  window.onAutoBackup = function(err){ if(!err){ lsSet(AUTO_LAST, String(Date.now())); lsSet(AUTO_DIRTY, "0"); U.amsg = ""; } else U.amsg = "Backup automatico non riuscito: " + err + "."; if(document.getElementById("appDati")) render(); };
  window.onFigureImported = function(n){
    if(n == null) return;
    FIGS = null;
    U.fmsg = n === -1 ? "Questo file non è un pacchetto di figure di TrainUP." : n === -2 ? "Figure recuperate da «TrainUP media»." : "Figure importate: " + n + " esercizi.";
    render();
  };
  window.onMirror = function(err){ const m = err ? "Copia di foto e video non riuscita: " + err + "." : ""; if(m !== (U.mmsg || "")){ U.mmsg = m; if(document.getElementById("appDati")) render(); } };
  window.onBackupDir = function(name){ if(name != null){ autoDir = name || "cartella scelta"; autoBackupNow(); } render(); };
  const _save = saveLocal;
  saveLocal = function(){ _save.apply(this, arguments); if(!autoDir) return; lsSet(AUTO_DIRTY, "1"); clearTimeout(autoTimer); autoTimer = setTimeout(autoBackupNow, 30000); };
  const _resume = window.onAndroidResume;
  window.onAndroidResume = function(){ if(_resume) _resume.apply(this, arguments); if(autoDir && lsGet(AUTO_DIRTY) === "1") autoBackupNow(); };
  if(autoDir && lsGet(AUTO_DIRTY) === "1") setTimeout(autoBackupNow, 5000);
  if(autoDir && A.mirrorNow) setTimeout(() => A.mirrorNow(), 8000);

  // --- "App e dati" nelle Impostazioni ---
  const _imp = renderImpostazioni;
  renderImpostazioni = function(){
    const h = _imp.apply(this, arguments);
    const i = U.info, ver = A.version();
    let last = 0; try{ last = Number(localStorage.getItem(LASTB) || 0); }catch(e){}
    const days = last ? Math.floor((Date.now() - last) / 864e5) : null;
    const autoLast = Number(lsGet(AUTO_LAST) || 0);
    const nFig = Object.keys((figs().ex) || {}).length;
    const when = t => { const d = new Date(t), today = new Date(); const dd = Math.round((new Date(today.toDateString()) - new Date(d.toDateString())) / 864e5); const hm = d.toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"}); return dd === 0 ? "oggi " + hm : dd === 1 ? "ieri " + hm : d.toLocaleDateString("it-IT", {day:"numeric", month:"short"}); };
    const sec = `<div class="o-sec" id="appDati"><div class="o-label">App e dati</div>
      <div class="o-list" style="margin-top:4px"><div class="o-row" style="cursor:default"><span class="n">Versione installata</span><span class="p"><b style="color:var(--ink)">${esc(ver)}</b></span></div>
      ${i && i.available ? `<div class="o-row" style="cursor:default"><span class="n">Disponibile</span><span class="p"><b style="color:var(--ink)">${esc(i.version)}</b></span></div>` : ""}</div>
      <button class="btn" data-aact="${i && i.available ? "install" : "check"}" ${U.checking ? "disabled" : ""} style="margin-top:8px">${U.checking ? "Controllo…" : i && i.available ? "Aggiorna ora" : "Cerca aggiornamenti"}</button>
      ${U.progress != null ? `<div class="updbar" style="margin-top:8px"><i style="width:${U.progress}%"></i></div>` : ""}
      ${U.msg ? `<p class="small muted" style="margin-top:6px">${esc(U.msg)}</p>` : ""}
      <div class="o-label" style="margin-top:18px">Backup</div>
      <div class="o-list" style="margin-top:4px">
        <button class="o-row" data-aact="autoDir"><span class="n">Automatico<small>${autoDir ? esc(autoDir) + " · ultimi " + AUTO_KEEP : "Scegli una cartella del telefono"}</small></span><span class="p">${autoDir ? (autoLast ? esc(when(autoLast)) : "attivo") : "spento"} ›</span></button>
        <button class="o-row" data-aact="export"><span class="n">Manuale<small>Un file dove vuoi tu (Download, Drive)</small></span><span class="p">${last ? esc(when(last)) : "mai"} ›</span></button>
      </div>
      <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px">${autoDir ? `<button class="btn sm" data-aact="autoNow">Salva ora</button>` : ""}<button class="btn sm ${autoDir ? "ghost" : ""}" data-aact="import">Ripristina</button>${autoDir ? `<button class="btn sm ghost" data-aact="autoOff" style="color:var(--danger)">Disattiva</button>` : ""}</div>
      ${U.amsg || U.mmsg || U.bmsg ? `<p class="small" style="margin-top:6px;color:${U.amsg || U.mmsg ? "var(--warn)" : "var(--muted)"}">${esc(U.amsg || U.mmsg || U.bmsg)}</p>` : ""}
      <p class="tiny muted" style="margin-top:6px">${autoDir ? `Foto, video e figure copiati anche in «TrainUP media».` : "Foto e video si copiano solo con il backup automatico."}</p>
      <div class="o-label" style="margin-top:18px">Figure dei manuali</div>
      <div class="o-list" style="margin-top:4px">
        <button class="o-row" data-aact="figImport"><span class="n">${nFig ? "Importate" : "Importa il pacchetto"}<small>${nFig ? nFig + " esercizi" : "File .zip con le figure dei tuoi libri"}</small></span><span class="p">${nFig ? "sostituisci" : ""} ›</span></button>
      </div>
      ${nFig ? `<div class="row" style="margin-top:10px"><button class="btn sm ghost" data-aact="figClear" style="color:var(--danger)">Togli le figure</button></div>` : ""}
      ${U.fmsg ? `<p class="small muted" style="margin-top:6px">${esc(U.fmsg)}</p>` : ""}
    </div>`;
    const k = h.indexOf('<div class="o-sec" id="appDati">');
    return k >= 0 ? h.slice(0, k) + sec : h + sec;
  };
  // pulsante di ripristino nella prima schermata dopo l'installazione
  const _onb = onbHtml;
  onbHtml = function(){
    const h = _onb.apply(this, arguments);
    if(!onb || onb.step !== 0) return h;
    return h.replace('</label>', `</label><div class="hint small" style="margin-top:4px"><b>Hai reinstallato l'app?</b> Se hai un file di backup, ripristinalo: ritrovi programma, allenamenti e misure.<br><button class="btn sm" data-aact="importOnb" style="margin-top:8px">Ripristina un backup</button></div>`);
  };
  if(onb) onbRender();

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-aact]"); if(!b) return;
    const a = b.dataset.aact;
    if(a === "check") checkNow();
    else if(a === "install" && U.info && U.info.url){ U.msg = ""; U.progress = 0; render(); A.installUpdate(U.info.url); }
    else if(a === "export") exportBackup();
    else if(a === "import"){ if(confirm("Ripristinare il backup? I dati attuali verranno sostituiti.")) A.openFile(); }
    else if(a === "importOnb") A.openFile();
    else if(a === "autoDir") A.chooseBackupDir();
    else if(a === "figImport"){ U.fmsg = ""; A.figureImport(); }
    else if(a === "figClear"){ if(confirm("Togliere le figure dei manuali dall'app? Puoi reimportarle quando vuoi.")){ A.figureClear(); FIGS = null; U.fmsg = ""; render(); } }
    else if(a === "autoNow") autoBackupNow();
    else if(a === "autoOff"){ if(confirm("Disattivare il backup automatico? I file già salvati restano nella cartella.")){ A.clearBackupDir(); autoDir = ""; render(); } }
  });

  const st = document.createElement("style");
  st.textContent = `.updbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.updbar i{display:block;height:100%;background:var(--accent);transition:width .2s}.upd{border:1.5px solid var(--accent)}`;
  document.head.appendChild(st);

  render();
  // controllo automatico all'avvio (al massimo una volta ogni 6 ore)
  try{
    const last = Number(localStorage.getItem("ripresa.updcheck") || 0);
    if(Date.now() - last > 6*3600e3){ localStorage.setItem("ripresa.updcheck", String(Date.now())); A.checkUpdate(); }
  }catch(e){ A.checkUpdate(); }
})();

</script>


</body>
</html>
