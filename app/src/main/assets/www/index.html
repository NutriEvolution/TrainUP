<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
@font-face{font-family:"Karla";src:url("fonts/karla-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Karla";src:url("fonts/karla-latin-500-normal.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Karla";src:url("fonts/karla-latin-600-normal.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Karla";src:url("fonts/karla-latin-700-normal.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Fraunces";src:url("fonts/fraunces-latin-500-normal.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Fraunces";src:url("fonts/fraunces-latin-600-normal.woff2") format("woff2");font-weight:600;font-display:swap}
</style>
<title>TrainUP</title>
<style>
/* Layout: una colonna (max 600px), titolo grande per sezione, schede raggruppate, barra delle sezioni sospesa con effetto vetro */
:root{
  /* Palette di NutriEvolution (verde teal, avorio); modalità scura blu notte */
  --bg:#FAFAF8; --surface:#FFFFFF; --surface2:#F1EFE8; --surface3:#DEDCD2; --ink:#26251F; --ink2:#5F5E56; --muted:#6F6D63; --line:#E6E3DA;
  --accent:#0F6E56; --accent-ink:#ffffff; --accent-soft:#E1F5EE; --accent-text:#085041; --accent-mint:#5DCAA5;
  --post:#B0651E; --post-soft:#FAEEDA;
  --warn:#9a6510; --warn-soft:#FAEEDA; --danger:#B5433B;
  --g-legs:#0F6E56; --g-chest:#C2574B; --g-back:#2F8FA3; --g-shoulders:#7A6BC4; --g-arms:#E8A33D; --g-core:#8B7A5E; --g-post:#B0651E;
  --c1:#0F6E56; --c2:#5DCAA5; --c3:#E8A33D; --c4:#2F8FA3;
  --glass:rgba(250,250,248,.82); --glass-line:rgba(38,37,31,.06);
  --font:"Karla",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"Karla",ui-monospace,monospace;
  --r:20px; --r-sm:14px;
  --shadow:0 1px 2px rgba(38,37,31,.05),0 6px 20px rgba(38,37,31,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#172033; --surface:#1D2840; --surface2:#223049; --surface3:#2F3D5A; --ink:#EEF2F9; --ink2:#BFC9DA; --muted:#A3AEC3; --line:#2F3D5A;
  --accent:#2E9C7C; --accent-ink:#ffffff; --accent-soft:#1B3B3D; --accent-text:#9FDCC4; --accent-mint:#8FE0C2;
  --post:#F0B27A; --post-soft:#3A2F1C; --warn:#F0C987; --warn-soft:#3A2F1C; --danger:#F08C82;
  --g-legs:#3FB58F; --g-chest:#F2A9A3; --g-back:#62B0C0; --g-shoulders:#B3A8F0; --g-arms:#F0C987; --g-core:#C8B89A; --g-post:#F0B27A;
  --c1:#3FB58F; --c2:#8FE0C2; --c3:#F0B860; --c4:#62B0C0;
  --glass:rgba(23,32,51,.82); --glass-line:rgba(255,255,255,.06); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.2); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#172033; --surface:#1D2840; --surface2:#223049; --surface3:#2F3D5A; --ink:#EEF2F9; --ink2:#BFC9DA; --muted:#A3AEC3; --line:#2F3D5A;
  --accent:#2E9C7C; --accent-ink:#ffffff; --accent-soft:#1B3B3D; --accent-text:#9FDCC4; --accent-mint:#8FE0C2;
  --post:#F0B27A; --post-soft:#3A2F1C; --warn:#F0C987; --warn-soft:#3A2F1C; --danger:#F08C82;
  --g-legs:#3FB58F; --g-chest:#F2A9A3; --g-back:#62B0C0; --g-shoulders:#B3A8F0; --g-arms:#F0C987; --g-core:#C8B89A; --g-post:#F0B27A;
  --c1:#3FB58F; --c2:#8FE0C2; --c3:#F0B860; --c4:#62B0C0;
  --glass:rgba(23,32,51,.82); --glass-line:rgba(255,255,255,.06); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.2); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px;letter-spacing:-.015em}
p{margin:0}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:14.5px} .tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:-.005em}
/* barra superiore e titolo grande */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--glass-line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--ink2)}
.brand svg{width:22px;height:22px;color:var(--accent)}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none} .dot.ok{background:#22b573} .dot.warn{background:var(--warn)}
.ltitle{font-size:32px;letter-spacing:-.02em;padding-block:14px 14px}
/* superfici */
.card{background:var(--surface);border:0;border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.hero{padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.stack-sm>.pill,.stack>.pill{align-self:flex-start}
.pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.post{background:var(--post-soft);color:var(--post)}
.gdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
/* pulsanti */
.btn{appearance:none;border:0;background:var(--surface2);border-radius:var(--r-sm);padding:12px 18px;font-weight:600;font-size:15.5px;cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.post{background:var(--post-soft);color:var(--post)}
.btn.big{width:100%;font-size:17px;min-height:56px;border-radius:18px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:12px}
.btn.icon{width:40px;min-height:40px;padding:0;border-radius:50%;background:var(--surface2);color:var(--ink2)}
.btn.icon.ghost{background:var(--surface2);color:var(--ink2)}
.btn.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.exrow:focus-visible,.day:focus-visible,.seg button:focus-visible,.feel:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
/* percorso delle 19 settimane */
.track{display:grid;grid-template-columns:repeat(19,1fr);gap:3px;margin-top:2px}
.track i{height:6px;border-radius:99px;background:var(--surface3);display:block}
.track i.done{background:var(--accent)}
.track i.test{background:color-mix(in srgb,var(--post) 35%,var(--surface3))}
.track i.done.test{background:var(--post)}
.track i.now{background:var(--ink);height:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 15%,transparent)}
.tracklbl{display:grid;grid-template-columns:4fr 1fr 6fr 1fr 6fr 1fr;gap:3px;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:6px}
/* statistiche */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px;min-width:0;box-shadow:var(--shadow)}
.tile b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.meta span{background:var(--surface2);border-radius:99px;padding:4px 10px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
/* elenchi */
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:10px;padding-inline:2px}
.sect h3{font-size:13.5px;font-weight:600;color:var(--muted);letter-spacing:-.005em}
.sect.post h3{color:var(--post)}
.exlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;background:var(--surface2);border-radius:16px;overflow:hidden}
.card .exlist{background:color-mix(in srgb,var(--surface2) 60%,var(--surface))}
.exrow{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;background:none;border:0;width:100%;text-align:left;position:relative}
.exlist li+li .exrow::before{content:"";position:absolute;top:0;left:36px;right:0;height:1px;background:var(--line)}
.exrow:active{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.exrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.exrow .n{font-weight:600;font-size:15.5px;letter-spacing:-.012em}
.exrow .p{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.exrow .chev{color:var(--surface3);flex:none}
.pairtag{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:6px;padding:1px 6px;margin-right:6px}
/* interruttori */
.switch{display:flex;gap:14px;align-items:flex-start;cursor:pointer;padding:12px 0;justify-content:space-between;flex-direction:row-reverse}
.switch>span{flex:1}
.switch input{appearance:none;width:51px;height:31px;border-radius:99px;background:var(--surface3);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.3,.7,.4,1);box-shadow:0 2px 4px rgba(0,0,0,.18)}
.switch input:checked{background:#22b573}
.switch input:checked::after{transform:translateX(20px)}
/* barra delle sezioni sospesa */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border:1px solid var(--glass-line);border-radius:26px;display:flex;justify-content:space-around;padding:6px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.nav button{flex:1;background:none;border:0;padding:7px 2px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:20px;transition:background .2s,color .2s}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nav svg{width:22px;height:22px}
/* segmenti */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--muted)}
.seg4 button{padding:8px 2px;font-size:13.5px;white-space:nowrap}
.wk-grid{display:grid;grid-template-columns:50px repeat(7,minmax(0,1fr));gap:5px 4px;align-items:center;margin-top:14px}
.wk-h{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.wk-h.today{color:var(--accent-text)}
.wk-n{font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:5px;min-width:0}
.wk-n i{width:8px;height:8px;border-radius:3px;flex:none}
.wk-t{width:100%;max-width:42px;aspect-ratio:1;justify-self:center;border-radius:11px;border:1.5px dashed var(--line);background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.wk-t svg{width:18px;height:18px}
.vb-big svg{width:44px;height:44px}
.wk-t.on{border:0;background:var(--c);color:#fff}
.wk-t.gym.on{color:var(--accent-ink)}
.wk-det{margin-top:12px}.wk-det summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px;list-style:none}
.wk-det summary::-webkit-details-marker{display:none}.wk-det summary:after{content:"›";margin-left:auto;color:var(--muted);transition:transform .2s}.wk-det[open] summary:after{transform:rotate(90deg)}
.wk-dot{width:8px;height:8px;border-radius:50%;background:var(--c2);flex:none}.wk-dot.warn{background:var(--warn)}
.wk-warns{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:9px}
.wk-warns li{font-size:13px;line-height:1.45;color:var(--ink2);padding-left:16px;position:relative}
.wk-warns li:before{content:"";position:absolute;left:1px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--c2)}
.wk-warns li.warn:before{background:var(--warn)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;text-align:center;color:var(--muted);font-weight:600;padding:2px 0}
.day{aspect-ratio:1/1;border-radius:50%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;font-variant-numeric:tabular-nums;padding:0;min-width:0;position:relative}
.day .n{font-size:15.5px;font-weight:500}
.day .lbl{font-size:10px;font-weight:700;min-height:12px;line-height:1.1;color:var(--muted)}
.day.out{opacity:.3}
.day.today .n{color:var(--accent);font-weight:700}
.day.planned{background:var(--accent-soft)}
.day.planned .lbl{color:var(--accent)}
.day.done{background:var(--accent);color:var(--accent-ink)}
.day.done .lbl{color:var(--accent-ink);opacity:.85}
.day.missed{background:transparent;box-shadow:inset 0 0 0 1.5px var(--surface3)}
.day.posture::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--post)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
/* pannelli */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:28px 28px 0 0;padding:6px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));max-height:90%;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.grab{width:36px;height:5px;border-radius:99px;background:var(--surface3);margin:6px auto 14px}
/* sessione */
.runner{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.runner .wrap{padding-bottom:28px;padding-top:6px}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 10px}
.prog{height:4px;background:var(--surface3);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s cubic-bezier(.3,.7,.4,1)}
.bignum{font-family:var(--serif);font-weight:600;font-size:76px;letter-spacing:-.03em;line-height:.95;font-variant-numeric:tabular-nums}
.target{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.setdots{display:flex;gap:5px;flex-wrap:wrap}
.setdots i{width:22px;height:6px;border-radius:99px;background:var(--surface3);display:block}
.setdots i.d{background:var(--accent)} .setdots i.c{background:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.stepper{display:flex;align-items:stretch;border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.stepper button{width:54px;border:0;background:transparent;font-size:24px;font-weight:500;cursor:pointer;color:var(--accent)}
.stepper input{flex:1;min-width:0;border:0;text-align:center;font-size:28px;font-weight:700;letter-spacing:-.03em;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;padding:10px 0;font-family:var(--font)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--surface2);border-radius:99px;padding:8px 14px;font-weight:600;cursor:pointer;min-width:46px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.feelgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.feelgrid.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.feel{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:72px;justify-content:center;transition:transform .12s}
.feel b{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.feel span{font-size:12px;color:var(--muted);text-align:center}
.feel.ok{background:var(--accent);color:var(--accent-ink)}
.feel.ok span{color:var(--accent-ink);opacity:.85}
.feel:active{transform:scale(.96)}
.done-sets{display:flex;gap:6px;flex-wrap:wrap}
.done-sets span{font-size:13px;background:var(--surface2);border-radius:99px;padding:5px 10px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.ring{width:min(50vw,184px);aspect-ratio:1/1;margin:10px auto 6px;position:relative}
.ring .bignum{font-size:46px;letter-spacing:-.04em}
.ring .t .small{font-size:12.5px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hint{border-radius:16px;padding:12px 14px;background:var(--accent-soft);font-size:15px;color:var(--ink)}
.hint b{font-variant-numeric:tabular-nums}
.hint.warn{background:var(--warn-soft)}
.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.how li::marker{color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:none}
.set-table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.set-table td,.set-table th{padding:9px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.set-table tr:first-child td,.set-table thead+tbody tr:first-child td{border-top:0}
.set-table th{font-size:12.5px;color:var(--muted);font-weight:600;border-top:0}
