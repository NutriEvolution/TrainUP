  squat:{n:"Squat con bilanciere", step:2.5, inc:5, unit:"bilanciere", yt:"squat bilanciere tecnica corretta", src:"PE2 pp. 278-282",
    how:["Bilanciere appena sotto la 7ª vertebra cervicale (non sul collo), presa stretta, gomiti sotto i polsi, scapole strette.","Piedi alla larghezza delle spalle o poco più, punte in fuori.","Inspira e trattieni il fiato, spingi il bacino indietro e scendi poco sotto il parallelo (angolo tra coscia e tibia sotto i 90°).","Ginocchia sempre in linea con le punte; risali senza rimbalzo, sguardo a terra 2-3 metri davanti.","Con la lordosi lombare ridotta scendi solo finché la zona lombare resta neutra, anche se è sopra il parallelo."],
    err:["Busto che si inclina troppo in avanti.","Ginocchia che cedono verso l'interno (valgo).","Rimbalzo in fondo al movimento."]},
  splitSquat:{n:"Split squat con manubri", step:2, inc:2, unit:"manubri (peso di uno)", side:"per gamba", yt:"split squat manubri tecnica", src:"PE2 pp. 283-284",
    how:["Una gamba avanti e una indietro, con un passo più lungo del normale.","Busto eretto, scendi in verticale finché il ginocchio dietro sfiora il pavimento.","La tibia della gamba avanti resta verticale; spingi con quella gamba per risalire.","Finite le ripetizioni, cambia gamba. Se serve, la prima settimana fallo senza pesi."],
    err:["Buttarsi in avanti sollevando il tallone.","Ginocchio avanti che cede verso l'interno."]},
  splitSquatCorpo:{n:"Split squat a corpo libero", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"split squat corpo libero tecnica", src:"PE2 pp. 283-284 (senza pesi)", bw:true,
    how:["Una gamba avanti e una indietro, con un passo più lungo del normale.","Busto eretto, scendi in verticale finché il ginocchio dietro sfiora il pavimento.","La tibia della gamba avanti resta verticale; spingi con quella gamba per risalire.","Finite le ripetizioni, cambia gamba."],
    err:["Buttarsi in avanti sollevando il tallone.","Ginocchio avanti che cede verso l'interno."]},
  affondiCorpo:{n:"Affondi camminati a corpo libero", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"affondi camminati corpo libero tecnica", src:"PE2 pp. 285-286 (senza pesi)", bw:true,
    how:["Cammina in avanti con passi più lunghi del normale.","A ogni passo scendi finché il ginocchio dietro sfiora il pavimento, busto eretto.","Spingi con la gamba avanti e fai subito il passo successivo, senza unire i piedi."],
    err:["Ginocchio che cade verso l'interno (guardati anche di fronte).","Busto che si piega in avanti."]},
  affondiCamminati:{n:"Affondi camminati con manubri", step:2, inc:2, unit:"manubri (peso di uno)", side:"per gamba", yt:"affondi camminati manubri tecnica", src:"PE2 pp. 285-286",
    how:["Cammina in avanti con passi più lunghi del normale.","A ogni passo scendi finché il ginocchio dietro sfiora il pavimento, busto eretto.","Spingi con la gamba avanti e fai subito il passo successivo, senza unire i piedi."],
    err:["Ginocchio che cade verso l'interno (guardati anche di fronte).","Spalle in avanti: tieni i manubri vicino ai fianchi."]},
  pancaManubri:{n:"Panca piana con manubri", step:2, inc:2, unit:"manubri (peso di uno)", yt:"panca piana manubri tecnica", src:"PE1 pp. 221-226",
    how:["Scapole strette e abbassate per tutta la serie, piedi a terra, glutei sulla panca.","Braccia a 45-60° dal busto (gomiti bassi, non all'altezza delle spalle).","Spingi finché i manubri arrivano sopra il collo senza perdere la posizione delle scapole."],
    err:["Gomiti alti e aperti.","Glutei che si staccano dalla panca."]},
  panca:{n:"Panca piana con bilanciere", step:2.5, inc:2.5, unit:"bilanciere", yt:"panca piana bilanciere tecnica", src:"PE1 pp. 221-224",
    how:["Scapole strette e abbassate, piedi a terra, glutei sulla panca.","Presa completa con il pollice che avvolge il bilanciere; larghezza tale da avere i gomiti sotto i polsi.","Il bilanciere scende sulla linea dei capezzoli, tocca il petto e risale fino a gomiti distesi.","Ogni tanto inserisci ripetizioni con un attimo di fermo al petto.","Se la testa tende ad andare in avanti o indietro, metti un asciugamano piegato sotto la nuca (Fitness posturale, cap. 4)."],
    err:["Rimbalzo sul petto.","Presa senza pollice.","Glutei che si sollevano."]},
  pancaInclinataManubri:{n:"Panca inclinata con manubri", step:2, inc:2, unit:"manubri (peso di uno)", yt:"panca inclinata manubri tecnica", src:"PE1 pp. 224-226",
    how:["Come la panca piana con manubri: scapole strette, piedi a terra, gomiti a 45-60°.","PE1 nota che l'inclinazione conta poco: serve soprattutto a variare lo stimolo."],
    err:["Gomiti alti.","Inarcarsi per spingere di più."]},
  pancaStretta:{n:"Panca stretta", step:2.5, inc:2.5, unit:"bilanciere", yt:"panca presa stretta tricipiti tecnica", src:"PE1 p. 222",
    how:["Come la panca piana, con le mani alla larghezza delle spalle o poco meno.","Gomiti vicini al busto durante la discesa.","Tocca il petto nella parte bassa e distendi le braccia."],
    err:["Presa troppo stretta che sforza i polsi.","Gomiti che si aprono."]},
  chestPress:{n:"Chest press", step:2.5, inc:2.5, unit:"macchina", yt:"chest press macchina tecnica", src:"PE1 pp. 229-230",
    how:["Regola il sedile in modo che le maniglie siano all'altezza dei capezzoli.","Scapole strette, gomiti più bassi delle spalle, avambracci perpendicolari al petto.","Mento leggermente abbassato: Fitness posturale segnala che a chest press e pulley la testa tende ad andare in avanti."],
    err:["Sedile troppo alto o troppo basso.","Gomiti alti."]},
  piegamenti:{n:"Piegamenti sulle braccia", step:0, inc:0, unit:"corpo libero", yt:"piegamenti braccia tecnica corretta", src:"PE1 pp. 232-234; Neri, Project Calisthenics, pp. 92-94; Low, Overcoming Gravity, cap. 26 (Standard Pushups, livello 1)", bw:true,
    how:["Mani poco più larghe delle spalle, un po' ruotate in fuori; spalle sopra le mani. In basso gli avambracci sono verticali e i gomiti restano vicini al busto (non a 90°).","Addome attivo: bacino, busto e spalle si muovono come un blocco unico, bacino all'altezza delle spalle.","Parti a braccia tese e scendi finché il petto tocca terra. Fermarsi un secondo in basso e in alto rende tutte le ripetizioni uguali e i progressi confrontabili."],
    err:["Bacino che scende prima delle spalle.","Gomiti larghi.","Rimbalzare con il petto o fermarsi prima di toccare."]},
  crociCavi:{n:"Croci ai cavi", step:2.5, inc:2.5, unit:"cavi", yt:"croci ai cavi tecnica", src:"PE1 pp. 226-227",
    how:["Fai un passo avanti rispetto ai cavi, braccia aperte a circa 60° con i gomiti leggermente piegati.","Porta le mani davanti fino a gomiti distesi, scapole sempre strette."],
    err:["Piegare molto i gomiti trasformandolo in una spinta."]},
  military:{n:"Military press con bilanciere (in piedi)", step:2.5, inc:2.5, unit:"bilanciere", yt:"military press bilanciere tecnica", src:"PE1 pp. 143-146",
    how:["In piedi, presa poco più larga delle spalle, gomiti sotto i polsi, bilanciere appoggiato al petto.","Spingi in linea retta fin sopra la testa a gomiti distesi; a ogni ripetizione il bilanciere torna a toccare il petto.","Lascia che le scapole salgano e ruotino: non tenerle bloccate in basso."],
    err:["Lento dietro la testa (sconsigliato).","Inarcare molto la zona lombare."]},
  lentoManubri:{n:"Lento avanti con manubri", step:2, inc:2, unit:"manubri (peso di uno)", yt:"lento avanti manubri tecnica", src:"PE1 pp. 143-146",
    how:["Meglio in piedi; se lo fai da seduto, porta le gambe indietro per mantenere la curva lombare.","Gomiti sotto i polsi, palmi uno verso l'altro, braccia circa 30° in avanti (piano scapolare).","Spingi fin sopra la testa a gomiti distesi e torna giù completamente."],
    err:["Partire con le braccia aperte a 90° di lato.","Schiena schiacciata e arrotondata contro lo schienale."]},
  shoulderPress:{n:"Shoulder press (macchina)", step:2.5, inc:2.5, unit:"macchina", yt:"shoulder press macchina tecnica", src:"PE1 p. 145",
    how:["Se la macchina lo permette: braccia circa 30° in avanti, parti da gomiti bassi e arriva a gomiti distesi sopra la testa."],
    err:["Escursione ridotta."]},
  alzateLaterali:{n:"Alzate laterali con manubri", step:1, inc:1, unit:"manubri (peso di uno)", yt:"alzate laterali manubri tecnica corretta", src:"PE1 pp. 147-150",
    how:["Parti con le braccia lungo i fianchi, gomiti appena piegati, busto fermo.","Solleva le braccia circa 30° in avanti rispetto al fianco, con i pollici leggermente verso l'alto.","Fermati intorno ai 90° (braccia parallele al pavimento)."],
    err:["Rotazione interna, \"svuota la brocca\": sconsigliata per la spalla.","Slanci con il busto."]},
  facePull:{n:"Face pull ai cavi", step:2.5, inc:2.5, unit:"cavi", yt:"face pull cavi tecnica", src:GEN,
    how:["Corda al cavo all'altezza del viso, presa con i pollici verso di te.","Tira verso la fronte aprendo i gomiti e stringendo le scapole.","Torna lentamente a braccia distese."],
    err:["Tirare con il busto all'indietro.","Carico troppo pesante: è un esercizio leggero."]},
  latMachine:{n:"Lat machine, presa prona", step:2.5, inc:2.5, unit:"macchina", yt:"lat machine tecnica corretta", src:"PE1 pp. 280-284",
    how:["Presa prona (palmi in avanti) o neutra; il pollice aiuta dall'esterno.","Scapole strette e abbassate; spingi i gomiti verso il basso.","Basta portare la sbarra sotto il mento, sempre davanti alla testa."],
    err:["Buttarsi indietro con il busto (diventa un pulley).","Presa supina e lat dietro la testa: sconsigliate."]},
  trazioni:{n:"Trazioni alla sbarra", step:0, inc:0, unit:"corpo libero", yt:"trazioni sbarra tecnica", src:"PE1 pp. 280-281; Low, Overcoming Gravity, cap. 25 (Bar Pull-ups, livello 3); Neri, Project Calisthenics, pp. 121, 127", bw:true,
    how:["Presa prona o neutra; parti a braccia distese e inizia abbassando le scapole.","Spingi i gomiti verso il basso e vicino ai fianchi finché il mento supera la sbarra, senza allungare il collo; poi scendi controllando fino a braccia tese.","Addominali contratti, niente oscillazioni."],
    err:["Presa supina (sconsigliata).","Piegare le anche per aiutarsi.","Gomiti larghi."]},
  // progressioni a corpo libero: Neri, Project Calisthenics (2018) e Low, Overcoming Gravity 2ª ed. (2016)
  piegamentiFacili:{n:"Piegamenti facilitati", step:0, inc:0, unit:"corpo libero", yt:"piegamenti sulle ginocchia tecnica", src:"Neri, Project Calisthenics, pp. 94-95; Low, Overcoming Gravity, cap. 26 (Standard Pushups)", bw:true,
    how:["Due modi: con le ginocchia a terra, oppure con le mani su un rialzo (muro, tavolo, panchina).","Stessa tecnica dei piegamenti: corpo in linea, addome attivo, petto che arriva a terra o al rialzo, braccia tese in alto.","Con le mani sul rialzo: più il corpo è vicino alla verticale, più è facile. Abbassa il rialzo man mano che diventi più forte."],
    err:["Bacino che si inarca (\"spanciare\").","Accorciare il movimento per fare più ripetizioni."]},
  piegamentiStretti:{n:"Piegamenti stretti", step:0, inc:0, unit:"corpo libero", yt:"piegamenti presa stretta tecnica", src:"Neri, Project Calisthenics, pp. 96-97; Low, Overcoming Gravity, cap. 26 (Diamond Pushups, livello 2)", bw:true,
    how:["Mani a larghezza spalle invece che più larghe.","Gomiti chiusi, in linea con il corpo, per tutta la discesa: lavorano di più i tricipiti.","In basso il petto arriva più o meno all'altezza della bocca dello stomaco; tieni la linea spalle-bacino come nei piegamenti normali."],
    err:["Gomiti che si aprono.","Perdere la linea del corpo in risalita.","Se senti male ai gomiti o alle spalle tra una seduta e l'altra, torna per qualche giorno ai piegamenti normali."]},
  archerPushup:{n:"Archer push up", step:0, inc:0, unit:"corpo libero", side:"per braccio", yt:"archer push up tecnica", src:"Neri, Project Calisthenics, pp. 101-104 e 108", bw:true,
    how:["Mani a larghezza spalle, poi allarga di lato il braccio di supporto fino a circa il doppio della tua larghezza normale, con la mano ruotata in fuori.","Piega solo il braccio che lavora, gomito stretto, e porta il petto verso quella mano.","Il braccio di supporto resta teso per tutta la serie: pensa di spingere con il gomito, non con la mano.","Fai tutte le serie con un braccio, poi con l'altro. All'inizio puoi tenere il braccio di supporto un po' piegato."],
    err:["Piegare il braccio di supporto (aiuta troppo).","Bacino che cede."]},
  pikePushup:{n:"Pike push up", step:0, inc:0, unit:"corpo libero", yt:"pike push up tecnica", src:"Low, Overcoming Gravity, cap. 24 (Pike Headstand Pushup, livello 1)", bw:true,
    how:["Mani e piedi a terra, sedere in alto: il corpo forma una V rovesciata.","Porta sulle mani più peso che puoi senza sbilanciarti.","Piega le braccia con i gomiti stretti, in linea con il corpo, finché la testa tocca terra, poi spingi e torna su."],
    err:["Gomiti aperti di lato: sembra più facile ma toglie stabilità.","Testa che va troppo avanti."]},
  pikeRialzato:{n:"Pike push up con i piedi rialzati", step:0, inc:0, unit:"corpo libero", yt:"elevated pike push up tecnica", src:"Low, Overcoming Gravity, cap. 24 (Box Headstand Pushup, livello 2)", bw:true,
    how:["Come il pike push up, ma con i piedi su una sedia, una scatola o un gradino stabile.","Più è alto il rialzo, più peso va sulle braccia.","Gomiti stretti; la testa scende in linea fino a toccare terra."],
    err:["Testa troppo in fuori: la schiena si inarca.","Scaricare il peso sui piedi per alleggerire le braccia."]},
  hspuNegativo:{n:"Piegamenti in verticale al muro, solo discesa", step:0, inc:0, unit:"corpo libero", yt:"wall handstand push up negative", src:"Low, Overcoming Gravity, cap. 24 (Wall Headstand Pushup Eccentric, livello 3)", bw:true,
    ladP:p => P.range(Math.min(p.sets || 3, 3), 2, 3, "", 120, {note:"discesa 5-10″"}),
    how:["In verticale con la pancia verso il muro (o la schiena, se non sei ancora a tuo agio), corpo dritto, mani vicine al muro.","Scendi lentamente e in modo uniforme, in 5-10 secondi, finché la testa tocca terra.","Poi scendi dalla verticale e ricomincia: si lavora solo la discesa."],
    err:["Inarcare la schiena.","Gomiti che si aprono.","Polsi doloranti: riduci e rinforzali con calma."]},
  trazioniSaltate:{n:"Trazioni saltate", step:0, inc:0, unit:"corpo libero", yt:"jumping pull up tecnica", src:"Low, Overcoming Gravity, cap. 25 (Jumping Pull-ups, livello 1)", bw:true,
    how:["Sbarra bassa o un rialzo sotto i piedi: parti a braccia tese e ginocchia un po' piegate.","Salta il meno possibile: devono lavorare soprattutto le braccia.","Porta le clavicole verso la sbarra senza allungare il collo, gomiti stretti davanti a te; scendi controllando."],
    err:["Saltare forte e lasciare il lavoro alle gambe.","Allungare il collo per superare la sbarra con il mento."]},
  trazioniNegative:{n:"Trazioni negative", step:0, inc:0, unit:"corpo libero", yt:"negative pull up tecnica", src:"Low, Overcoming Gravity, cap. 25 (Bar Pull-up Eccentrics, livello 2) e cap. 10; Neri, Project Calisthenics, p. 138", bw:true,
    ladP:p => P.range(Math.min(p.sets || 3, 3), 2, 3, "", 120, {note:"discesa 6-8″"}),
    how:["Parti in alto, con il mento sopra la sbarra (aiutati con un salto o un rialzo).","Scendi lentamente fino a braccia tese: obiettivo 6-8 secondi, poi 7-10.","Quando fai 3 discese da 10 secondi di fila, di solito riesci a fare almeno una trazione completa."],
    err:["Scendere veloce nell'ultima parte.","Lasciarsi cadere a braccia tese senza controllo."]},
  trazioniLsit:{n:"Trazioni in L-sit", step:0, inc:0, unit:"corpo libero", yt:"l-sit pull up tecnica", src:"Low, Overcoming Gravity, cap. 25 (L-Sit Pull-ups, livello 4); Neri, Project Calisthenics, Trazioni in L-Sit", bw:true,
    how:["Appeso alla sbarra, gambe tese davanti a te all'altezza del bacino.","Le mani restano un po' davanti al corpo: tira fino a portare clavicole o petto alla sbarra.","Le gambe non scendono sotto l'orizzontale per tutta la serie."],
    err:["Lasciar cadere le gambe.","Metterle a fine seduta: con la fatica la cuffia dei rotatori lavora peggio."]},
  rematoreAnelliFacile:{n:"Rematore agli anelli facilitato", step:0, inc:0, unit:"anelli o TRX", yt:"australian pull up principianti", src:"Neri, Project Calisthenics, pp. 122-123; Low, Overcoming Gravity, cap. 25 (Ring Row Eccentrics, livello 1)", bw:true,
    how:["Anelli o TRX all'altezza giusta: più il corpo è vicino alla verticale, più è facile.","Puoi anche tenere le gambe piegate con i piedi a terra per alleggerire.","Tira finché le mani toccano il petto, poi torna giù a braccia tese."],
    err:["Fermarsi a metà: conta la ripetizione con le mani al petto.","Bacino che cede."]},
  rematoreAnelli:{n:"Rematore agli anelli", step:0, inc:0, unit:"anelli o TRX", yt:"ring row tecnica", src:"Low, Overcoming Gravity, cap. 25 (Ring Rows, livello 2); Neri, Project Calisthenics, pp. 122-124", bw:true,
    how:["Corpo dritto, quasi parallelo al pavimento (piedi a terra o su un rialzo), glutei e addome contratti.","Stringi e abbassa le scapole, poi tira gli anelli al petto con i gomiti vicini ai fianchi.","Torna giù a braccia tese. Arrivare a 7-8 ripetizioni complete con il corpo parallelo al terreno aiuta ad arrivare alle prime trazioni."],
    err:["Corpo che si piega a C.","Gomiti larghi."]},
  rematoreAnelliLargo:{n:"Rematore agli anelli a gomiti larghi", step:0, inc:0, unit:"anelli o TRX", yt:"wide ring row", src:"Low, Overcoming Gravity, cap. 25 (Wide Ring Rows, livello 3)", bw:true,
    how:["Come il rematore agli anelli, ma i gomiti si aprono a 60-90° dal busto (60° è più facile).","Le mani si allontanano dal corpo: porta i gomiti in linea con il busto.","Lavora di più la parte posteriore delle spalle."],
    err:["Corpo che si piega a C.","Tirare con slancio."]},
  rematoreArcher:{n:"Rematore archer agli anelli", step:0, inc:0, unit:"anelli o TRX", side:"per braccio", yt:"archer ring row", src:"Low, Overcoming Gravity, cap. 25 (Archer Ring Rows, livello 4)", bw:true,
    how:["Corpo dritto: un braccio tira come nel rematore, l'altro resta teso e si apre di lato a 90°.","Le scapole lavorano allo stesso modo da entrambi i lati.","Scendi controllando e alterna i lati."],
    err:["Corpo che si piega a C.","Piegare il braccio che dovrebbe restare teso."]},
  squatLibero:{n:"Squat a corpo libero", step:0, inc:0, unit:"corpo libero", yt:"squat corpo libero tecnica", src:"Neri, Project Calisthenics, pp. 434-438; Low, Overcoming Gravity, cap. 27 (Parallel e Full Squat, livelli 1-2)", bw:true,
    how:["Piedi alla larghezza delle spalle o poco più, punte un po' in fuori; sguardo verso il battiscopa, addome compatto.","Porta il sedere indietro e in basso; le ginocchia seguono la direzione dei piedi.","Scendi almeno finché l'anca è sotto il ginocchio, petto alto, poi risali."],
    err:["Ginocchia verso l'interno.","Schiena che si arrotonda in basso. Se la caviglia è rigida, aiutati con un rialzo sotto il sedere come riferimento."]},
  archerSquat:{n:"Archer squat", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"archer squat tecnica", src:"Neri, Project Calisthenics, pp. 438-439; Low, Overcoming Gravity, cap. 27 (Side-to-Side Squat, livello 3)", bw:true,
    how:["Gambe molto larghe: sposta il peso su un lato e scendi su quella gamba, l'altra resta tesa.","Il ginocchio che si piega segue sempre la direzione del piede.","Risali e scendi dall'altro lato. È anche un buon allungamento per le anche."],
    err:["Ginocchio verso l'interno, soprattutto se hai avuto problemi ai menischi o ai legamenti.","Talloni che si staccano."]},
  bulgarianCorpo:{n:"Bulgarian squat a corpo libero", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"bulgarian split squat corpo libero", src:"Neri, Project Calisthenics, pp. 440-441", bw:true,
    how:["Piede dietro su una sedia o una panca, l'altro avanti.","Scendi finché il ginocchio dietro sfiora terra, o almeno sotto il parallelo con la gamba avanti.","Prima diventa sicuro con affondi e squat."],
    err:["Ginocchio avanti che cede verso l'interno.","Busto che crolla in avanti."]},
  pistolBoxAssistito:{n:"Pistol squat assistito su un rialzo", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"assisted box pistol squat", src:"Neri, Project Calisthenics, pp. 442-443", bw:true,
    how:["Su una gamba sola, scendi fino a sederti su un rialzo (sedia o scatola) tenendoti con una mano a un appoggio.","La mano serve per l'equilibrio, non per tirarti su: spingi con la gamba.","Scendi sempre alla stessa altezza; quando è facile, abbassa il rialzo."],
    err:["Ginocchio verso l'interno.","Lasciarsi cadere sul rialzo."]},
  pistolAssistito:{n:"Pistol squat assistito", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"assisted pistol squat", src:"Neri, Project Calisthenics, p. 443", bw:true,
    how:["Discesa completa su una gamba, senza rialzo, con una mano su un appoggio (porta, palo).","Aumenta le ripetizioni in accosciata completa.","Quando arrivi a 10, passa al livello successivo."],
    err:["Ginocchio verso l'interno.","Usare la mano per tirarti su."]},
  pistolBox:{n:"Pistol squat su un rialzo", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"box pistol squat", src:"Neri, Project Calisthenics, p. 444", bw:true,
    how:["Senza appoggi, scendi su una gamba fino a un rialzo: ora alleni l'equilibrio.","Abbassa il rialzo man mano, fino a non usarlo più.","Aiutano anche la discesa lenta e il tenere la posizione in basso."],
    err:["Ginocchio verso l'interno.","Sbilanciarsi all'indietro in discesa."]},
  pistol:{n:"Pistol squat", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"pistol squat tecnica", src:"Neri, Project Calisthenics, pp. 441-444; Low, Overcoming Gravity, cap. 27 (Pistols, livello 4)", bw:true,
    how:["In piedi su una gamba, l'altra tesa davanti.","Scendi lentamente portando il ginocchio in avanti sopra la punta, fino a sederti sul polpaccio, muscoli tesi in basso.","Spingi con tutto il piede per risalire."],
    err:["Ginocchio che va verso l'interno: carica i legamenti.","Andare veloci finché la tecnica non è sicura."]},
  pulley:{n:"Pulley basso (rematore al cavo)", step:2.5, inc:2.5, unit:"macchina", yt:"pulley basso tecnica", src:"PE1 pp. 285-286",
    how:["Busto perpendicolare al pavimento con la curva lombare mantenuta.","Parti a braccia distese, porta i gomiti indietro e il triangolo verso la pancia stringendo le scapole.","Se i femorali sono rigidi, piega di più le ginocchia.","Mento leggermente abbassato, la testa non va in avanti mentre tiri."],
    err:["Inclinarsi avanti e indietro a ogni ripetizione."]},
  rowMachine:{n:"Row machine", step:2.5, inc:2.5, unit:"macchina", yt:"row machine tecnica", src:"PE1 p. 285",
    how:["Seduto, sterno appoggiato al supporto, curva lombare mantenuta.","Porta i gomiti indietro stringendo le scapole; a ogni ripetizione distendi completamente le braccia."],
    err:["Staccare il petto dal supporto per tirare."]},
  rematoreManubrio:{n:"Rematore con manubrio su panca", step:2, inc:2, unit:"manubrio", side:"per braccio", yt:"rematore manubrio tecnica", src:"PE1 pp. 288-289",
    how:["Ginocchio e mano dello stesso lato sulla panca, busto parallelo al pavimento.","Spingi il gomito verso l'alto: verso l'anca lavora di più il dorsale, a fianco del busto i romboidi.","Distendi completamente il braccio a ogni ripetizione."],
    err:["Ruotare il busto per sollevare."]},
  rematoreBil:{n:"Rematore con bilanciere", step:2.5, inc:2.5, unit:"bilanciere", yt:"rematore bilanciere tecnica", src:"PE1 pp. 287-288",
    how:["Presa poco più larga delle spalle, busto quasi parallelo al pavimento, schiena neutra con il bacino indietro.","Porta i gomiti in alto stringendo le scapole, poi distendi le braccia.","Se non riesci a tenere la schiena neutra, PE1 consiglia il rematore con manubrio o da prono su panca inclinata."],
    err:["Schiena curva sotto carico: rischio per i dischi lombari."]},
  pulldown:{n:"Pulldown ai cavi (braccia tese)", step:2.5, inc:2.5, unit:"cavi", yt:"pulldown braccia tese cavi", src:"PE1 pp. 289-290",
    how:["In piedi, busto leggermente inclinato in avanti, ginocchia appena piegate, scapole strette.","Porta la sbarra o la corda dalle spalle alle cosce a braccia quasi tese."],
    err:["Piegare i gomiti trasformandolo in una lat machine."]},
  stacco:{n:"Stacco da terra", step:2.5, inc:5, unit:"bilanciere", yt:"stacco da terra tecnica corretta", src:"PE2 pp. 288-290",
    how:["Piedi alla larghezza delle spalle, presa doppia prona poco più larga.","Schiena compatta e fiato trattenuto prima di partire; bilanciere a contatto con le tibie.","Pensa a spingere il pavimento con i piedi, non a tirare con la schiena; sali e scendi controllato.","Arrivi in piedi a ginocchia distese."],
    err:["Salire prima con il bacino e poi con la schiena.","Perdere la curva lombare: è la priorità assoluta."]},
  rdlManubri:{n:"Stacco rumeno con manubri", step:2, inc:2, unit:"manubri (peso di uno)", yt:"stacco rumeno manubri tecnica", src:"PE2 pp. 300-302",
    how:["Ginocchia tese o appena flesse, manubri davanti alle cosce.","Spingi il bacino indietro per tutta la discesa mantenendo la schiena neutra.","Scendi finché riesci a mantenere la curva lombare (idealmente busto quasi parallelo al pavimento), poi risali estendendo l'anca."],
    err:["Arrotondare la zona lombare per scendere di più: se succede, piega di più le ginocchia o scendi meno."]},
  rdl:{n:"Stacco rumeno con bilanciere", step:2.5, inc:5, unit:"bilanciere", yt:"stacco rumeno bilanciere tecnica", src:"PE2 pp. 300-302",
    how:["Come lo stacco rumeno con manubri: bacino indietro, schiena neutra, tibie e braccia verticali.","Scendi finché mantieni la curva lombare."],
    err:["Schiena arrotondata."]},
  pressa:{n:"Pressa", step:5, inc:5, unit:"macchina", yt:"pressa 45 gradi tecnica", src:"PE2 pp. 294-296",
    how:["Punte leggermente in fuori; scendi fino a un attimo prima che l'osso sacro si stacchi dallo schienale.","Spingi con i talloni ben appoggiati.","Distendi le gambe senza bloccare le ginocchia."],
    err:["Staccare il sacro e partire con il bacino ruotato indietro.","Ridurre l'escursione per caricare molto peso."]},
  hackSquat:{n:"Hack squat", step:5, inc:5, unit:"macchina", yt:"hack squat macchina tecnica", src:"PE2 pp. 292-293",
    how:["Spalle e schiena appoggiate, piedi avanti poco più larghi delle spalle, punte leggermente in fuori.","Scendi controllato mantenendo il bacino appoggiato, poi spingi."],
    err:["Bacino che si stacca in fondo."]},
  legCurl:{n:"Leg curl sdraiato", step:2.5, inc:2.5, unit:"macchina", yt:"leg curl prono tecnica", src:"PE2 pp. 303-304",
    how:["Sdraiato a pancia in giù, rotule appena fuori dall'appoggio, cuscinetto sopra i talloni.","Piega le ginocchia fino a 90°, lentamente, senza forzare oltre."],
    err:["Strappi e bacino che si solleva."]},
  legExtension:{n:"Leg extension", step:2.5, inc:2.5, unit:"macchina", yt:"leg extension tecnica", src:"PE2 pp. 299-300",
    how:["Schiena appoggiata, cuscinetti alle caviglie.","Distendi da 90° a circa 10° di flessione, senza arrivare alla gamba completamente tesa (protegge il tendine rotuleo)."],
    err:["Slanci.","Estensione completa."]},
  calf:{n:"Calf in piedi", step:2.5, inc:2.5, unit:"macchina o manubrio", yt:"calf raise in piedi tecnica", src:"PE2 pp. 305-307",
    how:["Ginocchia quasi tese, avampiedi sul rialzo.","Sali sulle punte e scendi lentamente, senza oscillare con il busto."],
    err:["Piedi \"in dentro\" o \"in fuori\": secondo PE2 non servono."]},
  curlEZ:{n:"Curl con bilanciere sagomato (EZ)", step:2.5, inc:2.5, unit:"bilanciere", yt:"curl bilanciere ez tecnica", src:"PE1 pp. 323-324",
    how:["Usa il bilanciere sagomato, più rispettoso di polsi e gomiti.","Dal gomito disteso (non iperesteso) alla massima flessione.","Se oscilli con la schiena, appoggiati con la schiena a un muro."],
    err:["Slanci con la schiena."]},
  curlManubri:{n:"Curl con manubri", step:1, inc:1, unit:"manubri (peso di uno)", yt:"curl manubri tecnica", src:"PE1 pp. 324-326",
    how:["Parti con il palmo verso il corpo e ruotalo verso l'alto a metà salita.","Gomiti fermi, senza portarli in avanti."],
    err:["Inclinare il busto verso il braccio che sale."]},
  curlMartello:{n:"Curl a martello", step:1, inc:1, unit:"manubri (peso di uno)", yt:"curl a martello tecnica", src:"PE1 pp. 324-326",
    how:["Palmi uno verso l'altro per tutto il movimento; il manubrio arriva davanti alla spalla."],
    err:["Gomiti che scappano in avanti."]},
  frenchPress:{n:"French press", step:2.5, inc:2.5, unit:"bilanciere EZ", yt:"french press tecnica", src:"PE1 pp. 342-343, 355-356",
    how:["Sdraiato sulla panca, braccia verticali: l'omero resta flesso a circa 90° per tutto l'esercizio.", "Piega solo i gomiti portando il bilanciere verso la fronte, poi distendi.", "Gomiti fermi, senza allargarli. Con i manubri accompagna l'estensione ruotando i palmi verso i piedi (pronazione)."],
    err:["Gomiti che si allargano.", "Omero che si muove avanti e indietro per aiutarsi."]},
  pushdown:{n:"Pushdown ai cavi con corda", step:2.5, inc:2.5, unit:"cavi", yt:"pushdown corda tricipiti tecnica", src:"PE1 pp. 350-353",
    how:["In piedi, braccia ferme lungo i fianchi.","Parti con il gomito piegato oltre i 90° e arriva a gomiti distesi, ruotando le mani verso l'esterno in fondo."],
    err:["Gomiti che si allargano.","Ginocchia piegate."]},
  deadBug:{n:"Dead bug", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"dead bug esercizio", src:GEN, bw:true,
    how:["Sdraiato a pancia in su, braccia verso il soffitto, anche e ginocchia a 90°.","Distendi lentamente un braccio e la gamba opposta tenendo la zona lombare a contatto con il pavimento.","Torna e alterna."],
    err:["Schiena che si stacca da terra."]},
  pallof:{n:"Pallof press", step:2.5, inc:2.5, unit:"cavo o elastico", side:"per lato", yt:"pallof press", src:GEN,
    how:["Di fianco al cavo, maniglia al petto con due mani.","Distendi le braccia davanti a te senza lasciare che il busto ruoti verso il cavo, poi torna."],
    err:["Busto che ruota."]},
  plank:{n:"Plank", step:0, inc:0, unit:"corpo libero", yt:"plank tecnica", src:"PE2 pp. 129-130; Neri, Project Calisthenics, pp. 409-410; Low, Overcoming Gravity, cap. 27 (plank: 25 s livello 2, 60 s livello 3)", bw:true, goal:60, ladP:p => coreTime(p),
    how:["Avambracci a terra sotto le spalle, corpo in linea: spalle, tronco e bacino allineati.", "Zona lombare piatta (bacino leggermente in retroversione), addominali e glutei contratti, respira normalmente."],
    err:["Schiena che si inarca e bacino che cede verso il basso.", "Bacino troppo alto."]},
  // stretching statico a fine seduta: NSCA, Essentials of Strength Training and Conditioning, 5ª ed. (2026), cap. 15, pp. 383-394 (tecniche) e "Programming Considerations for Stretching"
  strQuad:{n:"Allungamento dei quadricipiti sul fianco", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"side lying quad stretch", src:"NSCA, Essentials 5ª ed., cap. 15, p. 391 (Side Quadriceps Stretch)", bw:true,
    how:["Sdraiato su un fianco con le gambe tese, appoggiato sull'avambraccio.","Piega la gamba che sta sopra e prendi la caviglia con la mano dello stesso lato.","Porta piano il tallone verso il gluteo: senti allungare la parte davanti della coscia e dell'anca."],
    err:["Inarcare la schiena invece di portare indietro la coscia.","Tirare fino al dolore: basta un leggero fastidio."]},
  strAffondo:{n:"Allungamento dei flessori dell'anca in affondo", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"kneeling hip flexor stretch lunge", src:"NSCA, Essentials 5ª ed., cap. 15, p. 388 (Forward Lunge)", bw:true,
    how:["Fai un passo lungo in avanti e piega il ginocchio davanti fino a portarlo sopra il piede, pianta a terra.","Gamba dietro con il ginocchio un po' piegato, punte nella stessa direzione; busto dritto.","Abbassa lentamente il bacino in avanti e in basso: l'allungamento si sente davanti all'anca della gamba dietro."],
    err:["Busto che si piega in avanti.","Ginocchio davanti oltre la punta o verso l'interno."]},
  strFemorali:{n:"Allungamento dei femorali da seduto", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"seated single leg hamstring stretch", src:"NSCA, Essentials 5ª ed., cap. 15, p. 392 (Semistraddle)", bw:true,
    how:["Seduto, una gamba tesa e la pianta dell'altra appoggiata all'interno del ginocchio teso.","Piegati in avanti dalle anche verso la gamba tesa e prendi la punta del piede (o la caviglia, se non ci arrivi).","Porta il petto verso la gamba senza strattoni."],
    err:["Arrotondare tutta la schiena invece di piegarsi dalle anche.","Molleggiare."]},
  strGlutei:{n:"Allungamento dei glutei a figura quattro", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"figure four stretch supine", src:"NSCA, Essentials 5ª ed., cap. 15, p. 389 (Figure Four Stretch)", bw:true,
    how:["Supino, appoggia la caviglia sinistra sopra la coscia destra, ginocchio sinistro aperto verso l'esterno.","Porta la coscia destra verso il petto finché senti un allungamento comodo nel gluteo sinistro.","Tieni, poi cambia lato."],
    err:["Sollevare la testa e le spalle da terra.","Forzare il ginocchio aperto."]},
  strPolpacci:{n:"Allungamento dei polpacci al muro", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"wall calf stretch", src:"NSCA, Essentials 5ª ed., cap. 15, p. 393 (Wall Stretch)", bw:true,
    how:["Mani al muro, una gamba avanti e una indietro.","La gamba dietro resta tesa con il tallone a terra.","Porta il bacino verso il muro finché senti allungare il polpaccio dietro."],
    err:["Sollevare il tallone dietro.","Punta del piede dietro girata verso l'esterno."]},
  strPetto:{n:"Allungamento del petto con le braccia dietro la schiena", step:0, inc:0, unit:"corpo libero", yt:"standing chest stretch hands behind back", src:"NSCA, Essentials 5ª ed., cap. 15, p. 384 (Straight Arms Behind Back)", bw:true,
    how:["In piedi, intreccia le dita dietro la schiena.","Distendi del tutto i gomiti.","Solleva piano le braccia tenendole tese, testa dritta e collo rilassato."],
    err:["Piegarsi in avanti per alzare di più le braccia.","Spalle che salgono verso le orecchie."]},
  strDorsale:{n:"Allungamento del gran dorsale a braccia in alto", step:0, inc:0, unit:"corpo libero", yt:"overhead lat stretch standing", src:"NSCA, Essentials 5ª ed., cap. 15, p. 386 (Arms Straight Up Above Head)", bw:true,
    how:["In piedi, intreccia le dita con i palmi verso l'esterno.","Distendi le braccia sopra la testa, palmi in alto, e continua a spingere verso l'alto.","Mentre spingi, porta le braccia leggermente indietro."],
    err:["Inarcare la zona lombare.","Trattenere il fiato."]},
  strTricipiti:{n:"Allungamento dei tricipiti dietro la testa", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"overhead triceps stretch", src:"NSCA, Essentials 5ª ed., cap. 15, p. 385 (Behind-Neck Stretch)", bw:true,
    how:["Alza un braccio, piega il gomito e porta la mano verso la scapola opposta.","Con l'altra mano prendi il gomito.","Tiralo piano dietro la testa: l'allungamento è nel tricipite e lungo il fianco."],
    err:["Spingere la testa in avanti.","Inarcare la schiena."]},
  plankAvanzato:{n:"Plank con i gomiti avanti", step:0, inc:0, unit:"corpo libero", yt:"long lever plank", src:"Neri, Project Calisthenics, pp. 409-410", bw:true, goal:60, ladP:p => coreTime(p),
    how:["Come il plank, ma con i gomiti più avanti rispetto alle spalle: aumenta la distanza fra gli appoggi e quindi la difficoltà.","Spalle che spingono via il pavimento (protratte e abbassate), bacino in retroversione, addome contratto."],
    err:["Lasciarsi andare sugli appoggi.","Schiena che si inarca."]},
  supermanHold:{n:"Superman hold (long hollow)", step:0, inc:0, unit:"corpo libero", yt:"long hollow hold", src:"Neri, Project Calisthenics, p. 410", bw:true, ladP:p => coreTime(p),
    how:["Una specie di plank con le braccia tese e distese davanti a te, mani a terra.","Più le mani sono vicine e il corpo è alto, più è facile; allontanale e avvicinati al suolo per renderlo più difficile.","Bacino in retroversione per tutta la tenuta."],
    err:["Inarcare la zona lombare.","Spalle che crollano."]},
  barchettaRaccolta:{n:"Barchetta raccolta", step:0, inc:0, unit:"corpo libero", yt:"tuck hollow body hold", src:"Neri, Project Calisthenics, pp. 407-408", bw:true, goal:60, ladP:p => coreTime(p),
    how:["Supino, ginocchia raccolte verso il petto, braccia lungo i fianchi.","Contrai l'addome e solleva spalle e gambe da terra, spalle in avanti e in basso.","La zona lombare resta schiacciata a terra (bacino in retroversione), pancia in dentro."],
    err:["Lombare che si stacca da terra.","Tirare con il collo."]},
  barchetta:{n:"Barchetta (hollow hold)", step:0, inc:0, unit:"corpo libero", yt:"hollow body hold tecnica", src:"Neri, Project Calisthenics, pp. 407-409", bw:true, goal:60, ladP:p => coreTime(p),
    how:["Come la barchetta raccolta, ma con le gambe tese, braccia lungo i fianchi.","Gambe il più vicino possibile al pavimento senza che la lombare si stacchi: se si stacca, alzale un po' di più.","Passaci quando tieni la versione raccolta per un minuto abbondante, fatta bene."],
    err:["Lombare che si inarca.","Spalle appoggiate a terra."]},
  barchettaBraccia:{n:"Barchetta con le braccia dietro la testa", step:0, inc:0, unit:"corpo libero", yt:"hollow body hold arms overhead", src:"Neri, Project Calisthenics, pp. 408-409", bw:true, ladP:p => coreTime(p),
    how:["La barchetta completa con le braccia distese oltre la testa.","Solo se hai buona mobilità delle spalle: altrimenti la versione con le braccia lungo i fianchi allena l'addome altrettanto bene."],
    err:["Spalle troppo alte o lombare che si stacca."]},
  lsitRaccolta:{n:"L-sit raccolta", step:0, inc:0, unit:"corpo libero", yt:"tuck l-sit tecnica", src:"Neri, Project Calisthenics, p. 413; Low, Overcoming Gravity, cap. 25 (Tuck L-Sit, livello 1)", bw:true, goal:30, ladP:p => coreTime(p, true),
    how:["Mani a terra accanto ai fianchi (meglio su due sedie, libri o parallette), braccia tese.","Spingi e solleva il corpo, ginocchia raccolte al petto; spalle in avanti e abbassate, lontane dalle orecchie.","Obiettivo del livello: circa 30 secondi."],
    err:["Spalle che salgono verso le orecchie.","Braccia piegate."]},
  lsitUnaGamba:{n:"L-sit a una gamba", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"one leg l-sit", src:"Neri, Project Calisthenics, p. 413; Low, Overcoming Gravity, cap. 25 (One-Leg-Bent L-Sit, livello 2)", bw:true, goal:30, ladP:p => coreTime(p, true),
    how:["Dalla L-sit raccolta distendi una gamba in avanti, parallela al pavimento.","Una serie per gamba con il recupero in mezzo, non una gamba dopo l'altra senza pausa.","Obiettivo del livello: circa 30 secondi per gamba."],
    err:["Gamba tesa che scende.","Crampi: normali all'inizio; massaggia e riprova da fresco."]},
  lsit:{n:"L-sit", step:0, inc:0, unit:"corpo libero", yt:"l-sit tecnica", src:"Neri, Project Calisthenics, pp. 413-414; Low, Overcoming Gravity, cap. 25 (L-Sit, livello 3)", bw:true, ladP:p => coreTime(p, true),
    how:["In appoggio sulle mani, entrambe le gambe tese e parallele al pavimento.","Spalle protratte e abbassate, braccia tese.","Oltre i 20 secondi puoi aggiungere delle cavigliere. Servono femorali abbastanza flessibili."],
    err:["Gambe che scendono sotto l'orizzontale.","Ginocchia piegate."]},
  legRaiseRaccolte:{n:"Sollevamento delle gambe raccolte alla sbarra", step:0, inc:0, unit:"corpo libero", yt:"hanging knee raise", src:"Neri, Project Calisthenics, pp. 411-412", bw:true,
    how:["Appeso alla sbarra, porta le ginocchia a formare un angolo di 90° con il busto.","Scendi controllando, senza dondolare."],
    err:["Slanciarsi con le gambe.","Spalle completamente rilassate."]},
  legRaiseParallelo:{n:"Sollevamento delle gambe tese al parallelo", step:0, inc:0, unit:"corpo libero", yt:"hanging leg raise to parallel", src:"Neri, Project Calisthenics, p. 412", bw:true,
    how:["Appeso alla sbarra, porta le gambe tese parallele al pavimento (una L-sit alla sbarra), poi scendi.","Se i femorali sono rigidi faticherai a tenerle tese: allungali e intanto rinforza l'addome.","Prima del leg raise completo: circa 30 ripetizioni facili e 20 secondi di L-sit da appeso."],
    err:["Piegare le ginocchia.","Dondolare."]},
  legRaise:{n:"Leg raise alla sbarra", step:0, inc:0, unit:"corpo libero", yt:"hanging leg raise toes to bar", src:"Neri, Project Calisthenics, p. 412", bw:true,
    how:["Da appeso, gambe tese, porta i piedi a toccare la sbarra in un solo movimento.","All'inizio arriva più in alto che puoi: la forza per toccare si costruisce un po' alla volta.","Niente slancio (kipping): toglie forza alla parte iniziale."],
    err:["Usare lo slancio.","Lasciarsi cadere in discesa."]},
  crunch:{n:"Crunch", step:0, inc:0, unit:"corpo libero", yt:"crunch addominali tecnica", src:"PE2 pp. 29-31, 104-108", bw:true,
    how:["Sdraiato, ginocchia piegate, mani incrociate sul petto o alla nuca senza tirare la testa.", "Bacino in leggera retroversione (zona lombare a terra) per tutta la ripetizione.", "Solleva le spalle arrotolando il busto, poi torna giù lentamente."],
    err:["Perdere la retroversione e finire il movimento con le anche.", "Tirare il collo con le mani."]},
  backExt:{n:"Iperestensione su panca a 45°", step:0, inc:0, unit:"corpo libero", yt:"hyperextension panca 45 gradi tecnica", src:"PE2 pp. 300-302 e cap. 2", bw:true,
    how:["Al posto dei crunch: PE2 li sconsiglia a chi ha la lordosi lombare ridotta.","Cuscinetto all'altezza dell'anca, piedi bloccati.","Scendi piegandoti all'anca e risali mantenendo la curva lombare, senza inarcarti oltre la linea del corpo. Mento leggermente abbassato."],
    err:["Arrotondare la schiena in basso.","Iperestendere la zona lombare in alto."]},
  mobQuad:{n:"Mobilizzazione lombare a carponi", step:0, inc:0, unit:"corpo libero", yt:"pelvic tilt quadrupedia mobilizzazione lombare", src:"PE2, Mobilizzare la lordosi lombare", bw:true,
    how:["A carponi, mani sotto le spalle e ginocchia sotto le anche.","Porta il bacino in avanti (il sedere verso l'alto) inarcando solo la zona lombare, poi torna in posizione neutra.","Movimento piccolo e lento: la parte alta della schiena resta ferma."],
    err:["Muovere soprattutto la parte alta della schiena, che compensa facilmente (PE2)."]},
  mobProno:{n:"Mobilizzazione da prono sugli avambracci", step:0, inc:0, unit:"corpo libero", yt:"sphinx pose lombare", src:"PE2, Mobilizzare la lordosi lombare", bw:true,
    how:["A pancia in giù, appoggiato sugli avambracci con i gomiti sotto le spalle.","Lascia che la zona lombare si inarchi dolcemente e mantieni la posizione respirando.","Raggiungi la posizione gradualmente."],
    err:["Sentire dolore: in quel caso riduci l'arco o interrompi."]},
  neckFlex:{n:"Flessori profondi del collo", step:0, inc:0, unit:"corpo libero", yt:"deep neck flexor chin nod esercizio", src:"Fitness posturale, atlante cap. 4, A.1", bw:true,
    how:["Supino con le ginocchia piegate.","Abbassa il mento verso lo sterno come per dire \"sì\": è una flessione della testa sul collo, non uno spingere indietro il collo.","Tieni 5 secondi a ogni ripetizione. Quando è facile, passa a 10 secondi, poi aumenta le ripetizioni."],
    err:["Contrarre i muscoli davanti al collo (sternocleidomastoideo): devono restare rilassati al tatto.","Sollevare la testa da terra."]},
  alzateProno:{n:"Alzate da prono a T (pollici in su)", step:1, inc:1, unit:"manubri (peso di uno)", yt:"prone T raise thumbs up", src:"Fitness posturale, atlante cap. 5, C.1",
    how:["A pancia in giù su una panca, mento abbassato.","Apri le braccia con i pollici verso l'alto, gomiti all'altezza delle spalle, e stringi le scapole.","Senza peso o con manubri molto leggeri."],
    err:["Avvicinare i gomiti al busto.","Alzare il mento."]},
  alzateY:{n:"Alzate da prono a Y", step:1, inc:1, unit:"manubri (peso di uno)", yt:"prone Y raise", src:"Fitness posturale, atlante cap. 5, C.2",
    how:["Stessa posizione, braccia in alto a formare una Y (circa 135°).","Solleva portando le scapole indietro e in basso: l'angolo inferiore della scapola resta attaccato al torace.","Se è difficile: prima mani alla nuca e solleva i gomiti, poi braccia lungo i fianchi, poi la Y."],
    err:["Scapole che salgono verso le orecchie."]},
  wallSlide:{n:"Scivolamenti al muro", step:0, inc:0, unit:"corpo libero", yt:"wall slides esercizio spalle", src:"Fitness posturale, atlante cap. 4, B.3", bw:true,
    how:["Schiena e testa appoggiate al muro, mento abbassato (flessione della testa sul collo).","Braccia appoggiate al muro, gomiti piegati e aperti a lato.","Fai scivolare le braccia verso l'alto senza staccarle dal muro e senza inarcare la schiena, lentamente."],
    err:["Testa che si stacca o va in avanti.","Braccia che si staccano dal muro."]},
  stretchPetto:{n:"Allungamento del piccolo pettorale", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"stretching piccolo pettorale", src:"Fitness posturale, atlante cap. 5, K.2", bw:true,
    how:["Avambraccio appoggiato allo stipite di una porta o a un muro, gomito poco sopra la spalla.","Ruota il busto dalla parte opposta finché senti allungare la parte alta del petto.","Intensità costante, senza dolore."],
    err:["Inarcare la schiena invece di ruotare il busto."]},
  stretchCross:{n:"Allungamento posteriore della spalla", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"cross body shoulder stretch", src:"Fitness posturale, atlante cap. 5, H.2", bw:true,
    how:["Porta un braccio teso davanti al petto e con l'altra mano spingilo verso di te, all'altezza del gomito.","La spalla resta bassa, lontana dall'orecchio."],
    err:["Ruotare il busto per andare più lontano."]},
  stretchNuca:{n:"Allungamento della nuca", step:0, inc:0, unit:"corpo libero", yt:"suboccipital stretch supine", src:"Fitness posturale, atlante cap. 4, D.5", bw:true,
    how:["Supino, abbassa il mento verso lo sterno come nell'esercizio dei flessori profondi e mantieni.","Senti allungare la base del cranio."],
    err:["Sollevare la testa da terra."]},
  allineamentoCerv:{n:"Riconoscimento dell'allineamento del collo", step:0, inc:0, unit:"corpo libero", yt:"correzione postura cervicale seduto", src:"Fitness posturale, atlante cap. 4, C.1", bw:true,
    how:["Seduto, raddrizza la parte alta della schiena e il collo attivando i muscoli profondi, come se volessi \"allungarti\" verso l'alto.","Mantieni 5 secondi e torna dolcemente."],
    err:["Inarcare e estendere la schiena invece di allungarsi."]},
  estensoriCerv:{n:"Estensori profondi del collo a carponi", step:0, inc:0, unit:"corpo libero", yt:"deep cervical extensor quadruped", src:"Fitness posturale, atlante cap. 4, A.2", bw:true,
    how:["A carponi, tronco allineato, collo piegato in avanti in partenza.","Estendi la parte bassa del collo mantenendo il mento vicino al collo: la parte alta non si muove.","Se non controlli il movimento, riduci l'ampiezza e aumentala solo quando migliori."],
    err:["Portare il mento verso l'alto (estensione della parte alta del collo)."]},
  stretchCollo:{n:"Allungamento di scaleni, elevatore della scapola e sternocleidomastoideo", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"stretching scaleni elevatore scapola", src:"Fitness posturale, atlante cap. 4, D.1, D.2, D.4", bw:true,
    how:["Scaleni: abbassa la spalla, inclina la testa dalla parte opposta e porta il collo un po' indietro.","Elevatore della scapola: abbassa la spalla, ruota e inclina la testa dalla parte opposta e piegala in avanti, aiutandoti con una mano.","Sternocleidomastoideo: ruota la testa dallo stesso lato, inclinala dalla parte opposta ed estendi la parte bassa del collo.","Tieni ogni posizione per il tempo indicato, senza dolore."],
    err:["Alzare la spalla dal lato che stai allungando."]},
  ritornoEstensione:{n:"Ritorno corretto dall'estensione del collo", step:0, inc:0, unit:"corpo libero", yt:"cervical flexion extension control exercise", src:"Fitness posturale, atlante cap. 4, C.2", bw:true,
    how:["Seduto, porta la testa indietro, poi torna in posizione neutra lentamente.","Nel ritorno la nuca va avanti e in alto e il mento segue verso il collo, senza spingere la testa in avanti.","Se è difficile, riduci l'ampiezza."],
    err:["Far scivolare la testa in avanti invece di riportarla con il mento."]},
  rotazioneCerv:{n:"Rotazione controllata del collo al muro", step:0, inc:0, unit:"corpo libero", yt:"cervical rotation wall exercise", src:"Fitness posturale, atlante cap. 4, C.3", bw:true,
    how:["Seduto con la schiena al muro, braccia aperte e gomiti piegati appoggiati al muro.","Ruota la testa da un lato e torna lentamente al centro senza portarla in avanti; poi dall'altro lato."],
    err:["Spingere la testa in avanti durante la rotazione."]},
  mobToracica:{n:"Mobilizzazione della schiena in estensione da seduto", step:0, inc:0, unit:"corpo libero", yt:"thoracic extension seated mobility", src:"Fitness posturale, atlante cap. 4, E.4 e D.9", bw:true,
    how:["Seduto con i piedi a terra e le ginocchia più alte delle anche, mani intrecciate dietro il collo e gomiti vicini.","Estendi la parte alta della schiena allungandoti verso l'alto con un'inspirazione profonda; tieni 3 secondi.","Il protocollo aggiunge una rotazione: braccia incrociate sul petto, ruota il collo e poi la schiena dallo stesso lato fino a fine corsa."],
    err:["Ginocchia più basse delle anche: si inarca la zona lombare al posto della schiena alta."]},
  stabRitmiche:{n:"Stabilizzazione del collo in isometria", step:0, inc:0, unit:"corpo libero", yt:"cervical isometric towel exercise", src:"Fitness posturale, atlante cap. 4, A.4", bw:true,
    how:["Seduto in buon allineamento, un asciugamano dietro la testa tenuto per i due capi.","Tira l'asciugamano in avanti e resisti con il collo senza muoverlo; tieni 5 secondi.","In alternativa spingi con il palmo sulla fronte o sulle tempie. La spinta deve essere moderata e crescere piano."],
    err:["Muovere la testa: lo scopo è non farla muovere."]},
  plankPlus:{n:"Plank plus", step:0, inc:0, unit:"corpo libero", yt:"plank plus serratus", src:"Fitness posturale, atlante cap. 5, D.1", bw:true,
    how:["Prono sui gomiti (o in plank).","Allontana il torace dal pavimento spingendo con le scapole, che si aprono restando attaccate al torace; tieni 3 secondi.","Collo allineato, scapole che non salgono verso le orecchie."],
    err:["Scapole che si sollevano dal torace o salgono."]},
  propScapPalla:{n:"Movimento delle scapole con la palla", step:0, inc:0, unit:"palla o muro", side:"per lato", yt:"scapular retraction ball wall", src:"Fitness posturale, atlante cap. 5, L.2", bw:true,
    how:["In piedi, avambraccio appoggiato a una palla contro il muro, busto e spalla piegati in avanti.","Raddrizza busto e spalla facendo rotolare la palla verso di te: la scapola va indietro.","Variante del protocollo per le scapole alate: mano sulla palla a lato e solo la scapola che va indietro, gomito teso."],
    err:["Ruotare il busto invece di muovere la scapola."]},
  stabElastico:{n:"Stabilizzatori delle scapole con elastico", step:0, inc:0, unit:"elastico", yt:"band pull down scapular retraction straight arm", src:"Fitness posturale, atlante cap. 5, C.5", bw:true,
    how:["Seduto o in piedi, elastico fissato davanti a te in alto, braccia in avanti e in alto.","A gomiti tesi porta le braccia in basso e indietro, portando le scapole indietro.","Scegli un elastico con cui arrivi alle ripetizioni con un paio di ripetizioni di margine."],
    err:["Spalle che vanno in avanti durante il movimento.","Piegare i gomiti."]},
  sleeper:{n:"Allungamento della parte posteriore della spalla (sleeper stretch)", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"sleeper stretch", src:"Fitness posturale, atlante cap. 5, H.1", bw:true,
    how:["Sdraiato sul fianco della spalla da allungare, braccio a 90° davanti a te e gomito piegato a 90°.","Con l'altra mano spingi piano l'avambraccio verso il pavimento.","La scapola resta bloccata sotto il peso del corpo. Senti allungare dietro la spalla, mai dolore."],
    err:["Non bloccare la scapola: l'allungamento si perde."]},
  mobRullo:{n:"Mobilizzazione della schiena sul rullo", step:0, inc:0, unit:"rullo (foam roller)", yt:"foam roller thoracic extension", src:"Fitness posturale, atlante cap. 4, E.5", bw:true,
    how:["Sdraiato con un rullo sotto la parte alta della schiena, anche e ginocchia piegate.","Mani intrecciate dietro la nuca: estendi la schiena cercando di avvicinare la testa al pavimento.","Sposta il rullo su punti diversi della schiena alta."],
    err:["Inarcare la zona lombare: deve restare piegata."]},
  diagManubrio:{n:"Diagonale con manubrio (gran dentato)", step:1, inc:1, unit:"manubrio", side:"per lato", yt:"dumbbell serratus punch diagonal", src:"Fitness posturale, atlante cap. 5, D.4",
    how:["In piedi o seduto, manubrio in mano e braccio lungo il fianco.","Porta il braccio in avanti e verso il centro del corpo spingendo la scapola in avanti; il gomito si piega a 90° e non supera la spalla.","Busto fermo, senza ruotare."],
    err:["Ruotare il busto."]},
  rematoreElastico:{n:"Rematore con elastico", step:0, inc:0, unit:"elastico", yt:"band row high elbows", src:"Fitness posturale, atlante cap. 5, C.3", bw:true,
    how:["In piedi, elastico fissato davanti a te, braccia tese in avanti; meglio con due maniglie separate.","Tira portando i gomiti indietro e alti, piegati a 90°, come delle gomitate all'indietro, e stringi le scapole alla fine.","Nel ritorno lascia andare un po' le scapole in avanti.","Scegli un elastico con cui arrivi alle ripetizioni con il margine indicato."],
    err:["Abbassare troppo i gomiti, vicino al busto."]},
  latElastico:{n:"Lat con elastico", step:0, inc:0, unit:"elastico", yt:"band lat pulldown kneeling", src:"Fitness posturale, atlante cap. 5, C.4", bw:true,
    how:["In affondo (o in ginocchio), elastico fissato in alto davanti a te, braccia tese in avanti e in alto; meglio con due maniglie.","Tira i gomiti in basso e indietro portando le scapole indietro e in basso.","Nel ritorno lascia salire un po' le scapole per allungare bene."],
    err:["Tirare con le spalle in avanti e le scapole aperte."]},
  alzateLateraliElastico:{n:"Alzate laterali con elastico", step:0, inc:0, unit:"elastico", yt:"band lateral raise", src:"Fitness posturale, atlante cap. 5, F.1", bw:true,
    how:["In piedi, elastico sotto il piede.","Solleva il braccio leggermente in avanti rispetto al fianco (piano della scapola), spingendo verso l'esterno: conta il gomito, non il polso.","Scapole leggermente indietro e in basso."],
    err:["Alzare le spalle verso le orecchie."]},
  curlElastico:{n:"Curl con elastico", step:0, inc:0, unit:"elastico", yt:"band bicep curl", src:"Indicazione generale (non presa dai manuali)", bw:true,
    how:["In piedi sull'elastico, impugnature in mano, braccia lungo i fianchi.","Piega i gomiti portando le mani verso le spalle; i gomiti restano fermi ai fianchi.","Torna giù lentamente."],
    err:["Dondolare con il busto."]},
  pushdownElastico:{n:"Tricipiti con elastico (push down)", step:0, inc:0, unit:"elastico", yt:"band tricep pushdown", src:"Indicazione generale (non presa dai manuali)", bw:true,
    how:["Elastico fissato in alto (una porta, una sbarra), impugnature in mano, gomiti piegati vicino ai fianchi.","Distendi i gomiti spingendo verso il basso; i gomiti non si muovono.","Torna su lentamente."],
    err:["Gomiti che si allontanano dal busto."]},
  legCurlSeduto:{n:"Leg curl da seduto", step:2.5, inc:2.5, unit:"macchina", yt:"seated leg curl tecnica", src:"Maeo 2021",
    how:["Siediti con la schiena ben appoggiata e le ginocchia allineate al perno della macchina; blocca le cosce con il rullo superiore.","Cuscinetto inferiore appena sopra i talloni.","Piega le ginocchia portando i talloni sotto il sedile, poi torna lentamente fino quasi a gambe distese."],
    err:["Bacino che scivola in avanti sul sedile.","Ritorno veloce senza controllo.","Ampiezza ridotta: arriva fin quasi a gambe distese."]},
  tricipitiOverheadCavo:{n:"Estensioni sopra la testa al cavo", step:2.5, inc:2.5, unit:"cavi", yt:"overhead cable triceps extension tecnica", src:"Maeo 2022",
    how:["Cavo in basso con la corda; girati di spalle, un piede avanti, busto leggermente inclinato.","Braccia sopra la testa, gomiti vicini e rivolti in avanti.","Distendi i gomiti fino in fondo, poi torna lentamente lasciando che le mani scendano dietro la testa."],
    err:["Gomiti che si aprono molto.","Schiena che si inarca per spingere.","Accorciare la discesa."]},
  tricipitiOverheadManubrio:{n:"Estensioni sopra la testa con manubrio", step:2, inc:2, unit:"manubrio", yt:"estensioni tricipiti manubrio sopra la testa tecnica", src:"Maeo 2022",
    how:["Seduto con schienale, un manubrio tenuto a due mani sopra la testa.","Gomiti vicini e rivolti in avanti: scendi lentamente dietro la nuca.","Risali distendendo i gomiti."],
    err:["Gomiti che si allargano.","Zona lombare inarcata."]},
  smithSquat:{n:"Squat al multipower (Smith)", step:2.5, inc:5, unit:"bilanciere guidato (escluso il bilanciere)", yt:"smith machine squat tecnica", src:"PE2 pp. 220-222",
    how:["Bilanciere sulle spalle come nello squat classico, piedi sotto il bilanciere alla larghezza delle spalle.", "Sblocca ruotando i polsi e scendi come nello squat libero: il busto si inclina un po' in avanti e le ginocchia possono superare le punte.", "Risali spingendo con tutta la pianta; a fine serie riaggancia ruotando i polsi."],
    err:["Piedi molto avanti e busto verticale (la variante \"salva schiena\"): sposta lo stress sul ginocchio e non protegge la schiena.", "Caricare molto più che nello squat libero solo perché la macchina guida."]},
  pecDeck:{n:"Croci alla macchina (pec deck)", step:2.5, inc:2.5, unit:"macchina", yt:"pec deck tecnica", src:"PE1 pp. 216-217, 229-230",
    how:["Regola il sedile in modo che i gomiti restino un po' più bassi delle spalle.", "Scapole strette e abbassate prima di partire, gomiti leggermente piegati e fermi.", "Chiudi le braccia davanti al petto, poi torna lentamente senza aprire oltre la linea delle spalle."],
    err:["Gomiti alti all'altezza delle spalle (la versione classica, sconsigliata se la spalla dà fastidio).", "Spalle che salgono verso le orecchie."]},
  alzateLateraliCavo:{n:"Alzate laterali al cavo", step:1.25, inc:1.25, unit:"cavo (un braccio)", side:"per braccio", yt:"alzate laterali cavo tecnica", src:GEN,
    how:["Cavo in basso, impugnatura nella mano opposta al cavo, che passa davanti al corpo.","Solleva il braccio di lato fino all'altezza della spalla, gomito appena piegato.","Scendi lentamente fino a sotto il fianco."],
    err:["Slanci con il busto.","Polso più alto del gomito."]},
  curlCavo:{n:"Curl al cavo basso", step:2.5, inc:2.5, unit:"cavi", yt:"curl al cavo tecnica", src:"PE1 pp. 326-328",
    how:["Barra dritta o corda al cavo basso, in piedi a mezzo passo dalla macchina.", "Tronco fermo e spalla leggermente flessa (gomiti un filo avanti): piega fino in alto, poi torna lentamente a braccia distese."],
    err:["Spalla che si estende portando i gomiti indietro per aiutarsi.", "Slanci con la schiena."]},
  curlScott:{n:"Curl su panca inclinata a 30° (gomiti liberi)", step:2.5, inc:2.5, unit:"bilanciere EZ o macchina", yt:"preacher curl panca 30 gradi", src:"PE1 pp. 304, 310-311",
    how:["Panca inclinata a circa 30°: appoggia il petto sullo schienale e lascia le braccia libere davanti, gomiti NON bloccati su un cuscino.", "Spalla flessa a circa 90°: piega i gomiti fino in alto, poi scendi lentamente quasi a braccia distese."],
    err:["Usare la panca Scott classica con i gomiti bloccati sul cuscino: il manuale la sconsiglia per lo stress sul gomito.", "Rimbalzo in basso a braccia completamente distese."]},
  latPresaStretta:{n:"Lat machine, presa stretta neutra", step:2.5, inc:2.5, unit:"macchina", yt:"lat machine presa stretta triangolo tecnica", src:"PE1 pp. 249-250",
    how:["Maniglia a triangolo (presa neutra), cosce bloccate sotto i rulli.", "Petto in fuori, porta la maniglia verso la parte alta del petto spingendo i gomiti verso il basso.", "Risali lentamente fino a braccia distese. Attiva il gran dorsale come la presa prona ed è la versione più adatta a chi inizia."],
    err:["Dondolare con il busto.", "Fermarsi a metà nella risalita."]},
  cardioLeggero:{n:"Cardio leggero", step:0, inc:0, unit:"cyclette, vogatore o camminata", yt:"riscaldamento cyclette palestra", src:GEN, bw:true,
    how:["3-5 minuti a ritmo tranquillo: devi riuscire a parlare.","Serve soprattutto se arrivi da fermo o hai freddo; se sei già caldo puoi accorciarlo."],
    err:["Farlo intenso: deve scaldare, non stancare."]},
  legSwing:{n:"Slanci delle gambe", step:0, inc:0, unit:"corpo libero", side:"per gamba", yt:"leg swings riscaldamento", src:GEN, bw:true,
    how:["In piedi, una mano appoggiata al muro.","Slancia una gamba avanti e indietro in modo controllato, aumentando piano l'ampiezza.","Poi di lato, davanti all'altra gamba e verso l'esterno."],
    err:["Inarcare la schiena per salire di più.","Slanci bruschi fin dalla prima ripetizione."]},
  worldsGreatest:{n:"Affondo con rotazione", step:0, inc:0, unit:"corpo libero", side:"per lato", yt:"world's greatest stretch tecnica", src:GEN, bw:true,
    how:["Fai un affondo lungo in avanti e appoggia le mani a terra all'interno del piede avanti.","Porta il gomito verso la caviglia, poi ruota il busto aprendo il braccio verso il soffitto.","Torna e cambia lato. 2-3 secondi per posizione, senza rimbalzare."],
    err:["Ginocchio avanti che cade verso l'interno.","Ruotare solo il braccio senza il busto."]},
  squatCorpo:{n:"Squat a corpo libero lento", step:0, inc:0, unit:"corpo libero", yt:"squat corpo libero tecnica", src:GEN, bw:true,
    how:["Piedi come nello squat, braccia avanti per bilanciarti.","Scendi in 3 secondi fino in fondo, resta 1-2 secondi spingendo le ginocchia in fuori, risali."],
    err:["Talloni che si alzano.","Fermarsi a metà discesa."]},
  hingeBastone:{n:"Piegamento delle anche con bastone", step:0, inc:0, unit:"bastone o corpo libero", yt:"hip hinge bastone tecnica", src:GEN, bw:true,
    how:["Bastone lungo la schiena: tocca testa, dorso e osso sacro.","Ginocchia appena piegate, spingi il bacino indietro e inclina il busto finché senti tirare dietro le cosce, senza perdere i tre contatti.","Risali spingendo il bacino in avanti."],
    err:["Il bastone si stacca dalla zona lombare (schiena che si arrotonda).","Piegare troppo le ginocchia trasformandolo in uno squat."]},
  rotBraccia:{n:"Circonduzioni delle braccia", step:0, inc:0, unit:"corpo libero", yt:"circonduzioni braccia riscaldamento", src:GEN, bw:true,
    how:["Braccia tese, cerchi ampi e lenti in avanti e poi all'indietro.","Aggiungi qualche apertura e chiusura delle braccia davanti al petto."],
    err:["Movimenti veloci e piccoli."]},
  dislocazioni:{n:"Passaggi con bastone o elastico", step:0, inc:0, unit:"bastone o elastico", yt:"shoulder dislocates bastone", src:GEN, bw:true,
    how:["Presa larga, braccia tese davanti alle cosce.","Porta il bastone sopra la testa e dietro la schiena, poi torna, senza piegare i gomiti.","Se non passa senza fastidio, allarga la presa."],
    err:["Piegare i gomiti o inarcare la schiena per passare.","Forzare con dolore alla spalla."]},
  pushupScapolari:{n:"Piegamenti scapolari", step:0, inc:0, unit:"corpo libero", yt:"scapular push up tecnica", src:GEN, bw:true,
    how:["In posizione di piegamento (anche sulle ginocchia), braccia tese.","Senza piegare i gomiti, avvicina le scapole lasciando scendere il petto di pochi centimetri, poi spingi il pavimento allontanandole."],
    err:["Piegare i gomiti.","Bacino che crolla."]},
  crunchInverso:{n:"Crunch inverso", step:0, inc:0, unit:"corpo libero", yt:"crunch inverso tecnica", src:"PE2 pp. 99-100, 125", bw:true,
    how:["Sdraiato su panca o a terra, gambe piegate sollevate, mani ai lati o alla panca.", "Fletti solo la zona lombare: stacca l'osso sacro e spingi le gambe verso l'alto, poi torna lentamente."],
    err:["Muovere solo le anche portando le gambe avanti e indietro.", "Slanciare le gambe."]}
};

/* ============ prescrizioni ============ */
// tipi: range | fixed (RM) | rpe | pyr | emom | time | test
const P = {

let sync = {state:"local", db:null, col:null, timer:null};
const writeChains = {};
function writeDoc(id, data){
  if(!sync.col) return;
  const prev = writeChains[id] || Promise.resolve();
  writeChains[id] = prev.then(() => sync.col.doc(id).set(data)).catch(() => { setSync("warn"); });
}
let metaTimer = null;
function pushMeta(){ S.metaAt = Date.now(); saveLocal(); clearTimeout(metaTimer); metaTimer = setTimeout(() => writeDoc("meta", {kind:"meta", settings:S.settings, planned:S.planned, profile:S.profile, body:S.body, metaAt:S.metaAt}), 800); }

async function initSync(){
  if(!window.claude || !window.claude.use){ setSync("local"); return; }
  setSync("wait");
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user){ setSync("local"); return; }
    const id = await user.id();
    if(!id){ setSync("local"); return; }
    sync.db = db; sync.col = db.collection("data/users/" + id);
    let first = true;
    sync.timer = setTimeout(() => setSync("warn"), 10000);
    sync.col.onSnapshot(snap => {
      let changed = false;
      const remoteIds = new Set();
      for(const d of snap.docs){
        const v = d.data(); if(!v) continue; remoteIds.add(d.id);
        if(v.kind === "meta"){ if((v.metaAt||0) > (S.metaAt||0)){ S.settings = {...DEFAULT.settings, ...v.settings}; S.planned = v.planned || {}; S.profile = v.profile || S.profile || {}; S.body = v.body || S.body || []; S.metaAt = v.metaAt; changed = true; } }
        else if(v.kind === "session"){ const loc = S.sessions[v.id]; if(!loc || (v.updatedAt||0) > (loc.updatedAt||0)){ const c = {...v}; delete c.kind; S.sessions[v.id] = c; changed = true; } }
      }
      if(!snap.metadata.fromCache){
        clearTimeout(sync.timer); setSync("ok");
        if(first){ first = false;
          for(const sess of Object.values(S.sessions)){ if(!remoteIds.has("s-" + sess.id)) pushSession(sess); }
          if(!remoteIds.has("meta") && (S.metaAt || Object.keys(S.planned).length)) pushMeta();
        }
      }
      if(changed){ saveLocal(); render(); }
    }, () => { clearTimeout(sync.timer); setSync("warn"); });
  }catch(e){ setSync("local"); }
}

/* ============ Oggi ============ */
function weekStats(){
  const t = parseYmd(todayStr()); const dow = (t.getDay()+6)%7; const mon = new Date(t); mon.setDate(t.getDate()-dow);
  const monS = ymd(mon);
  const list = doneSessions();
  const thisWeek = list.filter(x => x.date >= monS).length;
  const planned = Object.keys(S.planned).filter(d => S.planned[d] && d >= monS && daysBetween(monS, d) < 7).length;
  const last = list[list.length-1];
  return {thisWeek, planned, total:list.length, last};
}
function trackHtml(pos){
  const cells = []; for(let w=1; w<=WEEKS; w++){ const k = weekKind(w); cells.push(`<i class="${k}${w < pos.week ? " done" : ""}${w === pos.week ? " now" : ""}" title="Settimana ${w}"></i>`); }
  return `<div class="track" aria-label="Settimana ${pos.week} di ${WEEKS}">${cells.join("")}</div><div class="tracklbl"><span>Fase 1</span><span>T</span><span>Fase 2</span><span>T</span><span>Fase 3</span><span>T</span></div>`;
}
let homeExpand = false;
function sessionsToNextTest(pos){
  let p = {...pos}, n = 0;
  if(weekKind(p.week) === "test") return 0;
  while(weekKind(p.week) !== "test" && n < 200){ p = advance(p); n++; }
  return n;
}
function weekStripHtml(){
  const t = todayStr(); const td = parseYmd(t); const dow = (td.getDay()+6)%7;
  const mon = new Date(td); mon.setDate(td.getDate()-dow);
  const fc = forecast();
  const L = ["L","M","M","G","V","S","D"];
  let cells = "";
  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i); const ds = ymd(d);
    const done = sessionOn(ds), pl = !!S.planned[ds], po = postureOn(ds);
    let cls = "wd";
    if(ds === t) cls += " today";
    if(done) cls += " done"; else if(pl && ds >= t) cls += " plan"; else if(pl) cls += " miss";
    const code = done ? done.code : (fc[ds] ? buildSession(fc[ds], S.settings).code : "");
    cells += `<button class="${cls}" data-act="openDay" data-d="${ds}" aria-label="${esc(fmtDate(ds))}"><span class="wl">${L[i]}</span><span class="wn">${d.getDate()}</span><span class="wc">${esc(code)}${po ? '<i class="wp"></i>' : ""}</span></button>`;
  }
  return `<div class="weekstrip">${cells}</div>`;
}
function whenLbl(t, ds){ const g = daysBetween(t, ds); return g === 1 ? "Domani" : fmtDate(ds).replace(/^./, c => c.toUpperCase()); }
function upcomingAll(t, n){ // i prossimi allenamenti di tutte le attività, in ordine
  const out = [], fc = gymOn() ? forecast() : {}, d0 = parseYmd(t);
  for(let i = 1; i <= 42 && out.length < n; i++){
    const x = new Date(d0); x.setDate(d0.getDate()+i); const ds = ymd(x);
    if(fc[ds]) out.push({ds, c:"var(--accent)", n:dn(buildSession(fc[ds], S.settings)), sub:"Palestra · " + posLabel(fc[ds])});
    const r = runPlannedOn(ds); if(r) out.push({ds, c:RUN_C[r.t] || "var(--c2)", n:r.title, sub:"Corsa · ~" + Math.round(sessionMin(r, runPacesNow())) + " min"});

  return out.slice(0, n);

      : `<label class="switch o-switch"><input type="checkbox" id="deloadToggle"><span><b>Settimana di scarico</b><br><span class="small muted">${sess.kind === "gen" ? "Serie -40%, stessi pesi e stesso margine" : "Metà delle serie, pesi -15%"}</span></span></label>${sess.kind === "gen" ? `<button class="btn ghost sm" data-act="deloadCheck" style="padding-left:0">Serve uno scarico? Controlla</button>` : ""}

/* ============ Piano: calendario ============ */
function calHtml(){
  const {y, m} = calMonth;
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const start = new Date(y, m, 1 - startOffset);
  const t = todayStr();
  const fc = forecast();
  const nCells = Math.ceil((startOffset + new Date(y, m+1, 0).getDate()) / 7) * 7;
  let cells = "";
  for(let i = 0; i < nCells; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = ymd(d);
    const done = sessionOn(ds), pl = !!S.planned[ds], po = postureOn(ds);
    let cls = "day", lbl = "";
    if(d.getMonth() !== m) cls += " out";
    if(ds === t) cls += " today";
    if(done){ cls += " done"; lbl = done.code; }
    else if(pl && ds >= t){ cls += " planned"; const p = fc[ds]; lbl = p ? buildSession(p, S.settings).code : ""; }
    else if(pl && ds < t){ cls += " missed"; lbl = "—"; }
    if(po) cls += " posture";
    const rd = runDoneOn(ds), rp = !rd && ds >= t ? runPlannedOn(ds) : null;
    if(rd || rp){ cls += rd ? " rundone" : " runplan"; if(!lbl) lbl = rd ? "✓" : ""; }
    if(!gymOn() && !rd && !rp && !vbDoneOn(ds) && !vbPlannedOn(ds) && !bkDoneOn(ds) && !bkPlannedOn(ds)){ cls = cls.replace(/ (done|planned|missed)/g, ""); lbl = ""; }
    cells += `<button class="${cls}" data-act="openDay" data-d="${ds}" aria-label="${esc(fmtDate(ds))}"><span class="n">${d.getDate()}</span><span class="lbl">${esc(lbl)}</span>${rd || rp ? '<i class="rnd"></i>' : ""}${vbDoneOn(ds) || (ds >= t && vbPlannedOn(ds)) ? `<i class="vbd ${vbDoneOn(ds) ? "on" : ""}"></i>` : ""}${bkDoneOn(ds) || (ds >= t && bkPlannedOn(ds)) ? `<i class="bkd ${bkDoneOn(ds) ? "on" : ""}"></i>` : ""}</button>`;
  }
  return `<div class="o-sec" id="calendario"><div class="o-head"><span class="o-label">Calendario</span><span class="r">tocca un giorno per i dettagli o un'eccezione</span></div>
      <div class="row between" style="margin-top:8px"><button class="btn icon ghost" data-act="month" data-dir="-1" aria-label="Mese precedente">‹</button><h2 style="text-transform:capitalize">${MESI[m]} ${y}</h2><button class="btn icon ghost" data-act="month" data-dir="1" aria-label="Mese successivo">›</button></div>
      <div class="cal">${["L","M","M","G","V","S","D"].map(x => `<div class="dow">${x}</div>`).join("")}${cells}</div>
      <div class="legend"><span><i class="sw" style="background:var(--accent)"></i>Fatto</span><span><i class="sw" style="border:2px solid var(--accent)"></i>In programma</span><span><i class="sw" style="border:1px dashed var(--muted)"></i>Saltato</span><span><i class="sw" style="background:var(--post)"></i>Posturale a casa</span>${runActive() || runSessions().length ? `<span><i class="sw" style="background:var(--c2);border-radius:50%;width:8px;height:8px"></i>Corsa</span>` : ""}${vbActive() || vbSessions().length ? `<span><i class="sw" style="background:var(--c3);border-radius:2px;width:8px;height:8px"></i>Salto</span>` : ""}${bkActive() || bkSessions().length ? `<span><i class="sw" style="background:var(--c4);border-radius:50%;width:8px;height:8px"></i>Bici</span>` : ""}</div>
    </div>`;
}

/* ============ Piano: la mia settimana e i piani ============ */
const VB_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 12a8 8 0 0 0 8 4"/><path d="M7.5 13.5a12 12 0 0 0 8.5 6.5"/><path d="M12 12a8 8 0 0 0-7.464 4.928"/><path d="M12.951 7.353a12 12 0 0 0-9.88 4.111"/><path d="M12 12a8 8 0 0 0-.536-8.928"/><path d="M15.549 15.147a12 12 0 0 0 1.38-10.65"/></svg>'; // disegno: Tabler Icons "ball-volleyball" (licenza MIT)
function gymWeekDays(){ // giorni dei pesi: quelli salvati, altrimenti quelli segnati nelle prossime 2 settimane
  const c = S.settings.combo; if(c && c.gymDays && c.gymDays.length) return c.gymDays.slice();
  const t = todayStr(); return [...new Set(Object.keys(S.planned).filter(k => S.planned[k] && k >= t && daysBetween(t, k) < 14).map(dowOf))].sort((a,b) => a-b);
}
function extendGym(){ // i giorni dei pesi si segnano una volta: il calendario si allunga da solo di 8 settimane
