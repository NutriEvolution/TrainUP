name: Pubblica APK

on:
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepara i file dell'app
        run: python3 tools/build_www.py

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Mancano i secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compila
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ripresa
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          gradle assembleRelease -PversionName="$V" --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "TrainUP-$V.apk"

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TrainUP ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: TrainUP-${{ env.VERSION }}.apk
          body_path: NOVITA.md
